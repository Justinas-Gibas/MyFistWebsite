<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Listing</title>
</head>
<body>
  <h1>File Listing</h1>
  <div>
    <label for="bucket">Select Bucket:</label>
    <select id="bucket">
      <option value="jgmusic">JGMusic</option>
      <option value="artworks">Artworks</option>
    </select>
    <button id="fetchFiles">Fetch Files</button>
  </div>
  <ul id="file-list"></ul>

  <script>
    document.getElementById('fetchFiles').addEventListener('click', async () => {
      const bucket = document.getElementById('bucket').value;
      try {
        // Replace with your live Vercel API URL for listing files
        const response = await fetch(`https://haveno-vercel.vercel.app/api/list-files?bucket=${encodeURIComponent(bucket)}`);
        const result = await response.json();
        const listElement = document.getElementById('file-list');
        listElement.innerHTML = '';
        if (result.files && result.files.length) {
          result.files.forEach(file => {
            // Create a link that uses the get-file API endpoint
            const li = document.createElement('li');
            li.innerHTML = `<a href="https://haveno-vercel.vercel.app/api/get-file?bucket=${encodeURIComponent(bucket)}&file=${encodeURIComponent(file.name)}" target="_blank">${file.name}</a>`;
            listElement.appendChild(li);
          });
        } else {
          listElement.innerHTML = '<li>No files found</li>';
        }
      } catch (error) {
        console.error('Error fetching files:', error);
      }
    });
  </script>
</body>
</html>
