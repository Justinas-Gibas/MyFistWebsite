<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Sharing - Version 1.0.3</title>
  <style>
    body {
      background-color: #2d2d2d;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background-color: #3a3a3a;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    label, select, button {
      display: block;
      margin: 10px 0;
      font-size: 16px;
    }

    select, button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
    }

    button {
      background-color: #007bff;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #file-list {
      list-style: none;
      padding: 0;
    }

    .file-item {
      background-color: #4b4b4b;
      padding: 15px;
      margin: 10px 0;
      border-radius: 4px;
    }

    .file-name {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .play-btn {
      background-color: #28a745;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
    }

    .play-btn:hover {
      background-color: #218838;
    }

    .audio-player {
      margin-top: 10px;
    }

    .loading {
      color: #ffc107;
      font-style: italic;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Music Sharing - Version 1.0.3</h1>
    <label for="bucket">Select Bucket:</label>
    <select id="bucket">
      <option value="jgmusic">JGMusic</option>
      <option value="artworks">Artworks</option>
    </select>
    <button id="fetchFiles">Fetch Files</button>
    
    <ul id="file-list">
      <!-- File items will be inserted here -->
    </ul>
  </div>

  <script>
    const version = "1.0.3";
    const fetchFilesBtn = document.getElementById('fetchFiles');
    const fileList = document.getElementById('file-list');
    const bucketSelect = document.getElementById('bucket');

    // Function to create an individual file item with lazy-loaded audio
    function createFileItem(file, bucket) {
      const li = document.createElement('li');
      li.className = "file-item";

      // Display file name
      const fileNameEl = document.createElement('div');
      fileNameEl.className = "file-name";
      fileNameEl.textContent = file.name;
      li.appendChild(fileNameEl);

      // Create play button
      const playBtn = document.createElement('button');
      playBtn.className = "play-btn";
      playBtn.textContent = "Play";
      li.appendChild(playBtn);

      // Create container for audio player and loading indicator
      const playerContainer = document.createElement('div');
      playerContainer.className = "audio-player";
      playerContainer.style.display = "none";

      // Loading message
      const loadingMsg = document.createElement('div');
      loadingMsg.className = "loading";
      loadingMsg.textContent = "Loading audio...";
      playerContainer.appendChild(loadingMsg);

      // Audio element – hidden until ready
      const audioEl = document.createElement('audio');
      audioEl.controls = true;
      audioEl.style.display = "none";
      playerContainer.appendChild(audioEl);

      li.appendChild(playerContainer);

      // Handle play button click
      playBtn.addEventListener('click', async () => {
        // If not already loaded, lazy-load the audio source
        if (!playerContainer.dataset.loaded) {
          playerContainer.style.display = "block";
          try {
            const fileUrl = `https://haveno-vercel.vercel.app/api/get-file?bucket=${encodeURIComponent(bucket)}&file=${encodeURIComponent(file.name)}`;
            audioEl.src = fileUrl;
            audioEl.load();

            // When audio is ready, hide the loading message and display controls
            audioEl.addEventListener('canplaythrough', () => {
              loadingMsg.style.display = "none";
              audioEl.style.display = "block";
              audioEl.play().catch(err => console.error("Play error:", err));
              playerContainer.dataset.loaded = "true";
            });

            // Error handling for audio load errors
            audioEl.addEventListener('error', (err) => {
              console.error("Audio error:", err);
              loadingMsg.textContent = "Failed to load audio.";
            });
          } catch (err) {
            console.error("Error loading audio:", err);
            loadingMsg.textContent = "Error loading audio.";
          }
        } else {
          // Toggle play/pause if already loaded
          if (audioEl.paused) {
            audioEl.play().catch(err => console.error("Play error:", err));
          } else {
            audioEl.pause();
          }
        }
      });

      return li;
    }

    // Fetch file list from API and render them
    fetchFilesBtn.addEventListener('click', async () => {
      const bucket = bucketSelect.value;
      fileList.innerHTML = "";
      try {
        console.log(`[Version ${version}] Fetching files from bucket: ${bucket}`);
        const response = await fetch(`https://haveno-vercel.vercel.app/api/list-files?bucket=${encodeURIComponent(bucket)}`);
        const result = await response.json();
        if (result.files && result.files.length > 0) {
          result.files.forEach(file => {
            const fileItem = createFileItem(file, bucket);
            fileList.appendChild(fileItem);
          });
        } else {
          fileList.innerHTML = "<li>No files found.</li>";
        }
      } catch (error) {
        console.error(`[Version ${version}] Error fetching files:`, error);
        fileList.innerHTML = "<li>Error fetching files.</li>";
      }
    });
  </script>
</body>
</html>
