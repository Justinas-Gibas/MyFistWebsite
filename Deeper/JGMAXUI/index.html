<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JGMAX UI</title>
    <style>
        /* Color variables */
        :root {
            --color-background: #838383;
            --color-border: #000000;
            --color-text: #9e9e9e;
            --color-primary: #5e5e5e;
            --color-hover: #7a7a7a;
            --color-active: #9e9e9e;

        }

        * {
            user-select: none;
        }

    </style>
</head>
<body style="
    margin: 0; 
    padding: 0; 
    height: 100vh; 
    overflow: hidden;
    font-family: Arial, sans-serif;
    
">

    <!-- Top left corner - positioned exactly -->
    <div 
    title="'Select' mode"
    onclick="handleSelectMode()"
    onmouseover="this.style.backgroundColor='var(--color-hover)'"
    onmouseout="this.style.backgroundColor='var(--color-primary)'"
    style="
        background-color: var(--color-primary);
        border: 1px solid var(--color-border);
        width: 60px;         
        height: 60px;          
        position: fixed;      
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        z-index: 10;
        /*transition: all 0.2s ease;*/

    " class="hotbar top left corner">
        <svg viewBox="0 0 24 24"
             style="scale: 0.8; fill: var(--color-background);">
            <path d="M16 2a1 1 0 000 2h4V8a1 1 0 002 0V2m0 14a1 1 0 00-2 0v4H16a1 1 0 000 2h6M8 22a1 1 0 000-2H4V16A1 1 0 002 16v6M2 8A1 1 0 004 8V4H8A1 1 0 008 2H2"/>
        </svg>
    </div>

    <!-- Top bar - stretches between corners -->
    <div 
    title="Top Bar"
    style="
        background-color: var(--color-primary);
        border: 1px solid var(--color-border);
        height: 60px;          
        position: fixed;
        top: 0;
        left: 60px;            
        right: 60px;           
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        z-index: 5;
    " class="hotbar top">
        <!-- Centered content in the top bar -->
        
        <div
        title="Create a new file"
        onclick="handleNew()"
        onmouseover="this.style.backgroundColor='var(--color-hover)'"
        onmouseout="this.style.backgroundColor='var(--color-primary)'"
        style="
            margin-left: 20px;
            border: 1px solid var(--color-border);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px; 
            color: var(--color-border);
            cursor:pointer
        ">
            New
        </div>


        
        <div 
        title="Load an existing file"
        onclick="handleOpen()"
        onmouseover="this.style.backgroundColor='var(--color-hover)'"
        onmouseout="this.style.backgroundColor='var(--color-primary)'"
        style="
            margin-left: 20px;
            border: 1px solid var(--color-border);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px; 
            color: var(--color-border);
            cursor:pointer
        ">
            Load
        </div>
        <div 
        title="Save current work"
        onclick="handleSave()"
        onmouseover="this.style.backgroundColor='var(--color-hover)'"
        onmouseout="this.style.backgroundColor='var(--color-primary)'"
        style="
            margin-left: 20px;
            border: 1px solid var(--color-border);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px; 
            color: var(--color-border);
            cursor:pointer
        ">
            Save
        </div>

    </div>

    <!-- Top right corner -->
    <div 
    title="Close the application"
    onclick="handleClose()"
    onmouseover="this.style.backgroundColor='var(--color-hover)'"
    onmouseout="this.style.backgroundColor='var(--color-primary)'"
    style="
        background-color: var(--color-primary);
        border: 1px solid var(--color-border);
        width: 60px;
        height: 60px;
        position: fixed;
        top: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        z-index: 10;
        cursor:pointer
    " class="hotbar top right corner">
        ☰✕≡ ⋮ ⋯
    </div>

    <!-- Left bar - stretches vertically -->
    <div 
    title="Tools"
    style="
        background-color: var(--color-primary);
        border: 1px solid var(--color-border);
        width: 60px;
        position: fixed;
        top: 60px;             /* Start after top corner */
        left: 0;
        bottom: 60px;          /* End before bottom corner */
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        writing-mode: vertical-lr;  /* Vertical text for narrow space */
        z-index: 5;
    " class="hotbar left">
        <div 
        title="Tool 1"
        onclick="handletool1()"
        onmouseover="this.style.backgroundColor='var(--color-hover)'"
        onmouseout="this.style.backgroundColor='var(--color-primary)'"
        style="
            margin-top: 20px;
            border: 1px solid var(--color-border);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            writing-mode: horizontal-tb; 
            color: var(--color-border);
            cursor:pointer
        ">
            Tool 1
        </div>
        <div 
        title="Tool 2"
        onclick="handletool2()"
        onmouseover="this.style.backgroundColor='var(--color-hover)'"
        onmouseout="this.style.backgroundColor='var(--color-primary)'"
        style="
            margin-top: 20px;
            border: 1px solid var(--color-border);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px; 
            writing-mode: horizontal-tb;
            color: var(--color-border);
            cursor:pointer
        ">
            ⚒ 🛠 ⛏
        </div>
    </div>

    <!-- Main content - fills center space -->
    <div style="
        background-color: var(--color-background);
        border: 1px solid var(--color-border);
        position: fixed;
        top: 60px;
        left: 60px;
        right: 60px;
        bottom: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        overflow: auto;
        z-index: 1;
    " class="main-content">
        Main Content Area
    </div>

    <!-- Right bar -->
    <div 
    title="Properties and Settings (Hotbar)"
    style="
        background-color: var(--color-primary);
        border: 1px solid var(--color-border);
        width: 60px;
        position: fixed;
        top: 60px;
        right: 0;
        bottom: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        writing-mode: vertical-lr;
        z-index: 5;
    " class="hotbar right">
        <div 
        title="Property 1"
        onclick="handleProperty1()"
        onmouseover="this.style.backgroundColor='var(--color-hover)'"
        onmouseout="this.style.backgroundColor='var(--color-primary)'"
        style="
            margin-top: 20px;
            border: 1px solid var(--color-border);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px; 
            writing-mode: horizontal-tb; 
            color: var(--color-border);
            cursor:pointer
        ">
            Prop 1
        </div>
        <div title="Property 2"
        onclick="handleProperty2()"
        onmouseover="this.style.backgroundColor='var(--color-hover)'"
        onmouseout="this.style.backgroundColor='var(--color-primary)'"
        style="
            margin-top: 20px;
            border: 1px solid var(--color-border);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px; 
            writing-mode: horizontal-tb; 
            color: var(--color-border);
            cursor:pointer
        ">
            ⚙ ⛭ ⛯
        </div>

    </div>

    <!-- Bottom left corner -->
    <div 
    title="Undo Action"
    onclick="handleUndo()"
    onmouseover="this.style.backgroundColor='var(--color-hover)'"
    onmouseout="this.style.backgroundColor='var(--color-primary)'"
    style="
        background-color: var(--color-primary);
        border: 1px solid var(--color-border);
        width: 60px;
        height: 60px;
        position: fixed;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        z-index: 10;
    " class="hotbar bottom left corner">
        ◀
    </div>

    <!-- Bottom bar -->
    <div 
    title="Actions and Status"
    style="
        background-color: var(--color-primary);
        border: 1px solid var(--color-border);
        height: 60px;
        position: fixed;
        bottom: 0;
        left: 60px;
        right: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 22px;
        z-index: 5;
    " class="hotbar bottom">

        <!-- Left side of the bottom bar -->
        <div 
        title="Left Action"
        onclick="handleLeftAction()"
        onmouseover="this.style.backgroundColor='var(--color-hover)'"
        onmouseout="this.style.backgroundColor='var(--color-primary)'"
        style="
            border: 1px solid var(--color-border);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--color-border);
            cursor:pointer
        ">
            Test
        </div>

        <!-- Centered Text in the bottom bar -->
        Status: Ready 
        ⌂ ⌘ + ✚🗑⌫✂ ✄☎✉ ⛓🗝🖨 🖶★ ☆♥ ❤
        <!-- Right side of the bottom bar -->
        <div style="
            border: 1px solid var(--color-border);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px; 
            color: var(--color-border);
            cursor:pointer
        ">
            Test

    </div>

    <!-- Bottom right corner -->
    <div 
    title="Redo Action"
    onclick="handleRedo()"
    onmouseover="this.style.backgroundColor='var(--color-hover)'"
    onmouseout="this.style.backgroundColor='var(--color-primary)'"
    style="
        background-color: var(--color-primary);
        border: 1px solid var(--color-border);
        width: 60px;
        height: 60px;
        position: fixed;
        bottom: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        z-index: 10;
    " class="hotbar bottom right corner">
        ▶
    </div>

    <script>
        function handleSelectMode() {
            console.log('Select mode action');
        }

        function handleNew() {
            console.log('New file action');
        }

        function handleOpen() {
            console.log('Open file action');
        }

        function handleSave() {
            console.log('Save file action');
        }

        function handleClose() {
            console.log('Close application action');
        }

        function handletool1() {
            console.log('Tool 1 action');
        }

        function handletool2() {
            console.log('Tool 2 action');
        }

        function handleProperty1() {
            console.log('Property 1 action');
        }

        function handleProperty2() {
            console.log('Property 2 action');
        }

        function handleUndo() {
            console.log('Undo action');
        }

        function handleRedo() {
            console.log('Redo action');
        }

        function handleLeftAction() {
            console.log('Left action');
        }




    </script>
</body>
</html>
