    <!-- Main script -->
    <script type="module">
        // Import Three.js from the CDN
        import * as THREE from 'three';
        import { color, screenUV, hue, reflector, time, Fn, vec2, length, atan, float, sin, cos, vec3, sub, mul, pow, blendDodge, normalWorld } from 'three/tsl';

        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        import Stats from 'three/addons/libs/stats.module.js';

        let camera, scene, renderer, controls;
        let stats

        // --- The Boid Class (The "Brain") ---
        class Boid {
            constructor() {
                // Create the visible 3D object for this boid
                const coneGeometry = new THREE.ConeGeometry(0.5, 2, 16);
                // Rotate the geometry so the tip points along the positive Z-axis
                coneGeometry.rotateX(Math.PI / 2);
                const coneMaterial = new THREE.MeshNormalMaterial();
                this.mesh = new THREE.Mesh(coneGeometry, coneMaterial);
            
                // Set random initial position and rotation
                this.mesh.position.x = THREE.MathUtils.randFloatSpread(100); // Spread over a 100-unit range
                this.mesh.position.y = THREE.MathUtils.randFloatSpread(100);
                this.mesh.position.z = THREE.MathUtils.randFloatSpread(100);
                this.mesh.rotation.x = Math.random() * 2 * Math.PI;
                this.mesh.rotation.y = Math.random() * 2 * Math.PI;
                this.mesh.rotation.z = Math.random() * 2 * Math.PI;
                
                // Physics and Control Properties ---
                this.velocity = new THREE.Vector3(
                    THREE.MathUtils.randFloatSpread(1),
                    THREE.MathUtils.randFloatSpread(1),
                    THREE.MathUtils.randFloatSpread(1)
                ).normalize(); // Start with a random unit vector direction
                this.acceleration = new THREE.Vector3();
                this.maxSpeed = 0.4; // How fast the boid can go
                this.maxForce = 0.1 ; // How quickly the boid can turn
            }

            // Rule 1: Separation - Steer to avoid crowding local flockmates.
            separation(neighbors) {
                const steering = new THREE.Vector3();
                let total = 0;
                for (let other of neighbors) {
                    const distance = this.mesh.position.distanceTo(other.mesh.position);
                    if (distance > 0) {
                        const diff = new THREE.Vector3().subVectors(this.mesh.position, other.mesh.position);
                        diff.normalize();
                        diff.divideScalar(distance); // Weight by distance (closer boids have stronger repulsion)
                        steering.add(diff);
                        total++;
                    }
                }
                if (total > 0) {
                    steering.divideScalar(total);
                }
                return steering;
            }
        
            // Rule 2: Alignment - Steer towards the average heading of local flockmates.
            alignment(neighbors) {
                const steering = new THREE.Vector3();
                let total = 0;
                for (let other of neighbors) {
                    steering.add(other.velocity);
                    total++;
                }
                if (total > 0) {
                    steering.divideScalar(total);
                    steering.sub(this.velocity); // Steer towards the average, not just match it
                }
                return steering;
            }
        
            // Rule 3: Cohesion - Steer to move toward the average position of local flockmates.
            cohesion(neighbors) {
                const steering = new THREE.Vector3();
                let total = 0;
                for (let other of neighbors) {
                    steering.add(other.mesh.position);
                    total++;
                }
                if (total > 0) {
                    steering.divideScalar(total);
                    steering.sub(this.mesh.position); // Get the vector from current position to the average position
                }
                return steering;
            }
        
            // A method to wrap the boid around the screen
            wrap(boundary) {
                if (this.mesh.position.x > boundary) this.mesh.position.x = -boundary;
                if (this.mesh.position.x < -boundary) this.mesh.position.x = boundary;
                if (this.mesh.position.y > boundary) this.mesh.position.y = -boundary;
                if (this.mesh.position.y < -boundary) this.mesh.position.y = boundary;
                if (this.mesh.position.z > boundary) this.mesh.position.z = -boundary;
                if (this.mesh.position.z < -boundary) this.mesh.position.z = boundary;
            }
        
            // The main update function, called every frame
            update(allBoids, boundary, perceptionRadius) {
                // --- 1. Scanning for neighbors ---
                const neighbors = [];
                for (let other of allBoids) {
                    if (this !== other) {
                        const distance = this.mesh.position.distanceTo(other.mesh.position);
                        if (distance < perceptionRadius) {
                            neighbors.push(other);
                        }
                    }
                }
            
                // --- 2. Calculate steering forces from rules ---
                if (neighbors.length > 0) {
                    const separationForce = this.separation(neighbors);
                    const alignmentForce = this.alignment(neighbors);
                    const cohesionForce = this.cohesion(neighbors);
                
                    // --- Give each force a weight ---
                    separationForce.multiplyScalar(1.5);
                    alignmentForce.multiplyScalar(0.1);
                    cohesionForce.multiplyScalar(0.1);
                
                    // --- Add forces to acceleration ---
                    this.acceleration.add(separationForce);
                    this.acceleration.add(alignmentForce);
                    this.acceleration.add(cohesionForce);
                }
            
                // --- 3. Apply physics ---
                this.velocity.add(this.acceleration);
                this.velocity.clampLength(0, this.maxSpeed); // Limit speed
                this.mesh.position.add(this.velocity);

                // --- Reset acceleration for the next frame ---
                // This is important to prevent forces from accumulating indefinitely
                // we need 
                this.acceleration.set(0, 0, 0); // Reset acceleration for the next frame
            
                // --- 4. Update rotation to match velocity ---
                if (this.velocity.lengthSq() > 0) {
                    // Create a target position in the direction of velocity
                    const targetPosition = this.mesh.position.clone().add(this.velocity);

                    // we need to slowly rotate the boid towards the target position
                    const direction = new THREE.Vector3().subVectors(targetPosition, this.mesh.position);
                    this.mesh.lookAt(targetPosition);
                }
            
                // --- 5. Wrap around boundaries ---
                this.wrap(boundary);
            }
        }


        //init();

        //async function init(){
        
        //}

        // Check if Three.js is properly loaded
        if (typeof THREE === 'undefined') {
            console.error('Three.js is not loaded properly!');
            document.body.innerHTML = '<p>Error: Could not load Three.js library. Check your internet connection.</p>';
        } else {
            console.log('Three.js loaded successfully:', THREE.REVISION);
            
            // Old Initialization
            //const scene = new THREE.Scene();
            //const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            //const renderer = new THREE.WebGLRenderer();
            //const renderer = new THREE.WebGPURenderer( { antialias: true } );
            //renderer.setSize(window.innerWidth, window.innerHeight);
            //document.body.appendChild(renderer.domElement);

            // Basic scene setup (example: a light)
            //const light = new THREE.AmbientLight(0x404040); // soft white light
            //scene.add(light);

            // New

            // --- Main Simulation Setup ---
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 80;
            const renderer = new THREE.WebGPURenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const boundary = 50;
            const perceptionRadius = 5;
            const particles = 1000;
            //const cubeGeometry = new THREE.BoxGeometry(boundary * 2, boundary * 2, boundary * 2);
            //const cubeMaterial = new THREE.MeshBasicMaterial({ color: 0xaaffff, wireframe: true });
            //scene.add(new THREE.Mesh(cubeGeometry, cubeMaterial));

            // Create an array to hold our boid "brains"
            const boids = [];
            for (let i = 0; i < particles; i++) {
                const boid = new Boid();
                boids.push(boid);
                scene.add(boid.mesh); // Add the boid's visible mesh to the scene
            }
            
            // OLL
            // Cones (Black)
            // Array to hold all the cones
            const cones = [];
            const numberOfCones = 20;
            // Vector grid resolution
            //const gridResolution = 10; // Number of cones along each axis

            // cone gemetry hight will show magnitude of vector
            const coneGeometry = new THREE.ConeGeometry( 1, 3, 32 );
            const coneMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00 });

            // Loop to create and place cones
            for (let i = 0; i < numberOfCones; i++) {
                const cone = new THREE.Mesh(coneGeometry, coneMaterial);

                // Set a random position inside the cube's boundaries
                cone.position.x = THREE.MathUtils.randFloatSpread(boundary * 2); // Spread over a 100-unit range
                cone.position.y = THREE.MathUtils.randFloatSpread(boundary * 2);
                cone.position.z = THREE.MathUtils.randFloatSpread(boundary * 2);

                // Set a random rotation
                cone.rotation.x = Math.random() * 2 * Math.PI;
                cone.rotation.y = Math.random() * 2 * Math.PI;
                cone.rotation.z = Math.random() * 2 * Math.PI;

                // Add the cone to the scene and to our array
                //scene.add(cone);
                //cones.push(cone);
                
            }
            
            //const cone = new THREE.Mesh(coneGeometry, coneMaterial);

            //camera.position.y = 30;

            // stats
			stats = new Stats();
			document.body.appendChild( stats.dom );

            // controls
            controls = new OrbitControls( camera, renderer.domElement );

            // Animation loop
            function animate() {
                // Update stats
                stats.update();
                // Request the next frame
                requestAnimationFrame(animate);

                // Black cones will reuse for other thing later)
                cones.forEach(cone => {
                    // Move the cone forward
                    cone.translateY(0.2);

                    // Wrap around the bounds: 4D space
                    if (cone.position.y > 50) {cone.position.y = -50;}
                    if (cone.position.y < -50) {cone.position.y = 50;}
                    if (cone.position.x > 50) {cone.position.x = -50;}
                    if (cone.position.x < -50) {cone.position.x = 50;}
                    if (cone.position.z > 50) {cone.position.z = -50;}
                    if (cone.position.z < -50) {cone.position.z = 50;}
                });


                // Tell each boid to update itself, passing in the list of all boids
                boids.forEach(boid => {
                    boid.update(boids, boundary, perceptionRadius);
                });

                // Update controls
                controls.update();
                // Render the scene
                renderer.renderAsync(scene, camera);
                //renderer.render(scene, camera);
            }

            animate();
        }
    </script>
