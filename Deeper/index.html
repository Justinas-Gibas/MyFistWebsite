<style>

    /* General styles */
    body {
        padding-top: 2rem;
    }

    /* Make sure the container does not exceed the width of the viewport */
    .container {
        width: 90%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0rem
    }

    /* Carousel styles */
    .carousel {
        position: relative;
        width: 100%;
        max-height: 80vh;
        overflow: hidden;
    }
    .slides {
        display: flex;
        width: calc(100% * var(--slide-count)); /* --slide-count is a CSS variable representing the number of slides */
        transform: translateX(var(--slide-translate));
        transition: transform 0.5s ease-out;
    }
    .slide {
        width: calc(100% / var(--slide-count)); /* Divide by the number of slides */
        flex-shrink: 0; /* Prevents the slide from shrinking */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 10px;
        box-sizing: border-box;
    }

    /* Media and captions within slides */
    .slide img, .slide video {
        max-width: 90%;
        max-height: 60vh;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }
    
    /* iframe styles */
    .slide iframe {
        width: 90%;
        height: 60vh;
        min-height: 400px;
        border: none;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }
    
    figcaption {
        text-align: center;
        color: lightgrey;
        margin-top: 15px;
        font-size: 1.1em;
        max-width: 90%;
    }

    /* Carousel controls */
    .carousel-control {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        border: none;
        padding: 10px;
        cursor: pointer;
    }
    .left {
        left: 0px;
    }
    .right {
        right: 0px;
    }

/* Responsive adjustments */
@media (max-width: 768px) {
    .container {
        width: 95%; /* Allow more space on smaller screens */
    }
    
    .slide {
        padding: 1rem;
    }
    
    .slide img, .slide video {

    }
    
    .slide iframe {
        width: 95%;
        height: 40vh;
        min-height: 300px;
    }
    
    figcaption {
        font-size: 1em;
        margin-top: 10px;
    }
}

    <script>
        /**
         * Carousel functionality
         * This script handles the slide movement and updates the CSS variables for multiple carousels.
         */
        document.addEventListener('DOMContentLoaded', (event) => {
            initializeCarousels();
        });

        function initializeCarousels() {
            const carousels = document.querySelectorAll('.carousel');
            
            carousels.forEach((carousel, carouselIndex) => {
                const slides = carousel.querySelectorAll('.slide');
                const totalSlides = slides.length;
                
                if (totalSlides === 0) return; // Skip empty carousels
                
                let slideIndex = 0;
                
                // Set unique CSS variables for each carousel
                carousel.style.setProperty('--slide-count', totalSlides.toString());
                carousel.style.setProperty('--slide-translate', '0%');
                
                const leftBtn = carousel.querySelector('.left');
                const rightBtn = carousel.querySelector('.right');
                
                if (leftBtn && rightBtn) {
                    leftBtn.addEventListener('click', () => moveSlide(-1));
                    rightBtn.addEventListener('click', () => moveSlide(1));
                }
                
                function moveSlide(step) {
                    slideIndex = (slideIndex + step + totalSlides) % totalSlides;
                    const translateValue = -(100 / totalSlides) * slideIndex;
                    carousel.style.setProperty('--slide-translate', `${translateValue}%`);
                }
            });
        }
    </script>
    <script>
        /**
         * GitHub repository fetching - Single API call approach
         * This script fetches the entire repository tree with one API call
         * and dynamically creates sections with carousels for each folder.
         */
        const username = "Justinas-Gibas";
        const repo = "MyFistWebsite";
        const branch = "ManoKumscioWebsaitas";
        
        async function fetchAllFiles() {
            const apiURL = `https://api.github.com/repos/${username}/${repo}/git/trees/${branch}?recursive=1`;
            
            const response = await fetch(apiURL);
            if (!response.ok) throw new Error("Failed to fetch repository tree");
            return await response.json();
        }
        
        async function createDynamicSections() {
            try {
                const treeData = await fetchAllFiles();
                console.log("Full repository tree:", treeData);
                
                // Filter for displayable files in the Deeper folder and its subfolders
                const displayableFiles = treeData.tree.filter(item => 
                    item.path.startsWith("Deeper/") && 
                    item.type === "blob" && 
                    (item.path.endsWith('.html') || 
                     item.path.endsWith('.jpg') || 
                     item.path.endsWith('.png') || 
                     item.path.endsWith('.gif') || 
                     item.path.endsWith('.mp4'))
                );
                
                console.log("Displayable files found:", displayableFiles);
                
                // Group files by their immediate parent folder
                const folderGroups = {};
                
                displayableFiles.forEach(file => {
                    const pathParts = file.path.split('/');
                    // Get the immediate parent folder (e.g., "Deeper/JGDemos" -> "JGDemos")
                    if (pathParts.length >= 3) {
                        const folderName = pathParts[1]; // Second part after "Deeper/"
                        const folderPath = `Deeper/${folderName}`;
                        
                        if (!folderGroups[folderName]) {
                            folderGroups[folderName] = {
                                name: folderName,
                                path: folderPath,
                                files: []
                            };
                        }
                        
                        folderGroups[folderName].files.push({
                            name: pathParts[pathParts.length - 1],
                            path: file.path,
                            fullPath: file.path
                        });
                    }
                });
                
                console.log("Folder groups:", folderGroups);
                
                const main = document.querySelector('main');
                
                // Create sections for each folder group
                for (const [folderName, folderData] of Object.entries(folderGroups)) {
                    // Skip lib folder
                    if (folderName === 'lib') continue;
                    
                    console.log(`Creating section for: ${folderName}`);
                    const section = createSectionWithCarousel(folderData);
                    if (section) {
                        main.appendChild(section);
                    }
                }
                
                // Reinitialize carousels after adding new ones
                initializeCarousels();
                
            } catch (error) {
                console.error("Error creating dynamic sections:", error);
            }
        }
        
        function createSectionWithCarousel(folderData) {
            try {
                if (folderData.files.length === 0) return null;
                
                // Create section element
                const section = document.createElement('section');
                section.className = 'section container';
                section.style.marginTop = '3rem';
                
                // Create section title
                const title = document.createElement('h2');
                title.textContent = folderData.name.charAt(0).toUpperCase() + folderData.name.slice(1);
                title.style.marginBottom = '2rem';
                section.appendChild(title);
                
                // Create carousel
                const carousel = document.createElement('div');
                carousel.className = 'carousel';
                
                const slides = document.createElement('div');
                slides.className = 'slides';
                
                // Create slides for each file
                folderData.files.forEach(file => {
                    const slide = createSlide(file);
                    slides.appendChild(slide);
                });
                
                // Create carousel controls
                const leftBtn = document.createElement('button');
                leftBtn.className = 'carousel-control left';
                leftBtn.innerHTML = '&#10094;';
                
                const rightBtn = document.createElement('button');
                rightBtn.className = 'carousel-control right';
                rightBtn.innerHTML = '&#10095;';
                
                carousel.appendChild(slides);
                carousel.appendChild(leftBtn);
                carousel.appendChild(rightBtn);
                section.appendChild(carousel);
                
                return section;
                
            } catch (error) {
                console.error(`Error creating section for ${folderData.name}:`, error);
                return null;
            }
        }
        
        function createSlide(file) {
            const figure = document.createElement('figure');
            figure.className = 'slide';
            
            const caption = document.createElement('figcaption');
            caption.textContent = file.name.replace(/\.[^/.]+$/, ""); // Remove file extension
            
            if (file.name.endsWith('.html')) {
                // Create iframe for HTML files
                const iframe = document.createElement('iframe');
                iframe.src = `https://${username}.github.io/${repo}/${file.fullPath}`;
                iframe.title = file.name;
                figure.appendChild(iframe);
            } else if (file.name.endsWith('.mp4')) {
                // Create video element
                const video = document.createElement('video');
                video.controls = true;
                video.muted = true;
                video.loop = true;
                
                const source = document.createElement('source');
                source.src = `https://${username}.github.io/${repo}/${file.fullPath}`;
                source.type = 'video/mp4';
                
                video.appendChild(source);
                video.appendChild(document.createTextNode('Your browser does not support the video tag.'));
                figure.appendChild(video);
            } else if (file.name.match(/\.(jpg|jpeg|png|gif)$/i)) {
                // Create image element
                const img = document.createElement('img');
                img.src = `https://${username}.github.io/${repo}/${file.fullPath}`;
                img.alt = file.name;
                figure.appendChild(img);
            }
            
            figure.appendChild(caption);
            return figure;
        }
        
        // Initialize dynamic sections on page load
        document.addEventListener("DOMContentLoaded", () => {
            createDynamicSections();
        });
    </script>
