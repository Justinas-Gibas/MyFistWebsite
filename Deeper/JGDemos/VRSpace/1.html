<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>AR Wall Art Placement</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<style>
		body, html { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }
		canvas { width: 100%; height: 100%; display: block; }
		.ui {
			position: fixed;
			top: 16px;
			left: 50%;
			transform: translateX(-50%);
			background: rgba(0, 0, 0, 0.55);
			color: #fff;
			padding: 8px 12px;
			border-radius: 8px;
			display: flex;
			gap: 12px;
			align-items: center;
			z-index: 10;
		}
		.upload-button {
			position: relative;
			overflow: hidden;
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 6px 10px;
			border-radius: 6px;
			background: #2563eb;
			cursor: pointer;
			font-size: 14px;
		}
		.upload-button input {
			position: absolute;
			inset: 0;
			opacity: 0;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<div class="ui">
		<span>Tap a highlighted wall to place the artwork.</span>
		<label class="upload-button">
			Load image
			<input id="textureInput" type="file" accept="image/*">
		</label>
	</div>

	<script async src="../../lib/utils/es-module-shims.js"></script>
	<script type="importmap">
	{
		"imports": {
			"three": "../../lib/three.module.js"
		}
	}
	</script>

	<script type="module">
	import * as THREE from 'three';
	import { ARButton } from '../../lib/webxr/ARButton.js';

	const WALL_OFFSET = 0.02;
	const DEFAULT_ART_URL = '../../lib/images/BackWater.png';

	let renderer, scene, camera;
	let hitTestSource = null;
	let hitTestSourceRequested = false;
	let reticle;
	let artwork;
	let artworkAnchor = null;
	let artworkAnchorSpace = null;
	const planeMeshes = new Map();

	const textureLoader = new THREE.TextureLoader();

	init();

	function init() {
		scene = new THREE.Scene();
		camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

		renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
		renderer.setPixelRatio(window.devicePixelRatio);
		renderer.setSize(window.innerWidth, window.innerHeight);
		renderer.xr.enabled = true;
		document.body.appendChild(renderer.domElement);

		document.body.appendChild(ARButton.createButton(renderer, {
			requiredFeatures: ['hit-test'],
			optionalFeatures: ['anchors', 'plane-detection', 'dom-overlay'],
			domOverlay: { root: document.body }
		}));

		setupLighting();
		createReticle();
		createArtworkMesh();
		loadArtworkTexture(DEFAULT_ART_URL);

		window.addEventListener('resize', onWindowResize, false);
		document.getElementById('textureInput').addEventListener('change', onTextureSelected, false);

		renderer.xr.addEventListener('sessionstart', onSessionStart);
		renderer.xr.addEventListener('sessionend', onSessionEnd);

		renderer.setAnimationLoop(render);
	}

	function setupLighting() {
		const ambient = new THREE.HemisphereLight(0xffffff, 0x404040, 0.8);
		scene.add(ambient);
		const dir = new THREE.DirectionalLight(0xffffff, 0.6);
		dir.position.set(1, 2, 1);
		scene.add(dir);
	}

	function createReticle() {
		const geometry = new THREE.RingGeometry(0.12, 0.15, 32).rotateX(-Math.PI / 2);
		const material = new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.6 });
		reticle = new THREE.Mesh(geometry, material);
		reticle.matrixAutoUpdate = false;
		reticle.visible = false;
		scene.add(reticle);
	}

	function createArtworkMesh() {
		const geometry = new THREE.PlaneGeometry(1, 1);
		const material = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
		artwork = new THREE.Mesh(geometry, material);
		artwork.visible = false;
		scene.add(artwork);
	}

	function onTextureSelected(event) {
		const file = event.target.files?.[0];
		if (!file) return;
		const blobUrl = URL.createObjectURL(file);
		loadArtworkTexture(blobUrl, () => URL.revokeObjectURL(blobUrl), () => URL.revokeObjectURL(blobUrl));
	}

	function loadArtworkTexture(url, onLoadComplete, onErrorComplete) {
		textureLoader.load(url, (texture) => {
			texture.colorSpace = THREE.SRGBColorSpace;
			if (artwork.material.map) artwork.material.map.dispose();
			artwork.material.map = texture;
			artwork.material.needsUpdate = true;
			if (onLoadComplete) onLoadComplete();
		}, undefined, () => {
			if (onErrorComplete) onErrorComplete();
			console.warn('Failed to load texture:', url);
		});
	}

	function onSessionStart() {
		const session = renderer.xr.getSession();
		if (!session) return;

		session.addEventListener('select', onSelect);

		if (!hitTestSourceRequested) {
			session.requestReferenceSpace('viewer').then((viewerSpace) => {
				return session.requestHitTestSource({ space: viewerSpace });
			}).then((source) => {
				hitTestSource = source;
			}).catch((err) => console.error('Hit test source error:', err));
			hitTestSourceRequested = true;
		}
	}

	function onSessionEnd() {
		hitTestSource = null;
		hitTestSourceRequested = false;
		if (artworkAnchor?.delete) artworkAnchor.delete();
		artworkAnchor = null;
		artworkAnchorSpace = null;
		for (const { mesh } of planeMeshes.values()) {
			scene.remove(mesh);
			mesh.geometry.dispose();
		}
		planeMeshes.clear();
		reticle.visible = false;
		artwork.visible = false;
	}

	function onSelect(event) {
		const frame = event.frame;
		const referenceSpace = renderer.xr.getReferenceSpace();
		if (!frame || !referenceSpace || !hitTestSource) return;

		const results = frame.getHitTestResults(hitTestSource);
		if (!results.length) return;

		const hit = results[0];
		const pose = hit.getPose(referenceSpace);
		if (!pose) return;

		if (hit.createAnchor) {
			hit.createAnchor().then((anchor) => {
				if (artworkAnchor?.delete) artworkAnchor.delete();
				artworkAnchor = anchor;
				artworkAnchorSpace = anchor.anchorSpace;
				positionArtworkFromPose(pose);
			}).catch((err) => console.warn('Anchor creation failed:', err));
		} else {
			if (artworkAnchor?.delete) artworkAnchor.delete();
			artworkAnchor = null;
			artworkAnchorSpace = null;
			positionArtworkFromPose(pose);
		}
	}

	function render(timestamp, frame) {
		const referenceSpace = renderer.xr.getReferenceSpace();

		if (frame && referenceSpace) {
			updateReticle(frame, referenceSpace);
			updatePlaneMeshes(frame, referenceSpace);
			updateArtworkAnchor(frame, referenceSpace);
		}

		renderer.render(scene, camera);
	}

	function updateReticle(frame, referenceSpace) {
		if (!hitTestSource) {
			reticle.visible = false;
			return;
		}

		const hitTestResults = frame.getHitTestResults(hitTestSource);
		if (!hitTestResults.length) {
			reticle.visible = false;
			return;
		}

		const pose = hitTestResults[0].getPose(referenceSpace);
		if (!pose) {
			reticle.visible = false;
			return;
		}

		reticle.visible = true;
		reticle.matrix.fromArray(pose.transform.matrix);
	}

	function updatePlaneMeshes(frame, referenceSpace) {
		const planeSet = frame.worldInformation?.detectedPlanes;
		if (!planeSet) return;

		const seen = new Set();

		for (const plane of planeSet.values()) {
			seen.add(plane);
			const pose = frame.getPose(plane.planeSpace, referenceSpace);
			if (!pose) continue;

			const geometry = buildPlaneGeometry(plane);
			let record = planeMeshes.get(plane);

			if (!record) {
				const material = new THREE.MeshBasicMaterial({
					color: 0x00aaff,
					transparent: true,
					opacity: 0.35,
					side: THREE.DoubleSide
				});
				const mesh = new THREE.Mesh(geometry, material);
				scene.add(mesh);
				record = { mesh };
				planeMeshes.set(plane, record);
			} else {
				record.mesh.geometry.dispose();
				record.mesh.geometry = geometry;
			}

			const { position, orientation } = pose.transform;
			record.mesh.position.set(position.x, position.y, position.z);
			record.mesh.quaternion.set(orientation.x, orientation.y, orientation.z, orientation.w);
			record.mesh.scale.set(1, 1, 1);
		}

		for (const [plane, { mesh }] of planeMeshes) {
			if (seen.has(plane)) continue;
			scene.remove(mesh);
			mesh.geometry.dispose();
			planeMeshes.delete(plane);
		}
	}

	function buildPlaneGeometry(plane) {
		const polygon = plane.polygon;
		if (!polygon || polygon.length < 3) {
			return new THREE.PlaneGeometry(0.4, 0.4);
		}

		const points2D = polygon.map((p) => new THREE.Vector2(p.x, p.z));
		const triangles = THREE.ShapeUtils.triangulateShape(points2D, []);
		const vertices = [];

		for (const tri of triangles) {
			for (const index of tri) {
				const point = points2D[index];
				vertices.push(point.x, 0, point.y);
			}
		}

		const geometry = new THREE.BufferGeometry();
		geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
		geometry.computeVertexNormals();
		return geometry;
	}

	function updateArtworkAnchor(frame, referenceSpace) {
		if (!artworkAnchorSpace || !artwork) return;

		const pose = frame.getPose(artworkAnchorSpace, referenceSpace);
		if (!pose) return;

		positionArtworkFromPose(pose);
	}

	function positionArtworkFromPose(pose) {
		const { position, orientation } = pose.transform;
		const pos = new THREE.Vector3(position.x, position.y, position.z);
		const quat = new THREE.Quaternion(orientation.x, orientation.y, orientation.z, orientation.w);

		const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(quat);
		pos.addScaledVector(forward, WALL_OFFSET);

		artwork.position.copy(pos);
		artwork.quaternion.copy(quat);
		artwork.scale.set(1, 1, 1);
		artwork.visible = true;
	}

	function onWindowResize() {
		camera.aspect = window.innerWidth / window.innerHeight;
		camera.updateProjectionMatrix();
		renderer.setSize(window.innerWidth, window.innerHeight);
	}
	</script>
</body>
</html>
