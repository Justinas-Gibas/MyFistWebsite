        <script>
            /*
            * World.js
            */
            // --- Grid Logic ---
            const worldGrid = {
                cells: {},

                createGridData(radius) {
                    console.log(`Creating grid data with radius ${radius}...`);
                    this.cells = {}; // Start with an empty grid data structure

                    // Loop through coordinates around the center (0,0)
                    for (let x = -radius; x <= radius; x++) {
                        for (let y = -radius; y <= radius; y++) {
                            // Create a unique key for this position (e.g., "0,0", "1,-1")
                            const key = `${x},${y}`;
                            // Store basic data for this grid position
                            this.cells[key] = {
                                x: x,       // The X coordinate
                                y: y,       // The Y coordinate
                                type: 'empty' // What's at this position (e.g., 'empty', 'tree', 'rock')
                                // We can add more properties later (like resources, enemies, etc.)
                            };
                        }
                    }
                    console.log(`Grid data created. Total positions: ${Object.keys(this.cells).length}`);
                    console.log('Grid data:', this.cells); // Optional: See the created data
                },

                // Function to get the data for a specific grid position
                getCellData(x, y) {
                    const key = `${x},${y}`;
                    return this.cells[key]; // Returns the cell data object, or undefined if it doesn't exist
                },  
            };
    
            // New module for visualization
            const gridVisualizer = {
                cellSize: 50, // Visual cell size in pixels
                container: null,
                cellElements: {}, // Store references to cell elements
            
                // Initialize the visualization system
                init() {
                    // Create container for all grid cells
                    this.container = document.createElement('div');
                    this.container.id = 'grid-container';
                    this.container.style.position = 'absolute';
                    this.container.style.width = '100%';
                    this.container.style.height = '100%';
                    this.container.style.overflow = 'hidden';
                    document.body.appendChild(this.container);
                },
            
                // Convert grid coordinates to screen coordinates (centered)
                gridToScreenPosition(x, y) {
                    const centerX = Math.floor(window.innerWidth / 2);
                    const centerY = Math.floor(window.innerHeight / 2);

                    return {
                        left: centerX + (x * this.cellSize),
                        top: centerY + (y * this.cellSize)
                    };
                },
            
                // Create visual representation of cells
                renderGrid(gridData) {
                    // Clear any existing cells
                    this.container.innerHTML = '';
                    this.cellElements = {};

                    // Create visual elements for each cell in the grid data
                    for (const key in gridData) {
                        const cell = gridData[key];
                        this.renderCell(cell);
                    }
                },
            
                // Create a visual representation of a single cell
                renderCell(cellData) {
                    const cellElement = document.createElement('div');
                    cellElement.className = 'grid-cell';
                    cellElement.style.position = 'absolute';
                    cellElement.style.width = this.cellSize + 'px';
                    cellElement.style.height = this.cellSize + 'px';
                    cellElement.style.border = '1px solid #61dafb';

                    // Position the cell using our conversion function
                    const position = this.gridToScreenPosition(cellData.x, cellData.y);
                    cellElement.style.left = position.left + 'px';
                    cellElement.style.top = position.top + 'px';

                    // Add coordinate text for debugging
                    cellElement.innerHTML = `${cellData.x},${cellData.y}`;
                    cellElement.style.fontSize = '10px';
                    cellElement.style.display = 'flex';
                    cellElement.style.alignItems = 'center';
                    cellElement.style.justifyContent = 'center';

                    // Highlight the center cell
                    if (cellData.x === 0 && cellData.y === 0) {
                        cellElement.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
                    }

                    // Store reference to this element
                    this.cellElements[`${cellData.x},${cellData.y}`] = cellElement;

                    // Add the cell to the container
                    this.container.appendChild(cellElement);
                }
            };

            // --- Player Logic ---
            // redundant will use player.js
            const player = {
                x: 0,
                y: 0,
                initialize() {
                    this.x = 0;
                    this.y = 0;
                    console.log(`Player initialized at grid position: ${this.x}, ${this.y}`);
                },
            };
    
           // --- Game Initialization ---
            console.log("--- Initializing Game Logic ---");
                    
            // 1. Create the logical grid data
            const gridRadius = 4; 
            worldGrid.createGridData(gridRadius); // Only call once
                    
            // 2. Initialize the player
            // this could be difrent script
            //player.initialize(); 
                    
            // 3. Initialize and render the grid visualization 
            gridVisualizer.init();
            gridVisualizer.renderGrid(worldGrid.cells);
                    
            // 4. Check player's starting position 
            const startingCellData = worldGrid.getCellData(player.x, player.y);
            if (startingCellData) {
                console.log(`Player starts on cell type: ${startingCellData.type}`);
            } else {
                console.error("Error: Player's starting position (0,0) doesn't exist!");
            }
            
            console.log("--- Initialization Complete ---");
    
        </script>

        <div id="player" style="width: 100%; height: 100%;"></div>
        <script>
            /*
            .* Player.js
            */
            // --- Player Logic ---
            // Initialize the game player
            var playerElement = document.getElementById('player');
            
            
            // Set up player properties
            playerElement.style.backgroundColor = 'white';
            playerElement.style.position = 'relative';
            playerElement.style.width = '40px';
            playerElement.style.height = '40px';
            playerElement.style.zIndex = '1000'; // Set a high z-index value

            //circular player shape
            //playerElement.style.borderRadius = '50%';

            // Set up player position (center of the screen)
            playerElement.style.transform = 'translate(-50%, -50%)';
            playerElement.style.top = '30%';
            playerElement.style.left = '50%';
        
        </script>

        <script>

            // objects in the world
            // we will use divs to represent the world objects
            //resoures, trees, rocks, etc.

            //set up tree properties

            
            // tree green color
            var tree = document.createElement('div');
            tree.style.position = 'absolute'; 
            tree.style.width = '20px';
            tree.style.height = '20px';
            tree.style.backgroundColor = 'green'; // ground color

            // Append the world element to the body
            document.body.appendChild(tree);


        </script>

        <script>

            // Set up player movement
            // wasd keys for movement
            // we want player to stay in the center of the screen
            // so we will move the backgroiund instead of the player
            // all cells will be moved in the opposite direction of the player
            document.addEventListener('keydown', function(event) {
                switch(event.key) {
                    case 'w':
                        playerElement.style.top = (parseInt(playerElement.style.top) - 10) + 'px';
                        break;
                    case 's':
                        playerElement.style.top = (parseInt(playerElement.style.top) + 10) + 'px';
                        break;
                    case 'a':
                        playerElement.style.left = (parseInt(playerElement.style.left) - 10) + 'px';
                        break;
                    case 'd':
                        playerElement.style.left = (parseInt(playerElement.style.left) + 10) + 'px';
                        break;
                }
            });

        </script>
