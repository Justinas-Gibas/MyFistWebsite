<!DOCTYPE html>
<html>
<head>
  <title>WAT in HTML - Interactive Demo</title>
  <style>
    body { 
      margin: 0; 
      background: #000;
      color: #fff; 
      font-family: 'Courier New', monospace; 
      padding: 20px;
    }
    .container { max-width: 800px; margin: 0 auto; text-align: center; }
    h1 { margin-bottom: 30px; color: #fff; }
    
    canvas { 
      border: 2px solid #333; 
      border-radius: 8px;
      margin: 20px 0;
      box-shadow: 0 4px 20px rgba(255,255,255,0.1);
    }
    
    .controls {
      background: #111;
      border: 1px solid #333;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .control-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .control-group label {
      margin-right: 10px;
      min-width: 80px; /* Adjusted to fit potentially longer labels */
      text-align: left;
      color: #ccc;
      transition: opacity 0.3s ease;
    }
    .control-group input[type="range"] {
      flex-grow: 1;
      margin: 0 10px;
      transition: opacity 0.3s ease;
    }
    .control-group span {
      min-width: 30px;
      text-align: right;
      color: #fff;
      font-weight: bold;
      transition: opacity 0.3s ease;
    }
    .control-group.hidden {
      opacity: 0;
      max-height: 0;
      padding: 0;
      margin: 0;
      overflow: hidden;
      transition: opacity 0.3s ease, max-height 0.3s ease, padding 0.3s ease, margin 0.3s ease;
    }


    .presets {
      background: #111;
      border: 1px solid #333;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .preset-title {
      color: #ccc;
      margin-bottom: 10px;
      font-size: 14px;
    }
    
    .button {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      margin: 3px;
      font-family: inherit;
      font-size: 12px;
    }
    
    .button:hover { 
      background: #333; 
      border-color: #666;
    }
    .button:disabled { 
      background: #111; 
      color: #666;
      cursor: not-allowed; 
    }
    
    .button-primary { 
      background: #333; 
      border-color: #555;
    }
    .button-primary:hover { 
      background: #444; 
      border-color: #777;
    }
    
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      background: #111;
      border: 1px solid #333;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌌 WAT Pattern Generator</h1>
    
    <canvas id="canvas" width="512" height="512"></canvas>
    
    <div class="status" id="status">Ready to compile WAT code</div>

    <div class="controls">
      <div class="control-group">
        <label for="param1">Multiplier A:</label>
        <input type="range" id="param1" min="1" max="50" value="17">
        <span id="param1-value">17</span>
      </div>
      <div class="control-group">
        <label for="param2">Multiplier B:</label>
        <input type="range" id="param2" min="1" max="50" value="13">
        <span id="param2-value">13</span>
      </div>
      <div class="control-group">
        <label for="param3">Time Scale:</label>
        <input type="range" id="param3" min="1" max="10" value="3">
        <span id="param3-value">3</span>
      </div>
    </div>
    
    <div class="presets">
      <div class="preset-title">Pattern Presets:</div>
      <button class="button button-primary" onclick="loadPreset('basic')">Basic XOR</button>
      <button class="button" onclick="loadPreset('waves')">Wave Pattern</button>
      <button class="button" onclick="loadPreset('spiral')">Spiral</button>
      <button class="button" onclick="loadPreset('cellular')">Cellular</button>
      <button class="button" onclick="loadPreset('plasma')">Plasma</button>
      <button class="button" onclick="loadPreset('tunnel')">Tunnel</button>
      <button class="button" onclick="loadPreset('starfield')">Starfield</button>
    </div>
    
    <div>
      <button class="button" onclick="stop()">Stop</button>
    </div>
  </div>

  <script>
    let wabtInstance = null;
    let wasmCompute = null;
    let animationId = null;
    let currentWatCode = '';
    
    // DOM elements for sliders & their groups
    let paramControls = {};

    // WAT code presets
    const presets = {
      basic: {
        wat: `(module
  (func $compute (param $x i32) (param $y i32) (param $t i32) (param $p1 i32) (param $p2 i32) (param $p3 i32) (result i32)
    local.get $x
    local.get $p1
    i32.mul
    local.get $y
    local.get $p2
    i32.mul
    i32.add
    local.get $t
    local.get $p3
    i32.mul
    i32.add
    local.get $x
    local.get $y
    i32.xor
    i32.xor
    i32.const 255
    i32.and)
  (export "compute" (func $compute)))`,
        paramConfigs: [
          { id: 'param1', label: 'Factor X:', min: 1, max: 50, value: 17 },
          { id: 'param2', label: 'Factor Y:', min: 1, max: 50, value: 13 },
          { id: 'param3', label: 'Time Scale:', min: 1, max: 10, value: 3 }
        ]
      },
      waves: {
        wat: `(module
  (func $compute (param $x i32) (param $y i32) (param $t i32) (param $p1 i32) (param $p2 i32) (param $p3 i32) (result i32)
    (local $wave1 i32) (local $wave2 i32)
    local.get $x
    local.get $p1 ;; Frequency X
    i32.mul
    local.get $t
    local.get $p3 ;; Time influence
    i32.mul
    i32.add
    i32.const 8
    i32.shr_u
    local.set $wave1
    local.get $y
    local.get $p2 ;; Frequency Y
    i32.mul
    local.get $t
    i32.add
    i32.const 6
    i32.shr_u
    local.set $wave2
    local.get $wave1
    local.get $wave2
    i32.add
    i32.const 255
    i32.and)
  (export "compute" (func $compute)))`,
        paramConfigs: [
          { id: 'param1', label: 'Freq X:', min: 1, max: 30, value: 10 },
          { id: 'param2', label: 'Freq Y:', min: 1, max: 30, value: 8 },
          { id: 'param3', label: 'Speed:', min: 1, max: 10, value: 2 }
        ]
      },
      spiral: {
        wat: `(module
  (func $compute (param $x i32) (param $y i32) (param $t i32) (param $p1 i32) (param $p2 i32) (param $p3 i32) (result i32)
    (local $dx i32) (local $dy i32) (local $dist i32) (local $angle i32)
    local.get $x
    i32.const 256 ;; Canvas center X
    i32.sub
    local.set $dx
    local.get $y
    i32.const 256 ;; Canvas center Y
    i32.sub
    local.set $dy
    local.get $dx
    local.get $dx
    i32.mul
    local.get $dy
    local.get $dy
    i32.mul
    i32.add
    local.set $dist ;; Distance from center squared
    ;; Simplified angle-like calculation (atan2 is complex for WAT)
    local.get $dx
    local.get $p1 ;; Angle factor
    i32.mul
    local.get $dy
    local.get $p2 ;; Angle factor
    i32.mul
    i32.xor
    local.set $angle
    local.get $dist
    local.get $p3 ;; Density
    i32.div_u
    local.get $angle
    i32.add
    local.get $t
    i32.add
    i32.const 255
    i32.and)
  (export "compute" (func $compute)))`,
        paramConfigs: [
          { id: 'param1', label: 'Angle X:', min: 1, max: 50, value: 20 },
          { id: 'param2', label: 'Angle Y:', min: 1, max: 50, value: 30 },
          { id: 'param3', label: 'Density:', min: 10, max: 1000, value: 200 }
        ]
      },
      cellular: {
        wat: `(module
  (func $compute (param $x i32) (param $y i32) (param $t i32) (param $p1 i32) (param $p2 i32) (param $p3 i32) (result i32)
    (local $seed i32) (local $noise i32)
    local.get $x
    local.get $p1 ;; Scale X
    i32.div_u
    local.get $y
    local.get $p2 ;; Scale Y
    i32.div_u
    i32.xor
    local.get $t
    local.get $p3 ;; Time influence
    i32.div_u
    i32.add
    local.set $seed
    local.get $seed
    i32.const 12345
    i32.mul
    i32.const 1103515245 
    i32.add
    local.set $noise
    local.get $noise
    i32.const 16
    i32.shr_u
    local.get $noise
    i32.const 8
    i32.shr_u
    i32.xor
    i32.const 255
    i32.and)
  (export "compute" (func $compute)))`,
        paramConfigs: [
          { id: 'param1', label: 'Scale X:', min: 1, max: 30, value: 10 },
          { id: 'param2', label: 'Scale Y:', min: 1, max: 30, value: 10 },
          { id: 'param3', label: 'Time Div:', min: 1, max: 20, value: 5 }
        ]
      },
      plasma: {
        wat: `(module
  (func $compute (param $x i32) (param $y i32) (param $t i32) (param $p1 i32) (param $p2 i32) (param $p3 i32) (result i32)
    (local $plasma1 i32) (local $plasma2 i32) (local $plasma3 i32) (local $v i32)
    local.get $x
    local.get $p1 ;; Freq1
    i32.mul
    local.get $t
    i32.add
    i32.const 4
    i32.shr_u
    local.set $plasma1
    local.get $y
    local.get $p2 ;; Freq2
    i32.mul
    local.get $t
    local.get $p3 ;; Time scale for Freq2
    i32.mul
    i32.add
    i32.const 5
    i32.shr_u
    local.set $plasma2
    local.get $x
    local.get $y
    i32.add
    local.get $t
    i32.add
    i32.const 3
    i32.shr_u
    local.set $plasma3
    local.get $plasma1
    local.get $plasma2
    i32.add
    local.get $plasma3
    i32.add
    local.set $v
    local.get $v
    i32.const 3
    i32.div_u ;; Average, or remove for different effect
    i32.const 255
    i32.and)
  (export "compute" (func $compute)))`,
        paramConfigs: [
          { id: 'param1', label: 'Freq 1:', min: 1, max: 30, value: 5 },
          { id: 'param2', label: 'Freq 2:', min: 1, max: 30, value: 7 },
          { id: 'param3', label: 'Time F2:', min: 1, max: 10, value: 2 }
        ]
      },
      tunnel: {
        wat: `(module
  (func $compute (param $x i32) (param $y i32) (param $t i32) (param $p1 i32) (param $p2 i32) (param $p3 i32) (result i32)
    (local $dx i32) (local $dy i32) (local $dist i32) (local $angle i32) (local $depth_val i32)
    local.get $x
    i32.const 256 ;; Center X
    i32.sub
    local.set $dx
    local.get $y
    i32.const 256 ;; Center Y
    i32.sub
    local.set $dy
    ;; Simplified distance (dx*dx + dy*dy might be too slow without sqrt)
    local.get $dx
    call $abs
    local.get $dy
    call $abs
    i32.add 
    local.set $dist
    ;; Simplified angle (atan2 is complex)
    local.get $dx
    local.get $dy
    i32.xor ;; A basic angular component
    local.set $angle
    ;; Depth effect
    local.get $p1 ;; Depth factor, avoid zero
    i32.const 1
    i32.add 
    local.get $dist
    i32.add
    i32.const 1 ;; Avoid div by zero
    i32.add
    local.get $p2 ;; Perspective scale
    i32.mul
    i32.const 10000 ;; A large number to scale down
    i32.div_s ;; Signed division for perspective
    local.set $depth_val
    local.get $depth_val
    local.get $angle
    i32.add
    local.get $t
    local.get $p3 ;; Speed
    i32.mul
    i32.add
    i32.const 255
    i32.and)
  (func $abs (param $v i32) (result i32) ;; Helper for absolute value
    local.get $v
    local.get $v
    i32.const 31
    i32.shr_s
    i32.add
    local.get $v
    i32.const 31
    i32.shr_s
    i32.xor)
  (export "compute" (func $compute)))`,
        paramConfigs: [
          { id: 'param1', label: 'Depth:', min: 1, max: 100, value: 20 },
          { id: 'param2', label: 'Perspective:', min: 1, max: 50, value: 10 },
          { id: 'param3', label: 'Speed:', min: 1, max: 10, value: 2 }
        ]
      },
      starfield: {
        wat: `(module
  (func $compute (param $x i32) (param $y i32) (param $t i32) (param $p1 i32) (param $p2 i32) (param $p3 i32) (result i32)
    (local $star_seed i32) (local $star_val i32) (local $depth_layer i32)
    ;; Create 3 layers of stars with parallax
    ;; Layer 1 (fastest)
    local.get $x
    local.get $t
    local.get $p3 ;; Speed
    i32.mul
    i32.add
    local.get $p1 ;; Density
    i32.rem_u
    local.get $y
    local.get $t
    local.get $p3
    i32.mul
    i32.add
    local.get $p1
    i32.rem_u
    i32.xor
    local.set $star_seed
    local.get $star_seed
    call $pseudo_random
    i32.const 250 ;; Threshold for stars
    i32.gt_u
    if (result i32)
      i32.const 255 ;; Bright star
    else
      ;; Layer 2 (medium speed)
      local.get $x
      local.get $t
      local.get $p3
      i32.mul
      i32.const 2
      i32.div_u ;; Slower
      i32.add
      local.get $p1
      i32.const 2
      i32.add ;; Slightly different density
      i32.rem_u
      local.get $y
      local.get $t
      local.get $p3
      i32.mul
      i32.const 2
      i32.div_u
      i32.add
      local.get $p1
      i32.const 2
      i32.add
      i32.rem_u
      i32.xor
      local.set $star_seed
      local.get $star_seed
      call $pseudo_random
      i32.const 252 ;; Higher threshold, fewer stars
      i32.gt_u
      if (result i32)
        i32.const 180 ;; Medium star
      else
        ;; Layer 3 (slowest)
        local.get $x
        local.get $t
        local.get $p3
        i32.mul
        i32.const 4
        i32.div_u ;; Even Slower
        i32.add
        local.get $p1
        i32.const 4
        i32.add
        i32.rem_u
        local.get $y
        local.get $t
        local.get $p3
        i32.mul
        i32.const 4
        i32.div_u
        i32.add
        local.get $p1
        i32.const 4
        i32.add
        i32.rem_u
        i32.xor
        local.set $star_seed
        local.get $star_seed
        call $pseudo_random
        i32.const 254 ;; Highest threshold, fewest stars
        i32.gt_u
        if (result i32)
          i32.const 100 ;; Dim star
        else
          i32.const 0 ;; Background
        end
      end
    end)
  (func $pseudo_random (param $seed i32) (result i32) ;; Simple LCG
    local.get $seed
    i32.const 1103515245
    i32.mul
    i32.const 12345
    i32.add
    i32.const 0x7fffffff ;; Keep it positive
    i32.and
    i32.const 255 ;; Scale to 0-255
    i32.rem_u)
  (export "compute" (func $compute)))`,
        paramConfigs: [
          { id: 'param1', label: 'Density:', min: 10, max: 100, value: 30 },
          { id: 'param2', label: 'Brightness:', min: 0, max: 0, value: 0, hidden: true }, // Not used by this preset directly
          { id: 'param3', label: 'Speed:', min: 1, max: 10, value: 2 }
        ]
      }
    };

    // Load wabt.js automatically
    (async function loadWabt() {
      try {
        document.getElementById('status').textContent = 'Loading WebAssembly tools...';
        
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/wabt@1.0.37/index.min.js';
        document.head.appendChild(script);
        
        await new Promise(resolve => script.onload = resolve);
        
        // Wait for WabtModule to be available
        while (!window.WabtModule) {
          await new Promise(resolve => setTimeout(resolve, 50));
        }
        
        wabtInstance = await window.WabtModule();
        document.getElementById('status').textContent = 'Ready to compile WAT code';
        
      } catch (error) {
        document.getElementById('status').textContent = 'Error loading WebAssembly tools';
      }
    })();
    
    function loadPreset(presetName) {
      const preset = presets[presetName];
      if (preset) {
        currentWatCode = preset.wat;
        document.getElementById('status').textContent = `Loaded ${presetName} preset. Compiling...`;

        // Configure sliders
        const allSliderIds = ['param1', 'param2', 'param3'];
        allSliderIds.forEach(sliderId => {
          const controlGroup = paramControls[sliderId].group;
          const config = preset.paramConfigs.find(p => p.id === sliderId);
          
          if (config && !config.hidden) {
            paramControls[sliderId].label.textContent = config.label;
            paramControls[sliderId].slider.min = config.min;
            paramControls[sliderId].slider.max = config.max;
            paramControls[sliderId].slider.value = config.value;
            paramControls[sliderId].valueDisplay.textContent = config.value;
            controlGroup.classList.remove('hidden');
          } else {
            controlGroup.classList.add('hidden');
          }
        });
        
        compileAndRun();
      }
    }
    
    async function compileAndRun() {
      if (animationId) { // Stop any existing animation
        stop();
      }

      if (!wabtInstance) {
        document.getElementById('status').textContent = 'WebAssembly tools not loaded yet';
        return;
      }
      
      try {
        const watCode = currentWatCode || presets.basic;
        
        // Compile WAT to WASM
        document.getElementById('status').textContent = 'Compiling WAT to WASM...';
        const module = wabtInstance.parseWat('compute.wat', watCode);
        const binary = module.toBinary({});
        
        // Create WebAssembly instance
        const wasmModule = await WebAssembly.compile(binary.buffer);
        const wasmInstance = await WebAssembly.instantiate(wasmModule);
        wasmCompute = wasmInstance.exports.compute;

        if (typeof wasmCompute !== 'function') {
          throw new Error("The 'compute' function was not found in the WASM module exports. Make sure it's defined and exported in your WAT code.");
        }
        
        document.getElementById('status').textContent = 'Running animation...';
        startAnimation();
        
      } catch (error) {
        document.getElementById('status').textContent = `Error: ${error.message}`;
        console.error("Compilation or Instantiation Error:", error);
      }
    }
    
    function startAnimation() {
      if (!wasmCompute) {
        document.getElementById('status').textContent = 'WASM module not ready.';
        return;
      }
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const { width, height } = canvas;
      let time = 0;
      
      function render() {
        const imageData = ctx.createImageData(width, height);
        const data = imageData.data;

        // Get current slider values
        const p1 = parseInt(paramControls.param1.slider.value);
        const p2 = parseInt(paramControls.param2.slider.value);
        const p3 = parseInt(paramControls.param3.slider.value);
        
        let idx = 0;
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const value = wasmCompute(x, y, time, p1, p2, p3); // Pass slider values
            data[idx++] = value;                           // Red
            data[idx++] = (value * 2) & 255;               // Green
            data[idx++] = ((value ^ time) * 3) & 255;      // Blue  
            data[idx++] = 255;                             // Alpha
          }
        }
        
        ctx.putImageData(imageData, 0, 0);
        time = (time + 1) & 0xFF;
        animationId = requestAnimationFrame(render);
      }
      
      render();
    }
    
    function stop() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
        document.getElementById('status').textContent = 'Animation stopped';
      }
    }

    // Initialize sliders and their display
    document.addEventListener('DOMContentLoaded', () => {
      const sliderIds = ['param1', 'param2', 'param3'];
      sliderIds.forEach(id => {
        paramControls[id] = {
          group: document.getElementById(id).closest('.control-group'),
          slider: document.getElementById(id),
          label: document.querySelector(`label[for="${id}"]`),
          valueDisplay: document.getElementById(`${id}-value`)
        };
        paramControls[id].slider.oninput = () => {
          paramControls[id].valueDisplay.textContent = paramControls[id].slider.value;
        };
      });
      
      // Load default preset and start animation automatically
      loadPreset('basic');
    });
  </script>
</body>
</html>
