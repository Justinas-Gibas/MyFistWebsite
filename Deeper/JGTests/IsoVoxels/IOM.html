<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Voxel Blueprint Editor — MVP</title>
	<style>
		body { font-family: Arial, sans-serif; margin:12px; color:#111; }
		#ui { display:flex; gap:12px; }
		#left { width:560px; }
		.canvasRow { display:flex; gap:8px; margin-bottom:8px; }
		canvas { background:#fff; border:1px solid #999; cursor:crosshair; image-rendering: pixelated; }
		.controls { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
		.layerItem { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
		.layerColor { width:18px; height:18px; border:1px solid #333; display:inline-block; vertical-align:middle; }
		#preview { border:1px solid #999; background:#eef; }
	</style>
</head>
<body>
	<h2>Voxel Blueprint Editor — MVP</h2>
	<div id="ui">
		<div id="left">
			<div class="controls">
				<label>Grid: X<input id="gridX" type="number" value="32" min="4" max="128" style="width:60px"/></label>
				<label>Y<input id="gridY" type="number" value="32" min="4" max="128" style="width:60px"/></label>
				<label>Z<input id="gridZ" type="number" value="32" min="4" max="128" style="width:60px"/></label>
				<button id="applyGrid">Apply</button>
				<label>Threshold
					<select id="threshold">
						<option value="1">≥1 view</option>
						<option value="2" selected>≥2 views</option>
						<option value="3">≥3 views</option>
					</select>
				</label>
				<label>Brush <input id="brushSize" type="range" min="1" max="10" value="2"/></label>
				<label>Mode
					<select id="mode">
						<option value="paint">Paint</option>
						<option value="erase">Erase</option>
					</select>
				</label>
			</div>

			<div style="display:flex; gap:12px;">
				<div style="flex:1">
					<div><strong>Top (X×Z)</strong></div>
					<canvas id="canTop" width="360" height="360"></canvas>
				</div>
				<div style="flex:1">
					<div><strong>Front (X×Y)</strong></div>
					<canvas id="canFront" width="360" height="360"></canvas>
				</div>
				<div style="flex:1">
					<div><strong>Right (Z×Y)</strong></div>
					<canvas id="canRight" width="360" height="360"></canvas>
				</div>
			</div>

			<div style="margin-top:8px;">
				<strong>Layers</strong> <button id="addLayer">Add Layer</button>
				<div id="layers"></div>
			</div>
		</div>

		<div style="width:420px">
			<div><strong>3D Preview</strong></div>
			<canvas id="preview" width="420" height="420"></canvas>
			<div style="margin-top:6px; display:flex; gap:12px; align-items:center;">
				<label>Rotate <input id="rot" type="range" min="-180" max="180" value="30"/></label>
				<label>Zoom <input id="zoom" type="range" min="8" max="40" value="20"/></label>
			</div>
		</div>
	</div>

	<script>
		// Single-file MVP implementation: minimal, vanilla JS + Canvas
		// Data model: layers -> each has 3 Uint8Array silhouettes for top/front/right
		(function(){
			// DOM
			const canTop = document.getElementById('canTop');
			const canFront = document.getElementById('canFront');
			const canRight = document.getElementById('canRight');
			const ctxTop = canTop.getContext('2d');
			const ctxFront = canFront.getContext('2d');
			const ctxRight = canRight.getContext('2d');
			const preview = document.getElementById('preview');
			const ctxPreview = preview.getContext('2d');

			const gridXIn = document.getElementById('gridX');
			const gridYIn = document.getElementById('gridY');
			const gridZIn = document.getElementById('gridZ');
			const applyGridBtn = document.getElementById('applyGrid');
			const thresholdSel = document.getElementById('threshold');
			const brushSizeIn = document.getElementById('brushSize');
			const modeSel = document.getElementById('mode');
			const addLayerBtn = document.getElementById('addLayer');
			const layersDiv = document.getElementById('layers');
			const rotIn = document.getElementById('rot');
			const zoomIn = document.getElementById('zoom');

			// State
			let grid = { x:32, y:32, z:32 };
			let views = { // view sizes in pixels for drawing canvases
				top: { canvas: canTop, ctx: ctxTop, vw: canTop.width, vh: canTop.height },
				front: { canvas: canFront, ctx: ctxFront, vw: canFront.width, vh: canFront.height },
				right: { canvas: canRight, ctx: ctxRight, vw: canRight.width, vh: canRight.height }
			};
			let layers = []; // each: { name, color, visible, silhouettes: {top,front,right} }
			let activeLayer = null;
			let threshold = parseInt(thresholdSel.value,10);
			let brushSize = parseInt(brushSizeIn.value,10);
			let mode = modeSel.value;
			let voxels = null; // Uint8Array of reconstructed voxel layer index (0=no voxel, else layerIndex+1)
			let renderRequested = true;

			// Helpers to create typed silhouette arrays
			function createSilArrays(x,y,z){
				const topLen = x*z;
				const frontLen = x*y;
				const rightLen = z*y;
				return {
					top: new Uint8Array(topLen),
					front: new Uint8Array(frontLen),
					right: new Uint8Array(rightLen)
				};
			}

			// Layer management
			function addLayer(color='#ff0000'){
				const name = 'L' + (layers.length+1);
				const layer = {
					name, color, visible: true,
					silhouettes: createSilArrays(grid.x, grid.y, grid.z)
				};
				layers.push(layer);
				activeLayer = layers.length-1;
				refreshLayerUI();
				reconstruct();
			}
			function removeLayer(idx){
				if(idx<0||idx>=layers.length) return;
				layers.splice(idx,1);
				if(activeLayer>=layers.length) activeLayer = layers.length-1;
				refreshLayerUI();
				reconstruct();
			}
			function refreshLayerUI(){
				layersDiv.innerHTML = '';
				layers.forEach((L,i)=>{
					const div = document.createElement('div');
					div.className='layerItem';
					div.innerHTML = '<div class="layerColor" style="background:'+L.color+'"></div>'
						+ '<input style="width:120px" value="'+L.name+'" data-i="'+i+'">'
						+ '<input type="color" value="'+L.color+'" data-i="'+i+'">'
						+ '<label><input type="checkbox"'+(L.visible?' checked':'')+' data-i="'+i+'">vis</label>'
						+ '<button data-i="'+i+'">Del</button>'
						+ (activeLayer===i?'<strong> ←</strong>':'');
					layersDiv.appendChild(div);

					// bindings
					div.querySelector('input[type="color"]').addEventListener('input', (e)=>{ L.color=e.target.value; requestRender(); });
					div.querySelector('input[type="checkbox"]').addEventListener('change', (e)=>{ L.visible = e.target.checked; reconstruct(); });
					div.querySelector('button').addEventListener('click', ()=>{ removeLayer(i); });
					div.querySelector('input[type="text"], input[style]').addEventListener('change', (e)=>{ L.name=e.target.value; refreshLayerUI(); });
					div.addEventListener('click', ()=>{ activeLayer=i; refreshLayerUI(); });
				});
			}

			// Grid resizing
			function applyGrid(){
				const nx = Math.max(4, Math.min(128, parseInt(gridXIn.value,10)||32));
				const ny = Math.max(4, Math.min(128, parseInt(gridYIn.value,10)||32));
				const nz = Math.max(4, Math.min(128, parseInt(gridZIn.value,10)||32));
				grid.x = nx; grid.y = ny; grid.z = nz;
				// resample or recreate silhouettes: simple nearest-neighbor resampling (reset for simplicity)
				layers.forEach(L=>{
					L.silhouettes = createSilArrays(grid.x, grid.y, grid.z);
				});
				reconstruct();
			}

			// Painting on views
			function viewToGridCoord(view, sx, sy){
				// map canvas pixel to view grid coords (integer indices)
				const v = views[view];
				const cw = v.vw, ch = v.vh;
				let gx, gy;
				if(view==='top'){ // X × Z
					gx = Math.floor(sx / cw * grid.x);
					gy = Math.floor(sy / ch * grid.z);
					gx = clamp(gx,0,grid.x-1); gy = clamp(gy,0,grid.z-1);
					return {gx, gy};
				}else if(view==='front'){ // X × Y
					gx = Math.floor(sx / cw * grid.x);
					gy = Math.floor(sy / ch * grid.y);
					gx = clamp(gx,0,grid.x-1); gy = clamp(gy,0,grid.y-1);
					return {gx, gy};
				}else{ // right: Z × Y
					gx = Math.floor(sx / cw * grid.z);
					gy = Math.floor(sy / ch * grid.y);
					gx = clamp(gx,0,grid.z-1); gy = clamp(gy,0,grid.y-1);
					return {gx, gy};
				}
			}
			function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

			function paintOnView(view, canvasX, canvasY){
				if(activeLayer===null) return;
				const bs = brushSize;
				const coords = viewToGridCoord(view, canvasX, canvasY);
				const L = layers[activeLayer];
				const s = L.silhouettes[view];
				if(view==='top'){
					const W = grid.x, H = grid.z;
					for(let dy=-bs+1; dy<bs; dy++){
						for(let dx=-bs+1; dx<bs; dx++){
							const x = coords.gx + dx; const z = coords.gy + dy;
							if(x<0||x>=W||z<0||z>=H) continue;
							const idx = x + z*W;
							s[idx] = (mode==='paint')?1:0;
						}
					}
				}else if(view==='front'){
					const W = grid.x, H = grid.y;
					for(let dy=-bs+1; dy<bs; dy++){
						for(let dx=-bs+1; dx<bs; dx++){
							const x = coords.gx + dx; const y = coords.gy + dy;
							if(x<0||x>=W||y<0||y>=H) continue;
							const idx = x + y*W;
							s[idx] = (mode==='paint')?1:0;
						}
					}
				}else{ // right
					const W = grid.z, H = grid.y;
					for(let dy=-bs+1; dy<bs; dy++){
						for(let dx=-bs+1; dx<bs; dx++){
							const z = coords.gx + dx; const y = coords.gy + dy;
							if(z<0||z>=W||y<0||y>=H) continue;
							const idx = z + y*W;
							s[idx] = (mode==='paint')?1:0;
						}
					}
				}
				requestRender(); reconstruct(); // update silhouette drawing and voxel model
			}

			// Canvas interactions
			function setupCanvasInteractions(canvas, viewName){
				let down=false;
				const rect = ()=>canvas.getBoundingClientRect();
				canvas.addEventListener('pointerdown', (e)=>{
					down=true; canvas.setPointerCapture(e.pointerId);
					const r = rect();
					paintOnView(viewName, e.clientX - r.left, e.clientY - r.top);
				});
				canvas.addEventListener('pointermove', (e)=>{
					if(!down) return;
					const r = rect();
					paintOnView(viewName, e.clientX - r.left, e.clientY - r.top);
				});
				canvas.addEventListener('pointerup', (e)=>{ down=false; });
				canvas.addEventListener('pointerleave', (e)=>{ down=false; });
			}
			setupCanvasInteractions(canTop,'top');
			setupCanvasInteractions(canFront,'front');
			setupCanvasInteractions(canRight,'right');

			// Reconstruction
			function reconstruct(){
				threshold = parseInt(thresholdSel.value,10);
				// voxels: typed array length x*y*z storing layerIndex+1 or 0
				const N = grid.x * grid.y * grid.z;
				voxels = new Uint8Array(N);
				// for performance iterate per voxel and check layers in order: layering rule: later layers override earlier if both include
				for(let li=0; li<layers.length; li++){
					const L = layers[li];
					if(!L.visible) continue;
					const T = L.silhouettes.top, F = L.silhouettes.front, R = L.silhouettes.right;
					// iterate voxels
					for(let y=0;y<grid.y;y++){
						for(let z=0;z<grid.z;z++){
							for(let x=0;x<grid.x;x++){
								const idx = x + y*grid.x + z*grid.x*grid.y;
								// count matching views
								let c=0;
								// top: x,z
								if(T[x + z*grid.x]) c++;
								// front: x,y
								if(F[x + y*grid.x]) c++;
								// right: z,y
								if(R[z + y*grid.z]) c++;
								if(c >= threshold) {
									voxels[idx] = li+1; // layer index +1
								}
							}
						}
					}
				}
				requestRender();
			}

			// Rendering silhouettes on canvases
			function drawViews(){
				// draw each layer silhouette composited so active layer is on top
				const drawForView = (viewName, ctx, canvasW, canvasH, gridW, gridH, sampler)=>{
					// clear
					ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvasW,canvasH);
					// draw grid fallback
					ctx.strokeStyle = '#ddd'; ctx.lineWidth=1;
					// scale to fit grid
					ctx.save();
					const sx = canvasW/gridW, sy = canvasH/gridH;
					ctx.scale(sx, sy);
					// draw each layer
					for(let li=0; li<layers.length; li++){
						const L = layers[li];
						const s = sampler(L);
						ctx.globalAlpha = L.visible ? 0.9 : 0.2;
						ctx.fillStyle = L.color;
						for(let gy=0; gy<gridH; gy++){
							for(let gx=0; gx<gridW; gx++){
								const idx = gx + gy*gridW;
								if(s[idx]) {
									ctx.fillRect(gx, gy, 1, 1);
								}
							}
						}
					}
					ctx.restore();
					ctx.globalAlpha = 1;
				};

				// top: grid.x x grid.z
				drawForView('top', ctxTop, canTop.width, canTop.height, grid.x, grid.z, (L)=>L.silhouettes.top);
				// front: grid.x x grid.y
				drawForView('front', ctxFront, canFront.width, canFront.height, grid.x, grid.y, (L)=>L.silhouettes.front);
				// right: grid.z x grid.y
				drawForView('right', ctxRight, canRight.width, canRight.height, grid.z, grid.y, (L)=>L.silhouettes.right);
			}

			// 3D preview rendering (software)
			function renderPreview(){
				ctxPreview.clearRect(0,0,preview.width,preview.height);
				// projection params
				const angleDeg = parseFloat(rotIn.value);
				const angle = angleDeg * Math.PI/180;
				const zoom = parseFloat(zoomIn.value); // scale factor
				const ox = preview.width/2, oy = preview.height*0.6;
				// light dir
				const Ldir = normalize([Math.cos(angle), -0.6, Math.sin(angle)]);
				// collect voxels to draw: positions and color and exposure normal
				const items = [];
				const isOccupied = (x,y,z)=> {
					if(x<0||y<0||z<0||x>=grid.x||y>=grid.y||z>=grid.z) return 0;
					const idx = x + y*grid.x + z*grid.x*grid.y;
					return voxels ? voxels[idx] : 0;
				};
				for(let y=0;y<grid.y;y++){
					for(let z=0;z<grid.z;z++){
						for(let x=0;x<grid.x;x++){
							const idx = x + y*grid.x + z*grid.x*grid.y;
							const li = voxels ? (voxels[idx]-1) : -1;
							if(li < 0) continue;
							const color = layers[li].color;
							// compute exposure normal approximation from neighbor occupancy: sum of face normals of empty neighbors
							const norm = [0,0,0];
							if(!isOccupied(x+1,y,z)) { norm[0]+=1; }
							if(!isOccupied(x-1,y,z)) { norm[0]-=1; }
							if(!isOccupied(x,y+1,z)) { norm[1]+=1; }
							if(!isOccupied(x,y-1,z)) { norm[1]-=1; }
							if(!isOccupied(x,y,z+1)) { norm[2]+=1; }
							if(!isOccupied(x,y,z-1)) { norm[2]-=1; }
							const nrm = normalize(norm);
							// projection (isometric-ish)
							const px = (x - z) * (zoom) + ox + (y*0.2);
							const py = (x + z) * (zoom*0.5) * -0.5 - y*zoom + oy;
							items.push({x,y,z,px,py,color,nrm, depth: (x+z) - y});
						}
					}
				}
				// sort back-to-front by depth
				items.sort((a,b)=> a.depth - b.depth );
				// draw small rectangles for voxels with shading
				for(const it of items){
					const s = zoom * 0.95;
					const shade = Math.max(0.2, dot(it.nrm, Ldir)*0.9 + 0.4);
					ctxPreview.fillStyle = shadeColor(it.color, shade);
					const w = s, h = s*0.5;
					ctxPreview.fillRect(it.px - w/2, it.py - h/2, w, h);
					// outline
					ctxPreview.strokeStyle = 'rgba(0,0,0,0.15)';
					ctxPreview.strokeRect(it.px - w/2, it.py - h/2, w, h);
				}
			}

			// Utilities
			function normalize(v){
				const s = Math.hypot(v[0]||0,v[1]||0,v[2]||0) || 1;
				return [ (v[0]||0)/s, (v[1]||0)/s, (v[2]||0)/s ];
			}
			function dot(a,b){ return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
			function shadeColor(hex, f){
				// hex #rrggbb, f 0..1
				const r = parseInt(hex.slice(1,3),16);
				const g = parseInt(hex.slice(3,5),16);
				const b = parseInt(hex.slice(5,7),16);
				const rr = Math.floor(r*f), gg = Math.floor(g*f), bb = Math.floor(b*f);
				return 'rgb('+rr+','+gg+','+bb+')';
			}

			// Render scheduler
			function requestRender(){ renderRequested = true; }
			function frame(){
				if(renderRequested){
					drawViews();
					renderPreview();
					renderRequested = false;
				}
				requestAnimationFrame(frame);
			}

			// Event bindings
			applyGridBtn.addEventListener('click', applyGrid);
			thresholdSel.addEventListener('change', ()=>{ threshold = parseInt(thresholdSel.value,10); reconstruct(); });
			brushSizeIn.addEventListener('input', ()=>{ brushSize = parseInt(brushSizeIn.value,10); });
			modeSel.addEventListener('change', ()=>{ mode = modeSel.value; });
			addLayerBtn.addEventListener('click', ()=> addLayer(randomColor()));
			rotIn.addEventListener('input', ()=> requestRender());
			zoomIn.addEventListener('input', ()=> requestRender());

			// initialize
			function randomColor(){
				const r = (Math.floor(Math.random()*200)+30).toString(16).padStart(2,'0');
				const g = (Math.floor(Math.random()*200)+30).toString(16).padStart(2,'0');
				const b = (Math.floor(Math.random()*200)+30).toString(16).padStart(2,'0');
				return '#'+r+g+b;
			}
			// start with one layer
			addLayer('#d9534f');
			// initial render
			requestRender(); frame();

			// expose minimally for debugging
			window.IGM = { layers, grid, reconstruct };
		})();
	</script>
</body>
</html>
