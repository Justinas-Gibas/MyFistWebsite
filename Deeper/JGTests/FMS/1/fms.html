<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Free Market Simulation (WebGPU accel, CPU fallback)</title>
	<style>
		body { font-family: system-ui,Segoe UI,Roboto,Helvetica,Arial; margin: 12px; background:#111; color:#ddd; }
		.controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
		.control { background:#1b1b1b; padding:8px; border-radius:6px; min-width:160px; }
		label{ display:block; font-size:12px; color:#9fb; margin-bottom:6px; }
		input[type=range]{ width:100%; }
		button{ margin-top:6px; padding:6px 10px; border-radius:6px; border:0; background:#0a84ff; color:white; cursor:pointer;}
		.grid { display:grid; grid-template-columns:2fr 1fr; gap:12px; height:520px; }
		.panel { background:#1b1b1b; padding:10px; border-radius:8px; overflow:hidden; }
		canvas { width:100%; height:100%; background:#0f0f0f; display:block; }
		.stats { display:flex; gap:10px; margin-top:10px; }
		.stat { background:#0f0f0f; padding:8px 10px; border-radius:6px; font-size:13px; }
	</style>
</head>
<body>
	<h2>Free Market Simulation — Order Book, Makers & Takers (WebGPU accel)</h2>

	<div class="controls">
		<div class="control">
			<label>Market Makers: <span id="makersVal">100</span></label>
			<input id="makers" type="range" min="1" max="2000" value="200">
		</div>
		<div class="control">
			<label>Market Takers: <span id="takersVal">50</span></label>
			<input id="takers" type="range" min="0" max="2000" value="100">
		</div>
		<div class="control">
			<label>Simulation Speed (steps/sec): <span id="speedVal">10</span></label>
			<input id="speed" type="range" min="1" max="200" value="20">
		</div>
		<div class="control">
			<label>Volatility (max delta per step): <span id="volVal">1.0</span></label>
			<input id="vol" type="range" min="0" max="10" step="0.1" value="0.6">
		</div>
		<div class="control" style="display:flex; flex-direction:column; justify-content:center;">
			<button id="start">Start Simulation</button>
			<button id="reset" style="margin-top:8px; background:#666">Reset</button>
		</div>
	</div>

	<div class="grid">
		<div class="panel">
			<div style="font-weight:600; color:#7fd">Candlestick Chart + Support/Resistance</div>
			<canvas id="candles"></canvas>
		</div>
		<div class="panel">
			<div style="font-weight:600; color:#7fd">Order Book (horizontal bars)</div>
			<canvas id="orderbook"></canvas>
		</div>
	</div>

	<div class="stats" aria-hidden>
		<div class="stat">Price: <strong id="price">$100.00</strong></div>
		<div class="stat">Spread: <strong id="spread">$0.00</strong></div>
		<div class="stat">Active Orders: <strong id="aorders">0</strong></div>
	</div>

	<script>
		// Simple single-file simulation with WebGPU compute shader + CPU fallback.
		// Configuration & state
		const state = {
			basePrice: 100.0,
			currentPrice: 100.0,
			priceHistory: [], // {t, open, high, low, close, volume}
			candlesSpan: 200,
			orderBook: { bids: [], asks: [] },
			isRunning: false,
			stepCount: 0,
		};

		const ui = {
			makers: document.getElementById('makers'),
			takers: document.getElementById('takers'),
			speed: document.getElementById('speed'),
			vol: document.getElementById('vol'),
			startBtn: document.getElementById('start'),
			resetBtn: document.getElementById('reset'),
			makersVal: document.getElementById('makersVal'),
			takersVal: document.getElementById('takersVal'),
			speedVal: document.getElementById('speedVal'),
			volVal: document.getElementById('volVal'),
			priceLabel: document.getElementById('price'),
			spreadLabel: document.getElementById('spread'),
			aordersLabel: document.getElementById('aorders'),
		};

		// Canvas contexts
		const canvasC = document.getElementById('candles');
		const ctxC = canvasC.getContext('2d');
		const canvasOB = document.getElementById('orderbook');
		const ctxOB = canvasOB.getContext('2d');

		function resizeCanvases() {
			const ratio = window.devicePixelRatio || 1;
			canvasC.width = Math.floor(canvasC.clientWidth * ratio);
			canvasC.height = Math.floor(canvasC.clientHeight * ratio);
			canvasOB.width = Math.floor(canvasOB.clientWidth * ratio);
			canvasOB.height = Math.floor(canvasOB.clientHeight * ratio);
			ctxC.setTransform(ratio,0,0,ratio,0,0);
			ctxOB.setTransform(ratio,0,0,ratio,0,0);
			drawAll();
		}
		window.addEventListener('resize', resizeCanvases);
		resizeCanvases();

		// Wire UI updates
		[ui.makers, ui.takers, ui.speed, ui.vol].forEach(el => {
			el.addEventListener('input', () => {
				ui.makersVal.textContent = ui.makers.value;
				ui.takersVal.textContent = ui.takers.value;
				ui.speedVal.textContent = ui.speed.value;
				ui.volVal.textContent = parseFloat(ui.vol.value).toFixed(2);
			});
		});
		ui.startBtn.addEventListener('click', toggleSim);
		ui.resetBtn.addEventListener('click', resetSim);

		// WebGPU setup (optional) — simple RNG+delta compute shader
		let gpu = { available: false, device: null, queue: null, pipeline: null, buffers: {} };

		async function initWebGPU() {
			if (!('gpu' in navigator)) return;
			try {
				const adapter = await navigator.gpu.requestAdapter();
				if (!adapter) return;
				const device = await adapter.requestDevice();
				gpu.available = true;
				gpu.device = device;
				gpu.queue = device.queue;
				// WGSL compute shader: LCG RNG per index, output float delta in [-1,1] scaled by volatility uniform
				const wgsl = `
struct Seeds { seeds: array<u32>; };
struct Deltas { vals: array<f32>; };
@group(0) @binding(0) var<storage, read_write> seeds : Seeds;
@group(0) @binding(1) var<storage, read_write> deltas : Deltas;
@group(0) @binding(2) var<uniform> params : vec2<f32>; // params.x = volatility, params.y = invMax
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid : vec3<u32>) {
	let i = gid.x;
	// avoid out-of-range
	if (i >= arrayLength(&seeds.seeds)) { return; }
	var s = seeds.seeds[i];
	// LCG
	s = s * 1664525u + 1013904223u;
	seeds.seeds[i] = s;
	// normalize low bits to float in [0,1)
	let r = f32(s & 0x00FFFFFFu) * params.y;
	let delta = (r - 0.5) * 2.0 * params.x;
	deltas.vals[i] = delta;
}
`;
				const module = device.createShaderModule({ code: wgsl });
				gpu.pipeline = device.createComputePipeline({ compute: { module, entryPoint: 'main' } });
			} catch (e) {
				console.warn('WebGPU init failed', e);
				gpu.available = false;
			}
		}

		// Prepare buffers for a given agentCount
		function prepareGpuBuffers(agentCount) {
			if (!gpu.available) return;
			// seed uint32 array
			const seeds = new Uint32Array(agentCount);
			for (let i=0;i<agentCount;i++) seeds[i] = (Math.random()*0xffffffff) >>> 0;
			const device = gpu.device;
			// storage buffer for seeds
			gpu.buffers.seeds = device.createBuffer({
				size: seeds.byteLength,
				usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
				mappedAtCreation: true
			});
			new Uint32Array(gpu.buffers.seeds.getMappedRange()).set(seeds);
			gpu.buffers.seeds.unmap();

			// storage buffer for deltas (float32)
			gpu.buffers.deltas = device.createBuffer({
				size: agentCount * 4,
				usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC
			});

			// readback buffer
			gpu.buffers.readback = device.createBuffer({
				size: agentCount * 4,
				usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ
			});

			// uniform buffer for params (volatility and invMax constant)
			const params = new Float32Array([parseFloat(ui.vol.value), 1.0 / 16777215.0]);
			gpu.buffers.params = device.createBuffer({
				size: 8,
				usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
				mappedAtCreation: true
			});
			new Float32Array(gpu.buffers.params.getMappedRange()).set(params);
			gpu.buffers.params.unmap();

			// bind group
			gpu.bindGroup = device.createBindGroup({
				layout: gpu.pipeline.getBindGroupLayout(0),
				entries: [
					{ binding: 0, resource: { buffer: gpu.buffers.seeds } },
					{ binding: 1, resource: { buffer: gpu.buffers.deltas } },
					{ binding: 2, resource: { buffer: gpu.buffers.params } },
				]
			});
		}

		// Run GPU compute and return Float32Array of deltas
		async function runGpuDeltas(agentCount) {
			const device = gpu.device;
			const commandEncoder = device.createCommandEncoder();
			const pass = commandEncoder.beginComputePass();
			pass.setPipeline(gpu.pipeline);
			pass.setBindGroup(0, gpu.bindGroup);
			const workgroups = Math.ceil(agentCount / 64);
			pass.dispatchWorkgroups(workgroups);
			pass.end();

			// copy deltas to readback buffer
			commandEncoder.copyBufferToBuffer(gpu.buffers.deltas, 0, gpu.buffers.readback, 0, agentCount * 4);
			device.queue.submit([commandEncoder.finish()]);

			await gpu.buffers.readback.mapAsync(GPUMapMode.READ);
			const arr = new Float32Array(gpu.buffers.readback.getMappedRange()).slice();
			gpu.buffers.readback.unmap();
			// update params uniform if volatility changed
			const params = new Float32Array([parseFloat(ui.vol.value), 1.0 / 16777215.0]);
			device.queue.writeBuffer(gpu.buffers.params, 0, params.buffer, params.byteOffset, params.byteLength);
			return arr;
		}

		// CPU fallback delta generator
		function cpuDeltas(agentCount) {
			const vol = parseFloat(ui.vol.value);
			const out = new Float32Array(agentCount);
			for (let i=0;i<agentCount;i++) {
				out[i] = (Math.random() - 0.5) * 2 * vol;
			}
			return out;
		}

		// Core simulation step: take per-agent deltas, produce trades + update order book + price
		function simulationStep(deltas) {
			const makers = +ui.makers.value;
			const takers = +ui.takers.value;
			const agentCount = deltas.length;
			// Simple model:
			// - First 'makers' agents provide limit orders: they place orders around current price with small bias
			// - Next 'takers' agents consume liquidity producing immediate trades shifting price by average executed delta
			const makersCount = Math.min(makers, agentCount);
			const takersCount = Math.min(takers, Math.max(0, agentCount - makersCount));
			const now = Date.now();

			// Update order book: create arrays around price
			const base = state.currentPrice;
			const bids = [];
			const asks = [];

			// Makers produce limit orders: position determined by delta sign and magnitude
			for (let i=0;i<makersCount;i++) {
				const d = deltas[i];
				const offset = d * 0.5; // small offset
				if (d < 0) {
					// buyer (bid)
					bids.push({ price: base + offset, quantity: (Math.abs(d) + 0.1) * 10 });
				} else {
					asks.push({ price: base + offset, quantity: (d + 0.1) * 10 });
				}
			}

			// Takers execute market trades: they move price directly
			let netImpact = 0;
			for (let i=makersCount; i<makersCount+takersCount && i<deltas.length; i++) {
				// market buy/sell
				netImpact += deltas[i];
			}
			// apply net impact scaled by taker aggressiveness
			const takerAggression = 1.0;
			const priceDelta = (netImpact / Math.max(1, takersCount)) * takerAggression;
			state.currentPrice = Math.max(0.0001, state.currentPrice + priceDelta);

			// Build synthetic orderbook around price
			const levelCount = 20;
			for (let i=1;i<=levelCount;i++) {
				const spreadStep = i * 0.02 * Math.max(0.5, parseFloat(ui.vol.value));
				asks.push({ price: state.currentPrice + spreadStep, quantity: Math.random()*20 + 1 });
				bids.push({ price: state.currentPrice - spreadStep, quantity: Math.random()*20 + 1 });
			}
			// sort book
			asks.sort((a,b)=>a.price-b.price);
			bids.sort((a,b)=>b.price-a.price);

			state.orderBook = { bids, asks };

			// Update candles: accumulate into latest candle, or create new one every N steps (coarse)
			const stepPerCandle = Math.max(1, Math.floor(20 / (parseFloat(ui.speed.value)/20 || 1)));
			const last = state.priceHistory[state.priceHistory.length-1];
			if (!last || (state.stepCount % stepPerCandle === 0)) {
				// new candle
				const candle = { t: now, open: state.currentPrice, high: state.currentPrice, low: state.currentPrice, close: state.currentPrice, volume: Math.abs(priceDelta)*10 + 1 };
				state.priceHistory.push(candle);
				if (state.priceHistory.length > state.candlesSpan) state.priceHistory.shift();
			} else {
				// update last candle
				last.close = state.currentPrice;
				last.high = Math.max(last.high, state.currentPrice);
				last.low = Math.min(last.low, state.currentPrice);
				last.volume += Math.abs(priceDelta)*10 + 1;
			}
			state.stepCount++;
		}

		// Rendering
		function drawCandles() {
			const w = canvasC.clientWidth, h = canvasC.clientHeight;
			ctxC.clearRect(0,0,w,h);
			ctxC.fillStyle = '#0f0f0f';
			ctxC.fillRect(0,0,w,h);

			const data = state.priceHistory;
			if (!data.length) return;
			const padding = 10;
			// compute price range
			let min = Infinity, max = -Infinity;
			for (const c of data) { min = Math.min(min, c.low); max = Math.max(max, c.high); }
			// add small margin
			const margin = (max - min) * 0.08 || 1;
			min -= margin; max += margin;
			// draw support/resistance lines (simple: cluster detection by histogram)
			const buckets = {};
			for (const c of data) {
				const v = Math.round(c.close);
				buckets[v] = (buckets[v]||0) + 1;
			}
			const levels = Object.entries(buckets).filter(([k,v])=>v>1).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>+x[0]);

			// map helpers
			const mapX = (i) => padding + (w - 2*padding) * (i / Math.max(1, data.length-1));
			const mapY = (p) => padding + (h - 2*padding) * (1 - (p - min) / (max - min));

			// draw axes labels
			ctxC.fillStyle = '#9fb';
			ctxC.font = '12px monospace';
			ctxC.fillText(`High ${max.toFixed(2)}`, 8, 14);
			ctxC.fillText(`Low ${min.toFixed(2)}`, 8, h - 6);

			// support/resistance horizontal lines
			for (const lvl of levels) {
				const y = mapY(lvl);
				ctxC.strokeStyle = 'rgba(255,200,40,0.12)';
				ctxC.beginPath();
				ctxC.moveTo(0,y);
				ctxC.lineTo(w,y);
				ctxC.stroke();
				ctxC.fillStyle = 'rgba(255,200,40,0.6)';
				ctxC.fillText(`SR ${lvl.toFixed(2)}`, 8, y - 4);
			}

			// draw candles
			const candleW = Math.max(2, (w - 2*padding) / data.length * 0.7);
			for (let i=0;i<data.length;i++) {
				const c = data[i];
				const x = mapX(i);
				const yOpen = mapY(c.open), yClose = mapY(c.close);
				const yHigh = mapY(c.high), yLow = mapY(c.low);
				// wick
				ctxC.strokeStyle = '#888';
				ctxC.beginPath();
				ctxC.moveTo(x, yHigh);
				ctxC.lineTo(x, yLow);
				ctxC.stroke();
				// body
				if (c.close >= c.open) ctxC.fillStyle = '#00ff88'; else ctxC.fillStyle = '#ff6b6b';
				ctxC.fillRect(x - candleW/2, Math.min(yOpen,yClose), candleW, Math.max(1, Math.abs(yClose-yOpen)));
			}
		}

		function drawOrderBook() {
			const w = canvasOB.clientWidth, h = canvasOB.clientHeight;
			ctxOB.clearRect(0,0,w,h);
			ctxOB.fillStyle = '#0f0f0f';
			ctxOB.fillRect(0,0,w,h);

			const midY = h/2;
			const maxDisplay = 20;
			const asks = state.orderBook.asks.slice(0,maxDisplay);
			const bids = state.orderBook.bids.slice(0,maxDisplay);
			const maxQty = Math.max(...asks.map(a=>a.quantity), ...bids.map(b=>b.quantity), 1);

			// Draw asks (top)
			for (let i=0;i<asks.length;i++) {
				const a = asks[i];
				const barW = (a.quantity / maxQty) * (w*0.95);
				const y = midY - (i+1) * (midY/maxDisplay);
				ctxOB.fillStyle = 'rgba(255,100,100,0.9)';
				ctxOB.fillRect(0, y, barW, (midY/maxDisplay)-3);
				ctxOB.fillStyle = '#fff';
				ctxOB.font = '11px monospace';
				ctxOB.fillText(`$${a.price.toFixed(2)} (${a.quantity.toFixed(1)})`, barW + 6, y + 12);
			}
			// Draw bids (bottom)
			for (let i=0;i<bids.length;i++) {
				const b = bids[i];
				const barW = (b.quantity / maxQty) * (w*0.95);
				const y = midY + i * (midY/maxDisplay);
				ctxOB.fillStyle = 'rgba(80,255,150,0.9)';
				ctxOB.fillRect(0, y, barW, (midY/maxDisplay)-3);
				ctxOB.fillStyle = '#000';
				ctxOB.font = '11px monospace';
				ctxOB.fillText(`$${b.price.toFixed(2)} (${b.quantity.toFixed(1)})`, barW + 6, y + 12);
			}
			// spread line
			ctxOB.strokeStyle = '#fff';
			ctxOB.setLineDash([4,4]);
			ctxOB.beginPath();
			ctxOB.moveTo(0, midY);
			ctxOB.lineTo(w, midY);
			ctxOB.stroke();
			ctxOB.setLineDash([]);
		}

		function drawAll() {
			drawCandles();
			drawOrderBook();
			ui.priceLabel.textContent = `$${state.currentPrice.toFixed(2)}`;
			const bestBid = state.orderBook.bids[0]?.price || state.currentPrice;
			const bestAsk = state.orderBook.asks[0]?.price || state.currentPrice;
			ui.spreadLabel.textContent = `$${Math.abs(bestAsk - bestBid).toFixed(2)}`;
			ui.aordersLabel.textContent = (state.orderBook.bids.length + state.orderBook.asks.length).toString();
		}

		// Simulation loop controller
		let loopHandle = null;
		async function loopOnce() {
			const makers = +ui.makers.value;
			const takers = +ui.takers.value;
			const vol = parseFloat(ui.vol.value);
			const agentCount = Math.max(1, makers + takers);
			let deltas;
			if (gpu.available) {
				// Ensure buffers sized correctly
				if (!gpu.buffers.seeds || (gpu.buffers.seeds.size / 4) < agentCount) {
					// recreate gpu buffers for new agent count
					prepareGpuBuffers(agentCount);
				}
				deltas = await runGpuDeltas(agentCount);
			} else {
				deltas = cpuDeltas(agentCount);
			}
			simulationStep(deltas);
			drawAll();
		}

		function startLoop() {
			if (state.isRunning) return;
			state.isRunning = true;
			ui.startBtn.textContent = 'Stop Simulation';
			const stepsPerSec = Math.max(1, +ui.speed.value);
			const tickMs = 1000 / stepsPerSec;
			async function tick() {
				if (!state.isRunning) return;
				await loopOnce();
				loopHandle = setTimeout(tick, tickMs);
			}
			tick();
		}
		function stopLoop() {
			state.isRunning = false;
			ui.startBtn.textContent = 'Start Simulation';
			if (loopHandle) { clearTimeout(loopHandle); loopHandle = null; }
		}
		function toggleSim() { if (state.isRunning) stopLoop(); else startLoop(); }

		function resetSim() {
			stopLoop();
			state.currentPrice = state.basePrice;
			state.priceHistory = [];
			state.orderBook = { bids: [], asks: [] };
			state.stepCount = 0;
			drawAll();
		}

		// Init
		(async function init() {
			// wire default labels
			ui.makersVal.textContent = ui.makers.value;
			ui.takersVal.textContent = ui.takers.value;
			ui.speedVal.textContent = ui.speed.value;
			ui.volVal.textContent = parseFloat(ui.vol.value).toFixed(2);

			await initWebGPU();
			// Prewarm some candles
			for (let i=0;i<40;i++) {
				const d = cpuDeltas(50);
				simulationStep(d);
			}
			resizeCanvases();
			drawAll();
		})();

		// small exposure for debugging in console
		window._fms = { state, ui };
	</script>
</body>
</html>
