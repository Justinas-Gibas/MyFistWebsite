<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta author="Justinas Gibas">
        <title>Popups</title>
        <style>body, html {margin: 0;padding: 0;overflow: hidden;}canvas {display: block;}
        </style>
    </head>
    <body>
        <header>
        </header>
        <main>
            <canvas id="gameCanvas" style="width: 100%; height: 100vh;"></canvas>
            <!-- custom popover needs js to function (bad) -->
            <button id="popupButton1" style="position: absolute; top: 10px; left: 10px;" onclick="document.getElementById('popover1').style.display='block'">Open 1</button>
            <popover id="popover1" style="display: none; position: absolute; top: 10px; left: 10px; width: 200px; height: 400px; background-color: rgb(0, 128, 0); border-radius: 3px;">
                <button onclick="document.getElementById('popover1').style.display='none'">Close 1</button>
                <p style="color: lime; " tooltip="Open 1">popup contents</p>
            </popover>
            <!--  -->
            <button id="popupButton1.1" style="position: absolute; top: 50px; left: 10px;" onclick="document.querySelector('[popover]').showPopover()">Open 1.1</button>
            <div popover="auto" style="position: absolute; top: 20px; left: 10px; width: 200px; height: 400px; background-color: rgb(0, 128, 0); border-radius: 3px;">
                <button onclick="document.querySelector('[popover]').style.display='none'">Close 1.1</button>
                <p style="color: lime;">popup contents</p>
            </div>
            <!-- Use popovertarget and popover attributes for native popover API (good) -->
            <button id="popoverButton2" popovertarget="popover2" style="position: absolute; top: 10px; left: 50%;">Open 2</button>
            <div id="popover2" popover style="position: absolute; top: 10px; left: 0%; width: 200px; height: 400px; background-color: rgb(0, 128, 0); border-radius: 3px;">
                <button popovertarget="popover2" popovertargetaction="hide">Close 2</button>
                <p style="color: lime;">popup contents</p>
            </div>
            <!-- manual mode -->
            <button id="popoverButton3" popovertarget="popover3" style="position: absolute; top: 10px; left: 90%;">Open 3</button>
            <div id="popover3" popover="manual" style="position: absolute; top: 10px; right: -100vh; width: 200px; height: 400px; background-color: rgb(0, 128, 0); border-radius: 3px;">
                <button popovertarget="popover3" popovertargetaction="hide">Close 3</button>
                <p style="color: lime;">popup contents</p>
            </div>
            <script>
                const canvas = document.getElementById('gameCanvas');
                const context = canvas.getContext('webgpu');
                //set canvas color
                canvas.style.backgroundColor = '#00ff00';
                
            </script>
        </main>
        <footer>
        </footer>
    </body>
</html>
