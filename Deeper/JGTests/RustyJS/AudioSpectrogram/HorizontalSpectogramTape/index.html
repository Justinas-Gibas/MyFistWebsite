<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rusty Horizontal Tape Spectrum Visualizer</title>
  <style>
    body { 
      margin: 0; 
      background: #111; 
      color: #fff; 
      font-family: sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 1em;
      min-height: 100vh;
      box-sizing: border-box;
    }
    #controls { 
      margin: 1em; 
      display: flex; 
      gap: 1em; 
      flex-wrap: wrap; 
      justify-content: center;
      align-items: center;
    }
    canvas { 
      background: #222; 
      image-rendering: pixelated; 
      width: 100%;
      height: 60vh;
      max-width: 100vw;
      border: 2px solid #444;
      border-radius: 8px;
    }
    .slider { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-width: 120px;
    }
    .slider input { 
      width: 150px; 
    }
    .slider label {
      margin-bottom: 0.5em;
      font-size: 0.9em;
    }
    
    @media (max-width: 768px) {
      body { padding: 0.5em; }
      #controls { gap: 0.5em; margin: 0.5em; }
      .slider { min-width: 100px; }
      .slider input { width: 120px; }
      canvas { height: 50vh; }
      h2 { font-size: 1.2em; margin: 0.5em; }
    }
  </style>
</head>
<body>
  <h2>Rust-Tape Spectrum Visualizer</h2>
  <div id="controls">
    
    <input type="file" id="fileInput" accept="audio/*" />
    <div class="slider">
      <label for="freqSlider">Tone Frequency</label>
      <input type="range" id="freqSlider" min="0" max="100" value="50" />
      <span id="freqValue">440 Hz</span>
    </div>
    <div class="slider">
      <label for="waveSelect">Waveform</label>
      <select id="waveSelect">
        <option value="sine">Sine</option>
        <option value="square">Square</option>
        <option value="sawtooth">Sawtooth</option>
        <option value="triangle">Triangle</option>
      </select>
    </div>
    <button id="toggleTone">Start Tone</button>
  </div>
  <canvas id="tape"></canvas>

  <script>
    const canvas = document.getElementById('tape');
    const ctx = canvas.getContext('2d');
    
    // Set canvas size dynamically
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    
    // Initial resize and add event listener
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    let WIDTH = canvas.width;
    let HEIGHT = canvas.height;

    // Audio context and related variables
    let audioCtx = null;
    let analyser = null;
    let dataArray = null;
    let oscillator = null;
    let animationId = null;
    let currentSource = null;
    let currentBuffer = null;

    // Get DOM elements
    const fileInput = document.getElementById('fileInput');
    const toggleTone = document.getElementById('toggleTone');
    const freqSlider = document.getElementById('freqSlider');
    const freqValue = document.getElementById('freqValue');
    const waveSelect = document.getElementById('waveSelect');

    // Heat map color function
    function getHeatMapColor(value) {
      // Normalize value to 0-1 range
      const normalized = Math.min(value / 255, 1);
      
      // Apply exponential scaling to enhance differences
      const enhanced = Math.pow(normalized, 0.7);
      
      if (enhanced < 0.01) return 'rgb(0, 0, 0)'; // Black for very low values
      
      // Heat map colors: black -> red -> yellow -> white
      if (enhanced < 0.25) {
        const r = Math.floor(enhanced * 4 * 255);
        return `rgb(${r}, 0, 0)`;
      } else if (enhanced < 0.5) {
        const g = Math.floor((enhanced - 0.25) * 4 * 255);
        return `rgb(255, ${g}, 0)`;
      } else if (enhanced < 0.75) {
        const b = Math.floor((enhanced - 0.5) * 4 * 255);
        return `rgb(255, 255, ${b})`;
      } else {
        const intensity = Math.floor(enhanced * 255);
        return `rgb(${intensity}, ${intensity}, ${intensity})`;
      }
    }

    // Convert slider value to frequency using logarithmic scale
    function sliderToFrequency(sliderValue) {
      // Map 0-100 slider to 20Hz-20kHz logarithmically
      const minFreq = 20;
      const maxFreq = 20000;
      const logMin = Math.log10(minFreq);
      const logMax = Math.log10(maxFreq);
      const logValue = logMin + (sliderValue / 100) * (logMax - logMin);
      return Math.round(Math.pow(10, logValue));
    }

    // Convert frequency to slider value using logarithmic scale
    function frequencyToSlider(frequency) {
      const minFreq = 20;
      const maxFreq = 20000;
      const logMin = Math.log10(minFreq);
      const logMax = Math.log10(maxFreq);
      const logFreq = Math.log10(Math.max(frequency, minFreq));
      return Math.round(((logFreq - logMin) / (logMax - logMin)) * 100);
    }

    // File input handler
    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const arrayBuffer = await file.arrayBuffer();
      if (!audioCtx) audioCtx = new AudioContext();
      const decoded = await audioCtx.decodeAudioData(arrayBuffer);
      currentBuffer = decoded;
      setupAudio(decoded);
    };

    // Setup audio analysis with looping
    function setupAudio(audioBuffer) {
      if (!audioCtx) audioCtx = new AudioContext();
      
      // Stop current source if exists
      if (currentSource) {
        currentSource.stop();
      }
      
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024; // Increased for better frequency resolution
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      
      currentSource = audioCtx.createBufferSource();
      currentSource.buffer = audioBuffer;
      currentSource.loop = true; // Enable looping
      currentSource.connect(analyser);
      analyser.connect(audioCtx.destination);
      currentSource.start();
      
      // Restart when ended (backup for loop)
      currentSource.onended = () => {
        if (currentBuffer) {
          setupAudio(currentBuffer);
        }
      };
      
      draw();
    }

    function draw() {
      // Update canvas dimensions
      WIDTH = canvas.width;
      HEIGHT = canvas.height;
      
      if (!analyser) {
        animationId = requestAnimationFrame(draw);
        return;
      }
      
      analyser.getByteFrequencyData(dataArray);
      
      // Shift existing image data to the left
      const imageData = ctx.getImageData(1, 0, WIDTH - 1, HEIGHT);
      ctx.putImageData(imageData, 0, 0);
      
      // Clear the rightmost column
      ctx.clearRect(WIDTH - 1, 0, 1, HEIGHT);
      
      // Create frequency-weighted mapping for low frequencies
      const frequencyBands = 128; // Reduced bands for better visualization
      const maxFreq = audioCtx.sampleRate / 2;
      const bandData = new Array(frequencyBands).fill(0);
      
      // Weight frequencies logarithmically to emphasize low frequencies
      for (let i = 0; i < frequencyBands; i++) {
        const logIndex = Math.pow(i / frequencyBands, 2.5) * (dataArray.length - 1);
        const index = Math.floor(logIndex);
        const fraction = logIndex - index;
        
        // Interpolate between adjacent frequency bins
        if (index < dataArray.length - 1) {
          bandData[i] = dataArray[index] * (1 - fraction) + dataArray[index + 1] * fraction;
        } else {
          bandData[i] = dataArray[index] || 0;
        }
      }
      
      // Draw the new column on the right (flipped: low freq at bottom, high freq at top)
      const barHeight = HEIGHT / bandData.length;
      
      for (let i = 0; i < bandData.length; i++) {
        const value = bandData[i];
        // Flip the Y coordinate: high frequencies (higher i) at top, low frequencies at bottom
        const y = HEIGHT - ((i + 1) * barHeight);
        
        // Apply smoothing and normalization
        const smoothed = Math.min(value * 1.5, 255);
        const color = getHeatMapColor(smoothed);
        
        ctx.fillStyle = color;
        ctx.fillRect(WIDTH - 1, y, 1, barHeight);
      }
      
      animationId = requestAnimationFrame(draw);
    }

    // Tone generator controls
    let toneOn = false;
    toggleTone.onclick = () => {
      if (!audioCtx) audioCtx = new AudioContext();
      if (!toneOn) {
        // Setup analyser if not already done
        if (!analyser) {
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 1024;
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          draw();
        }
        
        oscillator = audioCtx.createOscillator();
        oscillator.type = waveSelect.value;
        const frequency = sliderToFrequency(freqSlider.value);
        oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        oscillator.connect(analyser);
        analyser.connect(audioCtx.destination);
        oscillator.start();
        toggleTone.textContent = 'Stop Tone';
      } else {
        oscillator.stop();
        toggleTone.textContent = 'Start Tone';
      }
      toneOn = !toneOn;
    };

    freqSlider.oninput = () => {
      const frequency = sliderToFrequency(freqSlider.value);
      freqValue.textContent = `${frequency} Hz`;
      if (oscillator) oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
    };

    // Initialize frequency display
    freqValue.textContent = `${sliderToFrequency(freqSlider.value)} Hz`;

    waveSelect.onchange = () => {
      if (oscillator) oscillator.type = waveSelect.value;
    };
  </script>
</body>
</html>
