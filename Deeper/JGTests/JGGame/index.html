            // --- Player Movement ---
            document.addEventListener('keydown', function (event) {
                switch (event.key) {
                    case 'w': // Move up
                        player.move(0, -1);
                        break;
                    case 's': // Move down
                        player.move(0, 1);
                        break;
                    case 'a': // Move left
                        player.move(-1, 0);
                        break;
                    case 'd': // Move right
                        player.move(1, 0);
                        break;
                }
            });

            document.addEventListener('keydown', function (event) {
                switch (event.key) {
                    case 'ArrowUp': // Scroll grid down
                        worldGrid.updateOffset(0, -1);
                        gridVisualizer.renderGrid(worldGrid.cells);
                        break;
                    case 'ArrowDown': // Scroll grid up
                        worldGrid.updateOffset(0, 1);
                        gridVisualizer.renderGrid(worldGrid.cells);
                        break;
                    case 'ArrowLeft': // Scroll grid right
                        worldGrid.updateOffset(-1, 0);
                        gridVisualizer.renderGrid(worldGrid.cells);
                        break;
                    case 'ArrowRight': // Scroll grid left
                        worldGrid.updateOffset(1, 0);
                        gridVisualizer.renderGrid(worldGrid.cells);
                        break;
                }
            });

            // IJKL controls for shifting grid cells
            document.addEventListener('keydown', function (event) {
                switch (event.key) {
                    case 'i': // Shift grid cells upward
                        worldGrid.shiftCells(0, -1);
                        gridVisualizer.renderGrid(worldGrid.cells);
                        break;
                    case 'k': // Shift grid cells downward
                        worldGrid.shiftCells(0, 1);
                        gridVisualizer.renderGrid(worldGrid.cells);
                        break;
                    case 'j': // Shift grid cells leftward
                        worldGrid.shiftCells(-1, 0);
                        gridVisualizer.renderGrid(worldGrid.cells);
                        break;
                    case 'l': // Shift grid cells rightward
                        worldGrid.shiftCells(1, 0);
                        gridVisualizer.renderGrid(worldGrid.cells);
                        break;
                }
            });

        </script>

        <script>
            /*
            * World.js
            */
            // --- Grid Logic ---
            const worldGrid = {
                cells: {},
                offsetX: 0, // Horizontal offset
                offsetY: 0, // Vertical offset

                createGridData(radius) {
                    console.log(`Creating grid data with radius ${radius}...`);
                    this.cells = {}; // Start with an empty grid data structure

                    // Loop through coordinates around the center cell (0,0)
                    for (let x = -radius; x <= radius; x++) {
                        for (let y = -radius; y <= radius; y++) {
                            // Create a unique key for this position (e.g., "0,0", "1,-1")
                            const key = `${x},${y}`;
                            // Store basic data for this grid position
                            this.cells[key] = {
                                x: x,       // The X coordinate
                                y: y,       // The Y coordinate
                                type: 'empty' // What's at this position (e.g., 'empty', 'tree', 'rock')
                                // We can add more properties later (like resources, enemies, etc.)
                            };
                        }
                    }
                    console.log(`Grid data created. Total positions: ${Object.keys(this.cells).length}`);
                    //console.log('Grid data:', this.cells); // Optional: See the created data
                },

                // Function to get the data for a specific grid position
                getCellData(x, y) {
                    const key = `${x - this.offsetX},${y - this.offsetY}`; // Adjust for offsets
                    return this.cells[key];
                }, 

                // Update the grid's offset
                updateOffset(dx, dy) {
                    this.offsetX += dx;
                    this.offsetY += dy;
                    console.log(`Grid offset updated: (${this.offsetX}, ${this.offsetY})`);
                    player.updateVisualPosition();
                },

                // Shift grid cells
                shiftCells(dx, dy) {
                    const newCells = {};
                    
                    // Move all existing cells to new positions
                    for (const key in this.cells) {
                        const cell = this.cells[key];
                        const newX = cell.x + dx;
                        const newY = cell.y + dy;
                        const newKey = `${newX},${newY}`;
                        
                        // Transfer cell data to new position with updated coordinates
                        newCells[newKey] = { 
                            ...cell, 
                            x: newX, 
                            y: newY 
                        };
                    }
                    
                    // Determine boundaries to find where we need to generate new cells
                    let minX = Infinity, maxX = -Infinity;
                    let minY = Infinity, maxY = -Infinity;
                    
                    Object.values(newCells).forEach(cell => {
                        minX = Math.min(minX, cell.x);
                        maxX = Math.max(maxX, cell.x);
                        minY = Math.min(minY, cell.y);
                        maxY = Math.max(maxY, cell.y);
                    });
                    
                    // Generate new cells along the edges created by the shift
                    if (dx > 0) { // We moved right, generate new cells on left side
                        for (let y = minY; y <= maxY; y++) {
                            for (let x = minX - 1; x >= minX - dx; x--) {
                                const key = `${x},${y}`;
                                newCells[key] = this.generateCellData(x, y);
                            }
                        }
                    } else if (dx < 0) { // We moved left, generate new cells on right side
                        for (let y = minY; y <= maxY; y++) {
                            for (let x = maxX + 1; x <= maxX - dx; x++) {
                                const key = `${x},${y}`;
                                newCells[key] = this.generateCellData(x, y);
                            }
                        }
                    }
                    
                    if (dy > 0) { // We moved down, generate new cells on top
                        for (let x = minX; x <= maxX; x++) {
                            for (let y = minY - 1; y >= minY - dy; y--) {
                                const key = `${x},${y}`;
                                if (!newCells[key]) { // Avoid duplicating corner cells
                                    newCells[key] = this.generateCellData(x, y);
                                }
                            }
                        }
                    } else if (dy < 0) { // We moved up, generate new cells on bottom
                        for (let x = minX; x <= maxX; x++) {
                            for (let y = maxY + 1; y <= maxY - dy; y++) {
                                const key = `${x},${y}`;
                                if (!newCells[key]) { // Avoid duplicating corner cells
                                    newCells[key] = this.generateCellData(x, y);
                                }
                            }
                        }
                    }
                    
                    // Update the cells object with our new grid
                    this.cells = newCells;
                    console.log(`Grid cells shifted by (${dx}, ${dy}). New cell count: ${Object.keys(this.cells).length}`);
                },
                
                // Generate cell data at a specific position
                generateCellData(x, y) {
                    // Here we could add procedural generation logic
                    // For now, we'll create a simple cell with a random type
                    const types = ['empty', 'grass', 'dirt', 'rock'];
                    const typeIndex = Math.floor(Math.random() * 100);
                    
                    let type = 'empty'; // Default
                    
                    // Weight different types based on position and pseudo-random values
                    if (typeIndex < 70) { // 70% chance of empty space
                        type = 'empty';
                    } else if (typeIndex < 85) { // 15% chance of grass
                        type = 'grass';
                    } else if (typeIndex < 95) { // 10% chance of dirt
                        type = 'dirt';
                    } else { // 5% chance of rock
                        type = 'rock';
                    }
                    
                    return {
                        x: x,
                        y: y,
                        type: type
                    };
                }
            };
    
            // New module for visualization
            //
            const gridVisualizer = {
                cellSize: 50, // Visual cell size in pixels
                container: null,
                cellElements: {}, // Store references to cell elements
            
                // Initialize the visualization system
                init() {
                    // Create container for all grid cells
                    this.container = document.createElement('div');
                    this.container.id = 'grid-container';
                    this.container.style.position = 'absolute';
                    this.container.style.width = '100%';
                    this.container.style.height = '100%';
                    this.container.style.overflow = 'hidden';
                    document.body.appendChild(this.container);
                },
            
                // Convert grid coordinates to screen coordinates (centered)(div)
                // why not use css grid system?
                // this is a simple way to convert grid coordinates to screen coordinates
                gridToScreenPosition(x, y) {
                    const centerX = Math.floor(window.innerWidth / 2 - this.cellSize / 2);
                    const centerY = Math.floor(window.innerHeight / 2 - this.cellSize / 2);

                    return {
                        left: centerX + (x - worldGrid.offsetX) * this.cellSize,
                        top: centerY + (y - worldGrid.offsetY) * this.cellSize
                    };
                },
            
                // Create visual representation of cells
                renderGrid(gridData) {
                    // Clear any existing cells
                    this.container.innerHTML = '';
                    this.cellElements = {};

                    // Create visual elements for each cell in the grid data
                    for (const key in gridData) {
                        const cell = gridData[key];
                        this.renderCell(cell);
                    }

                    // Update player position
                    try {
                        player.updateVisualPosition();
                    } catch (error) {
                        console.error("Error updating player position:", error);
                    }

                    // Update other world objects
                    updateTreePosition();
                },
            
                // Create a visual representation of a single cell
                renderCell(cellData) {
                    const cellElement = document.createElement('div');
                    cellElement.className = 'grid-cell';
                    cellElement.style.position = 'absolute';
                    cellElement.style.width = this.cellSize + 'px';
                    cellElement.style.height = this.cellSize + 'px';
                    cellElement.style.border = '1px solid #61dafb';

                    // Position the cell using our conversion function
                    const position = this.gridToScreenPosition(cellData.x, cellData.y);
                    cellElement.style.left = position.left + 'px';
                    cellElement.style.top = position.top + 'px';

                    // Style based on cell type
                    switch(cellData.type) {
                        case 'grass':
                            cellElement.style.backgroundColor = 'rgba(0, 128, 0, 0.2)'; // Green for grass
                            break;
                        case 'dirt':
                            cellElement.style.backgroundColor = 'rgba(139, 69, 19, 0.2)'; // Brown for dirt
                            break;
                        case 'rock':
                            cellElement.style.backgroundColor = 'rgba(128, 128, 128, 0.3)'; // Gray for rock
                            break;
                        default:
                            cellElement.style.backgroundColor = 'rgba(0, 0, 0, 0.05)'; // Almost transparent for empty
                    }

                    // Add coordinate text for debugging
                    cellElement.innerHTML = `${cellData.x},${cellData.y}<br>${cellData.type}`;
                    cellElement.style.fontSize = '10px';
                    cellElement.style.display = 'flex';
                    cellElement.style.alignItems = 'center';
                    cellElement.style.justifyContent = 'center';
                    cellElement.style.textAlign = 'center';

                    // Highlight the center cell
                    if (cellData.x === 0 && cellData.y === 0) {
                        cellElement.style.outline = '2px solid yellow';
                    }

                    // Store reference to this element
                    this.cellElements[`${cellData.x},${cellData.y}`] = cellElement;

                    // Add the cell to the container
                    this.container.appendChild(cellElement);
                }
            };

           ;
    
           // --- Game Initialization ---
            console.log("--- Initializing Game Logic ---");
                    
            // 1. Create the logical grid data
            const gridRadius = 3; 
            worldGrid.createGridData(gridRadius); // Only call once
                    
            // 2. Initialize the player
            // from player.js
            //player.initialize(); // Initialize player position (0,0)
                    
            // 3. Initialize and render the grid visualization 
            gridVisualizer.init();
            gridVisualizer.renderGrid(worldGrid.cells);
                    
            // 4. Check player's starting position 
            const startingCellData = worldGrid.getCellData(0, 0);
            
            
            console.log("--- Initialization Complete ---");
    
        </script>

        <script>
            /*
            * Player.js
            * user input and pawn logic
            */
            // --- Player Logic ---

            const player = {
                x: 0, // Player's grid X position
                y: 0, // Player's grid Y position

                initialize() {
                    this.x = 0;
                    this.y = 0;
                    console.log(`Player initialized at grid position: ${this.x}, ${this.y}`);
                    this.updateVisualPosition();
                },

                // Update player's visual position based on grid coordinates
                updateVisualPosition() {
                    const position = gridVisualizer.gridToScreenPosition(this.x, this.y);
                    const playerElement = document.getElementById('player');
                    playerElement.style.left = position.left + 6 /* to center in cell */ + 'px';
                    playerElement.style.top = position.top + 6 /* to center in cell */ + 'px';
                },
            
                // Move the player in the grid
                move(dx, dy) {
                    const newX = this.x + dx;
                    const newY = this.y + dy;
                
                    // Check if the new position exists in the grid
                    if (worldGrid.getCellData(newX, newY)) {
                        this.x = newX;
                        this.y = newY;
                        console.log(`Player moved to grid position: ${this.x}, ${this.y}`);
                        this.updateVisualPosition();
                    } else {
                        console.warn(`Cannot move to position: ${newX}, ${newY} (out of bounds)`);
                    }
                }
            };
