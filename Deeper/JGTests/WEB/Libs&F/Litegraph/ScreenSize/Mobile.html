<!DOCTYPE html>
<html>
<head>
  <title>Litegraph Demo</title>
  <!-- Mobile viewport configuration - CRITICAL for mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <script src="https://cdn.jsdelivr.net/gh/jagenjo/litegraph.js/build/litegraph.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jagenjo/litegraph.js/css/litegraph.css" />
  <link rel="icon" type="image/x-icon" href="../../../../../upper/JG_favicon.ico">


  <style>
    html, body { 
      margin: 0; 
      height: 100%; 
      overflow: hidden; 
      font-family: Arial, sans-serif;
      /* Prevent text selection on mobile */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    canvas { 
      width: 100vw; 
      height: 100vh; 
      display: block; 
      background: #1e1e1e; 
      touch-action: none;
    }
    
    .right-click-indicator {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1000;
      border: 3px solid rgba(55, 250, 55, 0.7);
      background: radial-gradient(circle, rgba(55, 250, 55, 0.9) 0%, transparent 0%);
      transform: translate(-50%, -50%);
      transition: all 0.1s ease-out;
    }
    
    @keyframes countdown {
      from {
        transform: translate(-50%, -50%) scale(0.1);
        opacity: 0.1;
      }
      to {
        transform: translate(-50%, -50%) scale(1.61);
        opacity: 0.9;
      }
    }
  </style>  
</head>
<body>
  <canvas id="graphcanvas" style='border: 1px solid'></canvas>
  <script>
    // Responsive canvas setup
    function setupCanvas() {
      const canvas = document.getElementById('graphcanvas');
      const dpr = window.devicePixelRatio || 1;
      
      // Set canvas size based on viewport
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      
      // Scale the canvas back down using CSS
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      
      // Scale the drawing context so everything draws at the higher resolution
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
    }

    // Initial setup
    setupCanvas();
    
    // Handle window resize
    window.addEventListener('resize', () => {
      setupCanvas();
      if (window.canvas) {
        window.canvas.resize();
      }
    });

    // Create graph and canvas
    const graph = new LGraph();
    const canvas = new LGraphCanvas("#graphcanvas", graph);
    window.canvas = canvas; // Store reference for resize

    // Mobile-specific optimizations
    function setupMobileOptimizations() {
      // Detect if we're on mobile
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
                     || window.innerWidth < 768;
      
      if (isMobile) {
        // Increase default zoom for mobile (makes everything bigger)
        canvas.ds.scale = 1.5; // Default is 1.0, increase to 1.5x
        
        // Adjust node rendering scale
        LiteGraph.NODE_TITLE_HEIGHT = 24; // Default is 16
        LiteGraph.NODE_SLOT_HEIGHT = 20;  // Default is 15
        
        // Make connection points larger for touch
        LiteGraph.LINK_THICKNESS = 4;    // Default is 2
        
        // Adjust text sizes
        canvas.title_text_font = "bold 14px Arial";     // Default is "bold 12px Arial"
        canvas.inner_text_font = "normal 12px Arial";   // Default is "normal 10px Arial"
        
        // Increase minimum node size for easier touch interaction
        LiteGraph.NODE_MIN_WIDTH = 120;  // Default is 80
        
        // Set initial zoom to show nodes at a comfortable size
        canvas.ds.offset[0] = -50;  // Pan slightly to center content
        canvas.ds.offset[1] = -50;
        
        console.log("Mobile optimizations applied - Scale:", canvas.ds.scale);
      }
    }

    // Apply mobile optimizations before creating nodes
    setupMobileOptimizations();

    // Create a constant node
    const constA = LiteGraph.createNode("basic/const");
    constA.pos = [100, 100];
    constA.setValue(3);
    graph.add(constA);

    const constB = LiteGraph.createNode("basic/const");
    constB.pos = [100, 200];
    constB.setValue(7);
    graph.add(constB);

    // Custom add node
    function AddNode() {
      this.addInput("A", "number");
      this.addInput("B", "number");
      this.addOutput("Sum", "number");
    }
    AddNode.title = "Add";
    AddNode.prototype.onExecute = function() {
      const a = this.getInputData(0) || 0;
      const b = this.getInputData(1) || 0;
      this.setOutputData(0, a + b);
    };
    LiteGraph.registerNodeType("math/add", AddNode);

    const adder = LiteGraph.createNode("math/add");
    adder.pos = [300, 150];
    graph.add(adder);

    // Watch the result
    const watcher = LiteGraph.createNode("basic/watch");
    watcher.pos = [500, 150];
    graph.add(watcher);

    // Connect the nodes
    constA.connect(0, adder, 0);
    constB.connect(0, adder, 1);
    adder.connect(0, watcher, 0);

    // Start the graph
    graph.start();
    window.canvas.resize();

    // Add zoom controls for mobile users
    function addMobileZoomControls() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
                     || window.innerWidth < 768;
      
      if (isMobile) {
        // Add pinch-to-zoom support (if not already supported)
        let initialDistance = 0;
        let initialScale = canvas.ds.scale;
        
        canvas.canvas.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            initialDistance = Math.sqrt(dx*dx + dy*dy);
            initialScale = canvas.ds.scale;
          }
        });
        
        canvas.canvas.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2) {
            e.preventDefault();
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const distance = Math.sqrt(dx*dx + dy*dy);
            
            const scale = initialScale * (distance / initialDistance);
            canvas.ds.scale = Math.max(0.5, Math.min(3.0, scale)); // Limit zoom range
            canvas.setDirty(true, true);
          }
        });
      }
    }
    
    addMobileZoomControls();
  </script>
</body>
</html>
