<html>
<head>
	<link rel="stylesheet" type="text/css" href="../../../../../../lib/Litegraph/litegraph.css">
	<script type="text/javascript" src="../../../../../../lib/Litegraph/litegraph.js"></script>
	<style>
		body {
			margin: 0;
			padding: 20px;
			font-family: Arial, sans-serif;
		}
		.graph-container {
			display: inline-block;
			margin: 10px;
			vertical-align: top;
		}
		.graph-title {
			text-align: center;
			margin-bottom: 10px;
			font-weight: bold;
		}
		canvas {
			border: 1px solid #333;
		}
	</style>
</head>
<body>
	<div class="graph-container">
		<div class="graph-title">Graph 1</div>
		<canvas id='mycanvas1' width='512' height='512'></canvas>
	</div>
	
	<div class="graph-container">
		<div class="graph-title">Graph 2</div>
		<canvas id='mycanvas2' width='512' height='512'></canvas>
	</div>

	<div class="graph-container">
		<div class="graph-title">Graph 3</div>
		<canvas id='mycanvas3' width='512' height='512'></canvas>
	</div>

<script>
// First Graph
var graph1 = new LGraph();
var canvas1 = new LGraphCanvas("#mycanvas1", graph1);

var node_const1 = LiteGraph.createNode("basic/const");
node_const1.pos = [10,100];
graph1.add(node_const1);
node_const1.setValue(4.5);

var node_watch1 = LiteGraph.createNode("basic/watch");
node_watch1.pos = [350,300];
graph1.add(node_watch1);

node_const1.connect(0, node_watch1, 0);
graph1.start();

// Second Graph
var graph2 = new LGraph();
var canvas2 = new LGraphCanvas("#mycanvas2", graph2);

var node_const2 = LiteGraph.createNode("basic/const");
node_const2.pos = [10,100];
graph2.add(node_const2);
node_const2.setValue(7.2);

var node_watch2 = LiteGraph.createNode("basic/watch");
node_watch2.pos = [350,300];
graph2.add(node_watch2);

// Add a math node to make the second graph different
var node_math = LiteGraph.createNode("math/operation");
node_math.pos = [180, 200];
graph2.add(node_math);

// Third Graph
var graph3 = new LGraph();
var canvas3 = new LGraphCanvas("#mycanvas3", graph3);

var node_const3 = LiteGraph.createNode("basic/const");
node_const3.pos = [10,100];
graph3.add(node_const3);
node_const3.setValue(7.2);

var node_watch3 = LiteGraph.createNode("basic/watch");
node_watch3.pos = [350,300];
graph3.add(node_watch3);

// Add a math node to make the second graph different
var node_math = LiteGraph.createNode("math/operation");
node_math.pos = [180, 200];
graph3.add(node_math);

node_const3.connect(0, node_math, 0);
node_math.connect(0, node_watch3, 0);

graph3.start();
</script>
</body>
</html>
