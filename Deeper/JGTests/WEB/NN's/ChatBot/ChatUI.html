<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enhanced QA Chatbot (Local & GPT-3.5)</title>
  <!-- TensorFlow.js and QnA Model (for local browser-based QnA) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/qna"></script>

  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top header style */
    header {
      background-color: #6200ee;
      color: #fff;
      padding: 10px;
      text-align: center;
    }

    /* Container for the three panels */
    #main-container {
      display: flex;
      flex: 1; /* fills remaining vertical space */
      overflow: hidden;
    }

    /* Left panel: for model controls, API key, etc. */
    #left-panel {
      width: 20%;
      min-width: 200px;
      border-right: 1px solid #ccc;
      padding: 10px;
      overflow-y: auto;
      background-color: #f7f7f7;
    }

    /* Center panel: main chat area */
    #center-panel {
      width: 60%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ccc;
    }

    /* Right panel: Extra info, instructions, logs if needed */
    #right-panel {
      width: 20%;
      min-width: 200px;
      padding: 10px;
      overflow-y: auto;
      background-color: #fafafa;
    }

    /* System prompt area at the top of center panel */
    #system-prompt {
      width: 100%;
      resize: vertical;
      padding: 8px;
      box-sizing: border-box;
    }

    /* Progress bar container */
    #progress-container {
      width: 100%;
      height: 20px;
      background-color: #ddd;
      margin-top: 5px;
    }

    /* Actual progress bar */
    #progress-bar {
      width: 0;
      height: 100%;
      background-color: #4caf50;
      text-align: center;
      color: #fff;
      font-size: 12px;
      transition: width 0.5s;
    }

    /* Chat display container */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      border-top: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      background-color: #fff;
    }

    /* Chat bubbles */
    .chat-bubble {
      padding: 10px;
      border-radius: 10px;
      margin: 5px 0;
      word-wrap: break-word;
      max-width: 80%;
    }

    .chat-bubble.you {
      background-color: #e1f5fe;
      text-align: left;
    }

    .chat-bubble.chatbot {
      background-color: #c8e6c9;
      text-align: right;
      margin-left: auto; /* push to the right */
    }

    .chat-bubble.system {
      background-color: #fff3e0;
      text-align: center;
      margin: 0 auto; /* center */
      font-style: italic;
    }

    /* Chat controls (bottom of center panel) */
    .chat-controls {
      display: flex;
      padding: 10px;
      background-color: #f1f1f1;
      border-top: 1px solid #ccc;
      align-items: center;
    }

    .chat-controls input[type="text"] {
      flex: 1;
      padding: 8px;
      margin-right: 10px;
    }

    .chat-controls button,
    .chat-controls select {
      margin-right: 5px;
      padding: 8px;
    }

    /* Left Panel Controls */
    #left-panel label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    #left-panel input[type="text"],
    #left-panel select {
      width: 100%;
      padding: 6px;
      margin-top: 5px;
    }

    /* Right Panel - We'll use this for logs or instructions */
    #right-panel pre {
      background: #eef;
      padding: 10px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>

<body>
  <header>
    <h1>Enhanced QA Chatbot (Local & GPT‑3.5)</h1>
  </header>

  <div id="main-container">
    <!-- Left Panel: Model Controls, OpenAI Key, etc. -->
    <div id="left-panel">
      <h2>Settings</h2>
      <label for="model-select">Select Model:</label>
      <select id="model-select">
        <option value="gpt3">OpenAI GPT‑3.5</option>
        <option value="bert">Local BERT (tfjs QnA)</option>
      </select>

      <label for="openai-api-key">OpenAI API Key:</label>
      <input type="text" id="openai-api-key" placeholder="sk-..." />

      <button id="load-model">Load Model</button>
      <button id="reset-chat">Reset Chat</button>

      <hr />

      <h3>Status & Info</h3>
      <p id="model-status">Model Status: <strong>Not Loaded</strong></p>
      <p id="error-logs" style="color: red;"></p>
    </div>

    <!-- Center Panel: System Prompt, Progress Bar, Chat, Controls -->
    <div id="center-panel">
      <!-- System prompt for additional context -->
      <textarea id="system-prompt" rows="3" placeholder="Enter system prompt here..." aria-label="System prompt"></textarea>

      <!-- Progress bar to indicate model loading status -->
      <div id="progress-container">
        <div id="progress-bar">Loading Model (0%)</div>
      </div>

      <!-- Chat area -->
      <div id="chat-container"></div>

      <!-- Chat controls -->
      <div class="chat-controls">
        <input type="text" id="user-input" placeholder="Ask a question..." aria-label="Question input">
        <button id="ask-button">Ask</button>
      </div>
    </div>

    <!-- Right Panel: Extra logs or references -->
    <div id="right-panel">
      <h2>Console Logs</h2>
      <pre id="console-logs">No logs yet.</pre>
    </div>
  </div>

  <script>
    // DOM elements
    const chatContainer    = document.getElementById("chat-container");
    const userInput        = document.getElementById("user-input");
    const progressBar      = document.getElementById("progress-bar");
    const askButton        = document.getElementById("ask-button");
    const resetChatButton  = document.getElementById("reset-chat");
    const loadModelButton  = document.getElementById("load-model");
    const modelSelect      = document.getElementById("model-select");
    const systemPrompt     = document.getElementById("system-prompt");
    const openAiKeyInput   = document.getElementById("openai-api-key");
    const modelStatus      = document.getElementById("model-status");
    const errorLogs        = document.getElementById("error-logs");
    const consoleLogs      = document.getElementById("console-logs");

    // Cache for loaded models
    let models = {};
    // Current model selection
    let currentModel = 'bert';

    // Helper to log to #right-panel's pre
    function logMessage(message, isError=false) {
      console.log(message); // Also log to real console
      consoleLogs.textContent += message + "\n";
      if (isError) {
        errorLogs.textContent = message;
      }
    }

    // Append chat bubbles
    function appendChatBubble(text, role) {
      const bubble = document.createElement("div");
      bubble.className = `chat-bubble ${role}`;
      bubble.textContent = text;
      chatContainer.appendChild(bubble);
      chatContainer.scrollTop = chatContainer.scrollHeight; // Auto-scroll to bottom
    }

    // Progress bar update
    function updateProgressBar(progress) {
      progressBar.style.width = `${progress}%`;
      progressBar.textContent = `Loading Model (${progress}%)`;
    }

    // Download progress simulation
    function updateProgressBarDuringDownload(event) {
      if (event.lengthComputable) {
        const progress = (event.loaded / event.total) * 100;
        updateProgressBar(progress.toFixed(0));
      }
    }

    // Simulate loading progress for demonstration
    async function simulateLoadingProgress(duration, callback) {
      const steps = 10;
      const stepTime = duration / steps;
      let progress = 0;
      const interval = setInterval(() => {
        progress += 10;
        updateProgressBar(progress.toFixed(0));
        if (progress >= 100) {
          clearInterval(interval);
          callback();
        }
      }, stepTime);
    }

    // Disable/enable controls
    function disableControls(disable) {
      userInput.disabled   = disable;
      askButton.disabled   = disable;
      modelSelect.disabled = disable;
      loadModelButton.disabled = disable;
      openAiKeyInput.disabled  = disable;
    }

    // Load the currently selected model
    async function loadModel() {
      currentModel = modelSelect.value;
      logMessage(`Loading model: ${currentModel}`);

      // If the model is already loaded, just notify
      if (models[currentModel]) {
        appendChatBubble(`Chatbot: Using cached ${currentModel} model.`, 'chatbot');
        modelStatus.innerHTML = `<strong>${currentModel}</strong> (cached)`;
        return;
      }

      disableControls(true);
      modelStatus.innerHTML = `<strong>Loading ${currentModel}...</strong>`;
      errorLogs.textContent = "";

      simulateLoadingProgress(3000, async () => {
        try {
          let newModel = null;
          if (currentModel === 'bert') {
            // Using TensorFlow.js QnA
            newModel = await qna.load();
            models[currentModel] = newModel;
            appendChatBubble(`Chatbot: Local BERT model loaded.`, 'chatbot');
            modelStatus.innerHTML = `<strong>${currentModel}</strong> (loaded)`;
            logMessage("Local BERT model loaded successfully.");
          } else if (currentModel === 'gpt3') {
            // We don't load anything locally. We rely on the OpenAI API.
            // Just confirm user has an API key.
            const apiKey = openAiKeyInput.value.trim();
            if (!apiKey) {
              const msg = "OpenAI API key is required for GPT‑3.5. Please enter your key.";
              appendChatBubble("Chatbot: " + msg, 'chatbot');
              logMessage(msg, true);
              modelStatus.innerHTML = `<strong>GPT‑3.5</strong> (no key)`;
            } else {
              // We'll store a dummy object to indicate GPT-3.5 is 'loaded'
              models[currentModel] = { dummy: true };
              appendChatBubble(`Chatbot: GPT‑3.5 ready (API).`, 'chatbot');
              modelStatus.innerHTML = `<strong>GPT‑3.5</strong> (ready)`;
              logMessage("GPT‑3.5 is ready to use via OpenAI API.");
            }
          } else {
            // You can add more local or external models here
            appendChatBubble("Chatbot: Unsupported model selected.", 'chatbot');
            logMessage("Unsupported model selected.", true);
            modelStatus.innerHTML = "Unsupported model";
          }
        } catch (error) {
          appendChatBubble("Chatbot: Model loading failed.", 'chatbot');
          modelStatus.innerHTML = "Loading failed";
          logMessage("Error loading model: " + error.message, true);
          console.error("Error loading model:", error);
        } finally {
          disableControls(false);
        }
      });
    }

    // Main function to ask a question
    async function askQuestion() {
      const question = userInput.value.trim();
      if (!question) {
        appendChatBubble("Chatbot: No question entered.", 'chatbot');
        return;
      }

      appendChatBubble("You: " + question, 'you');
      userInput.value = "";

      try {
        const answer = await getAnswer(question);
        appendChatBubble("Chatbot: " + answer, 'chatbot');
      } catch (error) {
        appendChatBubble("Chatbot: Error answering the question.", 'chatbot');
        logMessage("Error answering question: " + error.message, true);
        console.error("Error answering question:", error);
      }
    }

    // Get an answer from either local model or OpenAI
    async function getAnswer(question) {
      const systemText = systemPrompt.value.trim();
      const context = systemText || "Default context for question-answering.";

      // Ensure model is loaded
      if (!models[currentModel]) {
        const msg = "Chatbot: The model is not yet loaded or no API key is provided.";
        logMessage(msg, true);
        return msg;
      }

      if (currentModel === 'bert') {
        // Local BERT QnA via tfjs
        try {
          const localModel = models[currentModel];
          const answers = await localModel.findAnswers(question, context);
          if (answers.length === 0) {
            return "No answer found. Please rephrase your question.";
          }
          return answers[0].text;
        } catch (error) {
          logMessage("Error in local BERT QnA: " + error.message, true);
          throw error;
        }
      } else if (currentModel === 'gpt3') {
        // OpenAI GPT-3.5
        const apiKey = openAiKeyInput.value.trim();
        if (!apiKey) {
          logMessage("No OpenAI API key provided.", true);
          return "OpenAI API key required. Please enter it in the left panel.";
        }
        try {
          const response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${apiKey}`,
            },
            body: JSON.stringify({
              model: "gpt-3.5-turbo",
              messages: [
                { role: "system", content: context },
                { role: "user", content: question }
              ],
              max_tokens: 200,
              temperature: 0.7
            }),
          });

          if (!response.ok) {
            const errMsg = `OpenAI API Error: ${response.status} ${response.statusText}`;
            logMessage(errMsg, true);
            return errMsg;
          }

          const data = await response.json();
          const gptAnswer = data.choices[0].message.content;
          return gptAnswer;
        } catch (error) {
          logMessage("Error calling OpenAI: " + error.message, true);
          throw error;
        }
      } else {
        // Fallback for unsupported
        return "Selected model is not implemented.";
      }
    }

    // Event listeners
    askButton.addEventListener("click", askQuestion);
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        askQuestion();
      }
    });

    loadModelButton.addEventListener("click", loadModel);

    resetChatButton.addEventListener("click", () => {
      chatContainer.innerHTML = "";
      appendChatBubble("System: Chat reset.", 'system');
      logMessage("Chat reset by user.");
      modelStatus.innerHTML = "Model Status: <strong>Not Loaded</strong>";
      models = {};
      // optionally re-load the model automatically:
      // loadModel();
    });

    modelSelect.addEventListener("change", (e) => {
      currentModel = e.target.value;
      appendChatBubble(`Chatbot: Switched to ${currentModel}. Load it if not loaded.`, 'chatbot');
      modelStatus.innerHTML = `<strong>${currentModel}</strong> (not loaded yet)`;
      logMessage(`Model changed to: ${currentModel}`);
    });

    // Initial actions
    appendChatBubble("System: Welcome! Please choose a model and load it. Then ask a question.", 'system');
    logMessage("Page loaded. Waiting for user input...");
    // If you'd like to auto-load the default model on page load, uncomment below:
    // loadModel();
  </script>
</body>
</html>
