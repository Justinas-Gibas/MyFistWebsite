<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>API Tester</title>
  <style>
    /* Basic styling */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #e9ecef;
      border-radius: 4px;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>API Tester 0.1.0</h1>
    <label for="prompt">Enter Prompt:</label>
    <input type="text" id="prompt" placeholder="Type your prompt here..." />
    <button id="testApiBtn">Test API</button>
    <div id="result" class="result" style="display:none;"></div>
  </div>

  <script>
    document.getElementById("testApiBtn").addEventListener("click", function () {
      const promptValue = document.getElementById("prompt").value.trim();
      const resultDiv = document.getElementById("result");

      if (!promptValue) {
        alert("Please enter a prompt.");
        return;
      }
      
      resultDiv.style.display = "block";
      resultDiv.innerHTML = "Loading...";

      // Call your secure Vercel API endpoint.
      fetch("https://haveno-vercel.vercel.app/api/openai/generate-answer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: promptValue })
      })
      .then(response => {
        if (!response.ok) {
          throw new Error("API error: " + response.status);
        }
        return response.json();
      })
      .then(data => {
        if (data.content) {
          resultDiv.innerHTML = "<strong>Answer:</strong><br>" + data.content;
        } else if (data.error) {
          resultDiv.innerHTML = "<strong>Error:</strong><br>" + data.error;
        } else {
          resultDiv.innerHTML = "<strong>Error:</strong><br>Unexpected response.";
        }
      })
      .catch(error => {
        resultDiv.innerHTML = "<strong>Error:</strong><br>" + error.message;
      });
    });
  </script>
</body>
</html>
