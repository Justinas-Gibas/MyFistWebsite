<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Clone</title>
    <style>
        :root {
            --border-color: #e0e0e0;
            --header-bg: #f8f9fa;
            --selection-color: #107c41;
            --cell-width: 100px;
            --row-height: 25px;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #toolbar {
            padding: 8px;
            background: #f3f3f3;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #formula-bar {
            flex-grow: 1;
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
        }

        #spreadsheet-container {
            flex-grow: 1;
            overflow: auto;
            position: relative;
        }

        table {
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
        }

        th {
            background-color: var(--header-bg);
            font-weight: normal;
            color: #666;
            text-align: center;
            position: sticky;
            z-index: 10;
        }

        /* Column Headers */
        thead th {
            top: 0;
            height: var(--row-height);
            min-width: var(--cell-width);
            resize: horizontal;
            overflow: auto;
        }
        
        /* Row Headers */
        tbody th {
            left: 0;
            width: 40px;
            z-index: 11; /* Higher than normal cells but lower than top-left corner */
            background-color: var(--header-bg);
        }

        /* The top-left corner cell */
        thead th:first-child {
            z-index: 20;
            left: 0;
            top: 0;
            width: 40px;
            min-width: 40px;
        }

        td input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            padding: 0 4px;
            font-family: inherit;
            font-size: inherit;
            background: transparent;
            cursor: default;
        }

        td input:focus {
            cursor: text;
            background: white;
        }

        td.selected {
            border: 2px solid var(--selection-color);
            z-index: 5;
            position: relative;
        }

        /* Utility classes */
        .text-bold { font-weight: bold; }
        .text-italic { font-style: italic; }
    </style>
</head>
<body>

<div id="toolbar">
    <div id="selected-cell-display" style="font-weight: bold; width: 30px;">A1</div>
    <span>fx</span>
    <input type="text" id="formula-bar" placeholder="Enter value or formula (e.g., =SUM(A1:A5))">
</div>

<div id="spreadsheet-container">
    <table id="spreadsheet">
        <thead>
            <tr id="header-row">
                <th></th> <!-- Corner -->
                <!-- Column headers generated by JS -->
            </tr>
        </thead>
        <tbody id="spreadsheet-body">
            <!-- Rows generated by JS -->
        </tbody>
    </table>
</div>

<script>
    const ROWS = 100;
    const COLS = 26; // A-Z
    const spreadsheetBody = document.getElementById('spreadsheet-body');
    const headerRow = document.getElementById('header-row');
    const formulaBar = document.getElementById('formula-bar');
    const selectedCellDisplay = document.getElementById('selected-cell-display');
    
    let selectedCell = null;
    const cellData = {}; // Stores raw values/formulas: { "A1": "10", "B1": "=A1*2" }

    // Initialize Grid
    function initGrid() {
        // Create Column Headers (A, B, C...)
        for (let i = 0; i < COLS; i++) {
            const th = document.createElement('th');
            th.innerText = String.fromCharCode(65 + i);
            headerRow.appendChild(th);
        }

        // Create Rows
        for (let r = 1; r <= ROWS; r++) {
            const tr = document.createElement('tr');
            
            // Row Header (1, 2, 3...)
            const th = document.createElement('th');
            th.innerText = r;
            tr.appendChild(th);

            // Cells
            for (let c = 0; c < COLS; c++) {
                const td = document.createElement('td');
                const cellId = `${String.fromCharCode(65 + c)}${r}`;
                
                const input = document.createElement('input');
                input.dataset.id = cellId;
                input.addEventListener('focus', onCellFocus);
                input.addEventListener('blur', onCellBlur);
                input.addEventListener('keydown', onCellKeyDown);
                input.addEventListener('input', onCellInput); // Real-time update for simple values

                td.appendChild(input);
                tr.appendChild(td);
            }
            spreadsheetBody.appendChild(tr);
        }
    }

    function onCellFocus(e) {
        if (selectedCell) {
            selectedCell.parentElement.classList.remove('selected');
        }
        selectedCell = e.target;
        selectedCell.parentElement.classList.add('selected');
        
        const cellId = selectedCell.dataset.id;
        selectedCellDisplay.innerText = cellId;
        
        // Show raw formula in bar, calculated value in cell remains until edited
        formulaBar.value = cellData[cellId] || '';
    }

    function onCellBlur(e) {
        const cellId = e.target.dataset.id;
        const value = e.target.value;
        updateCell(cellId, value);
    }

    function onCellKeyDown(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            e.target.blur();
            // Move selection down logic could go here
            const currentId = e.target.dataset.id;
            const colChar = currentId.charAt(0);
            const rowNum = parseInt(currentId.substring(1));
            const nextId = `${colChar}${rowNum + 1}`;
            const nextInput = document.querySelector(`input[data-id="${nextId}"]`);
            if (nextInput) nextInput.focus();
        }
    }
    
    // Sync formula bar with cell input
    function onCellInput(e) {
        formulaBar.value = e.target.value;
    }

    // Sync cell with formula bar input
    formulaBar.addEventListener('input', (e) => {
        if (selectedCell) {
            selectedCell.value = e.target.value;
            // We don't calculate immediately on every keystroke for formulas usually, 
            // but we update the raw data store on blur/enter.
        }
    });

    formulaBar.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && selectedCell) {
            selectedCell.blur();
            selectedCell.focus(); // Refocus to show calculated result
        }
    });

    function updateCell(cellId, value) {
        cellData[cellId] = value;
        recalculateAll();
    }

    function recalculateAll() {
        // In a real app, build a dependency graph. Here, we brute force recalculate all.
        for (let r = 1; r <= ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const id = `${String.fromCharCode(65 + c)}${r}`;
                const rawValue = cellData[id];
                const input = document.querySelector(`input[data-id="${id}"]`);
                
                if (rawValue && rawValue.startsWith('=')) {
                    const result = evaluateFormula(rawValue.substring(1));
                    input.value = result;
                } else {
                    input.value = rawValue || '';
                }
            }
        }
    }

    function evaluateFormula(formula) {
        try {
            // Replace cell references (A1, B2) with their values
            const parsedFormula = formula.toUpperCase().replace(/([A-Z])(\d+)/g, (match, col, row) => {
                const cellId = `${col}${row}`;
                let val = cellData[cellId];
                
                // If the referenced cell is also a formula, we need its calculated value (recursive-ish)
                // For simplicity in this basic clone, we grab the DOM value if it exists, or 0
                const input = document.querySelector(`input[data-id="${cellId}"]`);
                let num = parseFloat(input ? input.value : 0);
                return isNaN(num) ? 0 : num;
            });

            // Handle basic ranges like SUM(A1:A3)
            // This is a very basic parser.
            if (parsedFormula.startsWith('SUM(')) {
                return calculateRange(parsedFormula, (arr) => arr.reduce((a, b) => a + b, 0));
            }
            if (parsedFormula.startsWith('AVG(')) {
                return calculateRange(parsedFormula, (arr) => arr.reduce((a, b) => a + b, 0) / arr.length);
            }

            // Safe evaluation of math
            // Note: eval is dangerous in production, but standard for simple JS clones.
            return eval(parsedFormula);
        } catch (e) {
            return '#ERROR';
        }
    }

    function calculateRange(funcString, operation) {
        // Extract A1:A5 from SUM(A1:A5)
        const match = funcString.match(/\((.*?)\)/);
        if (!match) return '#ERR';
        
        const range = match[1].split(':');
        if (range.length !== 2) return '#ERR';

        const start = range[0];
        const end = range[1];
        
        const startCol = start.charCodeAt(0);
        const startRow = parseInt(start.substring(1));
        const endCol = end.charCodeAt(0);
        const endRow = parseInt(end.substring(1));

        let values = [];

        for (let c = startCol; c <= endCol; c++) {
            for (let r = startRow; r <= endRow; r++) {
                const cellId = `${String.fromCharCode(c)}${r}`;
                const input = document.querySelector(`input[data-id="${cellId}"]`);
                let val = parseFloat(input ? input.value : 0);
                values.push(isNaN(val) ? 0 : val);
            }
        }
        
        return operation(values);
    }

    initGrid();
</script>

</body>
</html>
