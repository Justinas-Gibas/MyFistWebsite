<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>audioToColors4</title>
    <style>
        * { margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; }
        #controls { position: absolute; top: 60px; left: 20px; padding: 8px; background: rgba(0,0,0,0.4); color: #fff; font: 14px/1.4 sans-serif; border-radius: 6px; }
        #controls .row { display: grid; grid-template-columns: 28px 240px; gap: 8px; align-items: center; margin: 6px 0; }
        .sliderwrap { position: relative; height: 24px; }
        .sliderwrap input[type="range"] { position: absolute; inset: 0; width: 100%; background: none; }
        /* Optional: ensure upper thumb sits above when overlapping */
        .sliderwrap input[max-thumb] { z-index: 2; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <button id="startButton" style="position:absolute;top:20px;left:20px;">Start</button>
    <div id="controls">
        <div class="row">
            <label for="lfoRmin">R</label>
            <div class="sliderwrap">
                <input id="lfoRmin" type="range" min="0" max="10" step="0.01">
                <input id="lfoRmax" type="range" min="0" max="10" step="0.01" max-thumb>
            </div>
        </div>
        <div class="row">
            <label for="lfoGmin">G</label>
            <div class="sliderwrap">
                <input id="lfoGmin" type="range" min="0" max="10" step="0.01">
                <input id="lfoGmax" type="range" min="0" max="10" step="0.01" max-thumb>
            </div>
        </div>
        <div class="row">
            <label for="lfoBmin">B</label>
            <div class="sliderwrap">
                <input id="lfoBmin" type="range" min="0" max="10" step="0.01">
                <input id="lfoBmax" type="range" min="0" max="10" step="0.01" max-thumb>
            </div>
        </div>
    </div>

    <script>        
        const canvas = document.getElementById('canvas'); // get canvas before using it
        const TWO_PI = Math.PI * 2; // helpful constant for sine waves

        // Try WebGPU first, fallback to WebGL2
        let webgpu = canvas.getContext('webgpu', { antialias: true, xrCompatible: true });
        let gl = null;
        if (webgpu) {
            console.log('WebGPU is supported and initialized.');
        } else if (!webgpu) {
            console.log('WebGPU is not supported, falling back to WebGL2');
            gl = canvas.getContext('webgl2', { antialias: true, xrCompatible: true });
            if (!gl) { 
                alert('WebGL2 is required for this application.'); 
            }
        }

        // WebAudio context setup
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // we will use WebAudio oscillators to drive some parameters
        const oscR = audioCtx.createOscillator(); oscR.frequency.value = 0.01;
        const oscG = audioCtx.createOscillator(); oscG.frequency.value = 0.2;
        const oscB = audioCtx.createOscillator(); oscB.frequency.value = 0.3;

        function linkDoubleSlider(minId, maxId, oscillator) {
            const minEl = document.getElementById(minId);
            const maxEl = document.getElementById(maxId);

            function sync() {
                const lo = Math.min(Number(minEl.value), Number(maxEl.value));
                const hi = Math.max(Number(minEl.value), Number(maxEl.value));
                minEl.value = lo;
                maxEl.value = hi;
                oscillator.frequency.value = (lo + hi) * 0.5;
            }

            minEl.addEventListener('input', sync);
            maxEl.addEventListener('input', sync);
            sync();
        }

        // Link all three LFOs
        linkDoubleSlider('lfoRmin', 'lfoRmax', oscR);
        linkDoubleSlider('lfoGmin', 'lfoGmax', oscG);
        linkDoubleSlider('lfoBmin', 'lfoBmax', oscB);

        // Gate clicks so lower sliders only respond when the thumb is grabbed; keeps tooltip aligned.
        const MIN_HANDLE_TOLERANCE = 14; // px distance allowed between click and thumb center
        function restrictToThumb(rangeEl) {
            rangeEl.addEventListener('pointerdown', evt => {
                const rect = rangeEl.getBoundingClientRect();
                const min = Number(rangeEl.min);
                const max = Number(rangeEl.max);
                const value = Number(rangeEl.value);
                const percent = (max === min) ? 0 : (value - min) / (max - min);
                const thumbX = rect.left + percent * rect.width;
                if (Math.abs(evt.clientX - thumbX) > MIN_HANDLE_TOLERANCE) {
                    evt.preventDefault(); // ignore track click away from thumb
                }
            });
        }

        ['lfoRmin', 'lfoGmin', 'lfoBmin'].forEach(id => restrictToThumb(document.getElementById(id)));

        // Ensure AudioContext starts after a user gesture (required by browsers)
        function resumeAudioOnce() {
            audioCtx.resume();
            window.removeEventListener('pointerdown', resumeAudioOnce);
        }
        // Start audio on button click
        document.getElementById('startButton').addEventListener('click', () => {
            resumeAudioOnce();
            oscR.start(); oscG.start(); oscB.start();
        }, { once: true });

        let last = 0; // Initialize timestamp for delta time calculation

        function resize() {
            const w = innerWidth, h = innerHeight, dpr = devicePixelRatio || 1;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
        }
        addEventListener('resize', resize);
        resize(); // Initial resize

        function loop(t) {
            const dt = ((t - last) / 1000) || 0;
            last = t;

            // Update WebAudio context (best effort; actual start requires user gesture)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // change background color using WebAudio time + oscillator frequencies
            const tSec = audioCtx.currentTime;
            const r = Math.floor((Math.sin(TWO_PI * oscR.frequency.value * tSec) * 0.5 + 0.5) * 255);
            const g = Math.floor((Math.sin(TWO_PI * oscG.frequency.value * tSec) * 0.5 + 0.5) * 255);
            const b = Math.floor((Math.sin(TWO_PI * oscB.frequency.value * tSec) * 0.5 + 0.5) * 255);
            canvas.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;

            requestAnimationFrame(loop); // Continue the loop
        }

        (function main() {
            requestAnimationFrame(loop); // Start the loop
        })();
    </script>
</body>
</html>
