<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Blueprint Editor</title>
    <style>
        /* --- Basic Layout & Theming --- */
        :root {
            --bg-color: #282c34;
            --panel-color: #3a3f4b;
            --text-color: #abb2bf;
            --border-color: #4b5263;
            --accent-color: #61afef;
            --canvas-bg: #1e2127;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        h2, h3 {
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            font-weight: 500;
        }

        /* --- Main Structure --- */
        #controls-panel {
            width: 280px;
            padding: 16px;
            background-color: var(--panel-color);
            overflow-y: auto;
            border-right: 2px solid var(--border-color);
        }
        #main-content {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 10px;
            height: 100vh;
            box-sizing: border-box;
        }
        
        /* --- UI Controls --- */
        .control-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        input[type="number"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        .dimension-inputs {
            display: flex;
            gap: 5px;
        }
        .tool-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            padding: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--border-color);
        }
        button.active {
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
        }

        /* --- Layers --- */
        #layer-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .layer-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 5px;
            background-color: var(--bg-color);
        }
        .layer-item.active-layer {
            outline: 2px solid var(--accent-color);
        }
        .layer-item input[type="color"] {
            width: 30px;
            height: 30px;
            border: none;
            padding: 0;
            background: none;
        }
        .layer-name { flex-grow: 1; }
        .delete-layer { font-size: 1.2em; cursor: pointer; }


        /* --- Canvases --- */
        .canvas-container {
            position: relative;
            background-color: var(--canvas-bg);
            border-radius: 4px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .canvas-label {
            position: absolute;
            top: 5px;
            left: 10px;
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8em;
            pointer-events: none; /* So it doesn't block mouse events on the canvas */
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: pixelated; /* Sharp pixels */
        }
        #preview-3d-container {
             grid-column: 2 / 3;
             grid-row: 1 / 3; /* Make 3D view span two rows */
        }
    </style>
</head>
<body>

    <aside id="controls-panel">
        <h2>Controls</h2>

        <div class="control-group">
            <h3>Grid Dimensions</h3>
            <div class="dimension-inputs">
                <input type="number" id="grid-width" value="32" min="8" max="128" step="8">
                <input type="number" id="grid-height" value="32" min="8" max="128" step="8">
                <input type="number" id="grid-depth" value="32" min="8" max="128" step="8">
            </div>
        </div>

        <div class="control-group">
            <h3>Tools</h3>
            <div class="tool-buttons">
                <button id="tool-brush" class="active">Brush</button>
                <button id="tool-eraser">Eraser</button>
            </div>
        </div>
        
        <div class="control-group">
            <h3>Reconstruction</h3>
            <label for="reconstruction-threshold">Voxels must appear in ≥ N views:</label>
            <select id="reconstruction-threshold">
                <option value="1">1 (Union)</option>
                <option value="2">2</option>
                <option value="3" selected>3 (Intersection)</option>
            </select>
        </div>

        <div class="control-group">
            <h3>Layers</h3>
            <ul id="layer-list">
                </ul>
            <button id="add-layer" style="width: 100%; margin-top: 10px;">Add New Layer</button>
        </div>
    </aside>

    <main id="main-content">
        <div class="canvas-container">
            <span class="canvas-label">Top (X/Z)</span>
            <canvas id="canvas-top" width="512" height="512"></canvas>
        </div>
        <div class="canvas-container" id="preview-3d-container">
            <span class="canvas-label">3D Preview</span>
            <canvas id="canvas-3d-preview" width="1024" height="1024"></canvas>
        </div>
        <div class="canvas-container">
            <span class="canvas-label">Front (X/Y)</span>
            <canvas id="canvas-front" width="512" height="512"></canvas>
        </div>
         <div class="canvas-container">
            <span class="canvas-label">Right (Z/Y)</span>
            <canvas id="canvas-right" width="512" height="512"></canvas>
        </div>
    </main>

</body>
</html>
