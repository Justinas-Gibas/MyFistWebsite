<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --background-color: #333;
            --text-color: #fff;
            --link-color: #7c0;
            --link-hover-color: #05b;
        }

        .hoverefect01 {
            transition: all 0.3s ease;
            color: var(--link-color);
            transform: scale(1);
        }
        .hoverefect01:hover {
            color: var(--link-hover-color);
            transform: scale(1.1);
        }

    </style>
</head>

<body>
    Body:
    <header>
    Header:
    </header>
    <main>
    Main:
    </main>
    <footer>
    Footer:
    </footer>
</body>

<script>
    document.querySelector('body').style.backgroundColor = 'var(--background-color)';
    document.querySelector('body').style.color = 'var(--text-color)';
    document.querySelector('body').appendChild(document.createTextNode('This is the body content.'));
    
    document.querySelector('header').style.color = 'var(--link-color)';
    document.querySelector('header').appendChild(document.createElement('button'));
    document.querySelector('header button').textContent = 'Click Me';
    document.querySelector('header button').addEventListener('click', function() {
        alert('Button clicked!');
    });
    //hover effect
    document.querySelector('header button').style.backgroundColor = 'var(--link-color)';
    document.querySelector('header button').addEventListener('mouseover', function() {
        this.style.backgroundColor = 'var(--link-hover-color)';
    });
    document.querySelector('header button').addEventListener('mouseout', function() {
        this.style.backgroundColor = 'var(--link-color)';
    });

    document.querySelector('main').style.color = 'var(--text-color)';
    document.querySelector('main').appendChild(document.createTextNode('This is the main content.'));

    document.querySelector('main').appendChild(document.createElement('div'));
    document.querySelector('main div').textContent = 'This is a div inside main.';

    document.querySelector('main div').id = 'my-div';
    document.querySelector('#my-div').style.color = 'var(--link-color)';
    
    
    document.querySelector('main').appendChild(document.createElement('canvas'));
    document.querySelector('main canvas').style.backgroundColor = 'var(--link-color)';
    
    document.querySelector('main').appendChild(document.createElement('span'));
    document.querySelector('span').appendChild(document.createTextNode('This is canvas.'));
    document.querySelector('span').className = 'hoverefect01';

    document.querySelector('footer').style.color = 'var(--link-color)';
    document.querySelector('footer').appendChild(document.createTextNode(Date().toString()));
</script>
