<!DOCTYPE html>
<html>
<head>
  <title>Litegraph Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.jsdelivr.net/gh/jagenjo/litegraph.js/build/litegraph.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jagenjo/litegraph.js/css/litegraph.css" />
  <link rel="icon" type="image/x-icon" href="../../../upper/JG_favicon.ico">


  <style>
    html, body { 
      margin: 0; 
      height: 100%; 
      overflow: hidden; 
      font-family: Arial, sans-serif;
    }
    canvas { 
      width: 100vw; 
      height: 100vh; 
      display: block; 
      background: #1e1e1e; 
      touch-action: none; /* Prevent default touch behaviors */
    }
    
    .right-click-indicator {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1000;
      border: 3px solid rgba(55, 250, 55, 0.7);
      background: radial-gradient(circle, rgba(55, 250, 55, 0.9) 0%, transparent 0%);
      transform: translate(-50%, -50%);
      transition: all 0.1s ease-out;
    }
    
    @keyframes countdown {
      from {
        transform: translate(-50%, -50%) scale(0.1);
        opacity: 0.1;
      }
      to {
        transform: translate(-50%, -50%) scale(1.61);
        opacity: 0.9;
      }
    }

    /* Debug overlay */
    .debug-overlay {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      z-index: 2000;
      max-width: 300px;
    }

    .touch-debug {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 0, 0, 0.5);
      pointer-events: none;
      z-index: 1500;
      transform: translate(-50%, -50%);
    }
  </style>  
</head>
<body>
  <canvas id="graphcanvas" style='border: 1px solid'></canvas>
  <script>
    // Responsive canvas setup
    function setupCanvas() {
      const canvas = document.getElementById('graphcanvas');
      const dpr = window.devicePixelRatio || 1;
      
      // Set canvas size based on viewport
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      
      // Scale the canvas back down using CSS
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      
      // Scale the drawing context so everything draws at the higher resolution
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
    }

    // Initial setup
    setupCanvas();
    
    // Handle window resize
    window.addEventListener('resize', () => {
      setupCanvas();
      if (window.canvas) {
        window.canvas.resize();
      }
    });

    // Create graph and canvas
    const graph = new LGraph();
    const canvas = new LGraphCanvas("#graphcanvas", graph);
    window.canvas = canvas; // Store reference for resize

    // Create a constant node
    const constA = LiteGraph.createNode("basic/const");
    constA.pos = [100, 100];
    constA.setValue(3);
    graph.add(constA);

    const constB = LiteGraph.createNode("basic/const");
    constB.pos = [100, 200];
    constB.setValue(7);
    graph.add(constB);

    // Custom add node
    function AddNode() {
      this.addInput("A", "number");
      this.addInput("B", "number");
      this.addOutput("Sum", "number");
    }
    AddNode.title = "Add";
    AddNode.prototype.onExecute = function() {
      const a = this.getInputData(0) || 0;
      const b = this.getInputData(1) || 0;
      this.setOutputData(0, a + b);
    };
    LiteGraph.registerNodeType("math/add", AddNode);

    const adder = LiteGraph.createNode("math/add");
    adder.pos = [300, 150];
    graph.add(adder);

    // Watch the result
    const watcher = LiteGraph.createNode("basic/watch");
    watcher.pos = [500, 150];
    graph.add(watcher);

    // Connect the nodes
    constA.connect(0, adder, 0);
    constB.connect(0, adder, 1);
    adder.connect(0, watcher, 0);

    // Start the graph
    graph.start();
    window.canvas.resize();
  </script>


  <!-- Enhanced touch support with debugging -->
  <script>
    // Debug mode toggle
    const DEBUG_MODE = true;

    // Touch state management
    let touchState = {
      longPressTimeout: null,
      indicator: null,
      startPosition: null,
      startTime: null,
      isDragging: false,
      longPressHandled: false,
      lastTapTime: 0,
      // New states for multi-select
      longPressReady: false,
      isMultiSelecting: false,
      // Hover simulation
      virtualCursor: { x: 0, y: 0 },
      isHovering: false,
      hoverTimeout: null,
      // Node-specific states
      startedOnNode: false,
      startedOnBackground: false,
      lastTapNode: null,
      isNodeMultiDrag: false,
      isBackgroundMultiSelect: false,
      // Multi-touch states for zooming and panning
      multiTouch: {
        isActive: false,
        touches: [],
        initialDistance: 0,
        initialScale: 1,
        initialCenter: { x: 0, y: 0 },
        currentDistance: 0,
        isPanning: false,
        isZooming: false,
        lastCenter: { x: 0, y: 0 },
        panStartOffset: { x: 0, y: 0 }
      }
    };

    const LONG_PRESS_DURATION = 600; // ms
    const MOVE_THRESHOLD = 10; // pixels
    const DOUBLE_TAP_DELAY = 300; // ms
    const HOVER_UPDATE_INTERVAL = 16; // ms (~60fps)
    const MIN_ZOOM_DISTANCE = 30; // Minimum distance between touches to start zooming
    const ZOOM_SENSITIVITY = 0.005; // Zoom sensitivity factor
    const MIN_SCALE = 0.1; // Minimum zoom level
    const MAX_SCALE = 5.0; // Maximum zoom level

    // Multi-touch helper functions
    function getTouchDistance(touch1, touch2) {
      const dx = touch1.clientX - touch2.clientX;
      const dy = touch1.clientY - touch2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getTouchCenter(touch1, touch2) {
      return {
        x: (touch1.clientX + touch2.clientX) / 2,
        y: (touch1.clientY + touch2.clientY) / 2
      };
    }

    function initMultiTouch(touches) {
      if (touches.length !== 2) return false;
      
      const touch1 = touches[0];
      const touch2 = touches[1];
      
      touchState.multiTouch.isActive = true;
      touchState.multiTouch.touches = [touch1, touch2];
      touchState.multiTouch.initialDistance = getTouchDistance(touch1, touch2);
      touchState.multiTouch.currentDistance = touchState.multiTouch.initialDistance;
      touchState.multiTouch.initialCenter = getTouchCenter(touch1, touch2);
      touchState.multiTouch.lastCenter = { ...touchState.multiTouch.initialCenter };
      touchState.multiTouch.initialScale = canvas.ds.scale || 1;
      touchState.multiTouch.isPanning = false;
      touchState.multiTouch.isZooming = false;
      
      // Store initial canvas offset for panning
      touchState.multiTouch.panStartOffset = {
        x: canvas.ds.offset[0],
        y: canvas.ds.offset[1]
      };
      
      updateDebug(`Multi-touch initialized: distance=${touchState.multiTouch.initialDistance.toFixed(0)}, center=(${touchState.multiTouch.initialCenter.x.toFixed(0)}, ${touchState.multiTouch.initialCenter.y.toFixed(0)})`);
      return true;
    }

    function updateMultiTouch(touches) {
      if (!touchState.multiTouch.isActive || touches.length !== 2) return;
      
      const touch1 = touches[0];
      const touch2 = touches[1];
      const currentDistance = getTouchDistance(touch1, touch2);
      const currentCenter = getTouchCenter(touch1, touch2);
      
      // Calculate distance and center changes
      const distanceChange = currentDistance - touchState.multiTouch.initialDistance;
      const centerDeltaX = currentCenter.x - touchState.multiTouch.lastCenter.x;
      const centerDeltaY = currentCenter.y - touchState.multiTouch.lastCenter.y;
      
      // Determine if we're zooming or panning
      const isZoomGesture = Math.abs(distanceChange) > MIN_ZOOM_DISTANCE;
      const isPanGesture = Math.abs(centerDeltaX) > 5 || Math.abs(centerDeltaY) > 5;
      
      if (isZoomGesture && !touchState.multiTouch.isPanning) {
        touchState.multiTouch.isZooming = true;
        
        // Calculate zoom factor
        const scaleFactor = currentDistance / touchState.multiTouch.initialDistance;
        let newScale = touchState.multiTouch.initialScale * scaleFactor;
        
        // Clamp scale
        newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
        
        // Apply zoom around the center point
        const rect = canvas.canvas.getBoundingClientRect();
        const canvasCenter = {
          x: currentCenter.x - rect.left,
          y: currentCenter.y - rect.top
        };
        
        // Convert to graph coordinates for zoom center
        const graphCenter = canvas.convertCanvasToOffset([canvasCenter.x, canvasCenter.y]);
        
        // Apply the zoom
        canvas.ds.scale = newScale;
        canvas.setZoom(newScale, [graphCenter[0], graphCenter[1]]);
        
        updateDebug(`Zooming: scale=${newScale.toFixed(2)}, factor=${scaleFactor.toFixed(2)}`);
        
        if (DEBUG_MODE) {
          showTouchPoint(currentCenter.x, currentCenter.y, "rgba(0, 255, 0, 0.8)");
        }
      }
      
      if (isPanGesture && !touchState.multiTouch.isZooming) {
        touchState.multiTouch.isPanning = true;
        
        // Calculate pan delta in graph coordinates
        const panDeltaX = centerDeltaX / canvas.ds.scale;
        const panDeltaY = centerDeltaY / canvas.ds.scale;
        
        // Apply panning
        canvas.ds.offset[0] += panDeltaX;
        canvas.ds.offset[1] += panDeltaY;
        canvas.setDirty(true, true);
        
        updateDebug(`Panning: delta=(${panDeltaX.toFixed(1)}, ${panDeltaY.toFixed(1)}), offset=(${canvas.ds.offset[0].toFixed(1)}, ${canvas.ds.offset[1].toFixed(1)})`);
        
        if (DEBUG_MODE) {
          showTouchPoint(currentCenter.x, currentCenter.y, "rgba(255, 165, 0, 0.8)");
        }
      }
      
      // Update tracking variables
      touchState.multiTouch.currentDistance = currentDistance;
      touchState.multiTouch.lastCenter = currentCenter;
    }

    function cleanupMultiTouch() {
      if (touchState.multiTouch.isActive) {
        updateDebug(`Multi-touch ended: was ${touchState.multiTouch.isZooming ? 'zooming' : ''}${touchState.multiTouch.isPanning ? 'panning' : ''}`);
      }
      
      touchState.multiTouch.isActive = false;
      touchState.multiTouch.touches = [];
      touchState.multiTouch.isPanning = false;
      touchState.multiTouch.isZooming = false;
    }

    // Helper function to check if touch is on a node
    function getTouchTarget(x, y) {
      const rect = canvas.canvas.getBoundingClientRect();
      const canvasX = x - rect.left;
      const canvasY = y - rect.top;
      
      // Convert to graph coordinates
      const graphPos = canvas.convertCanvasToOffset([canvasX, canvasY]);
      
      // Check if we're over a node
      const node = graph.getNodeOnPos(graphPos[0], graphPos[1]);
      return {
        node: node,
        isOnNode: !!node,
        graphX: graphPos[0],
        graphY: graphPos[1]
      };
    }

    // Debug functions
    function createDebugOverlay() {
      if (!DEBUG_MODE) return;
      const overlay = document.createElement("div");
      overlay.id = "debug-overlay";
      overlay.className = "debug-overlay";
      overlay.innerHTML = "Touch Debug: Ready";
      document.body.appendChild(overlay);
    }

    function updateDebug(message) {
      if (!DEBUG_MODE) return;
      const overlay = document.getElementById("debug-overlay");
      if (overlay) {
        const timestamp = new Date().toLocaleTimeString();
        overlay.innerHTML = `${timestamp}: ${message}<br>` + overlay.innerHTML.split('<br>').slice(0, 10).join('<br>');
      }
    }

    function showTouchPoint(x, y, color = "rgba(255, 0, 0, 0.5)") {
      if (!DEBUG_MODE) return;
      const point = document.createElement("div");
      point.className = "touch-debug";
      point.style.left = `${x}px`;
      point.style.top = `${y}px`;
      point.style.background = color;
      document.body.appendChild(point);
      
      setTimeout(() => {
        if (point.parentNode) {
          document.body.removeChild(point);
        }
      }, 1000);
    }

    // Initialize debug overlay
    createDebugOverlay();

    // Hover simulation functions
    function updateVirtualCursor(x, y) {
      touchState.virtualCursor.x = x;
      touchState.virtualCursor.y = y;
      touchState.isHovering = true;
      
      // Clear existing hover timeout
      if (touchState.hoverTimeout) {
        clearTimeout(touchState.hoverTimeout);
      }
      
      // Send immediate hover event
      sendHoverEvent(x, y);
      
      // Set timeout to stop hovering after no touch activity
      touchState.hoverTimeout = setTimeout(() => {
        touchState.isHovering = false;
        updateDebug("Hover simulation stopped");
      }, 1000); // Stop hovering after 1 second of inactivity
    }
    
    function sendHoverEvent(x, y) {
      if (!touchState.isHovering) return;
      
      const fakeTouch = { clientX: x, clientY: y };
      const hoverEvent = createPointerEvent('mousemove', fakeTouch, { buttons: 0 });
      canvas.canvas.dispatchEvent(hoverEvent);
      
      if (DEBUG_MODE) {
        // Show a small indicator for virtual cursor (optional)
        const indicator = document.createElement("div");
        indicator.style.position = "absolute";
        indicator.style.left = `${x-2}px`;
        indicator.style.top = `${y-2}px`;
        indicator.style.width = "4px";
        indicator.style.height = "4px";
        indicator.style.background = "rgba(255, 255, 0, 0.5)";
        indicator.style.borderRadius = "50%";
        indicator.style.pointerEvents = "none";
        indicator.style.zIndex = "1600";
        document.body.appendChild(indicator);
        
        setTimeout(() => {
          if (indicator.parentNode) {
            document.body.removeChild(indicator);
          }
        }, 100);
      }
    }

    // Helper function to create pointer event from touch
    function createPointerEvent(type, touch, options = {}) {
      const rect = canvas.canvas.getBoundingClientRect();
      const canvasX = touch.clientX - rect.left;
      const canvasY = touch.clientY - rect.top;
      
      // Create a real DOM event that LiteGraph can understand
      const event = new MouseEvent(type.replace('pointer', 'mouse'), {
        clientX: touch.clientX,
        clientY: touch.clientY,
        button: options.button || 0,
        buttons: options.buttons || 0,
        bubbles: true,
        cancelable: true,
        view: window,
        ctrlKey: options.ctrlKey || false,
        shiftKey: options.shiftKey || false,
        altKey: options.altKey || false,
        metaKey: options.metaKey || false
      });
      
      // Add canvas-relative coordinates that LiteGraph uses
      event.canvasX = canvasX;
      event.canvasY = canvasY;
      event.layerX = canvasX;
      event.layerY = canvasY;
      event.offsetX = canvasX;
      event.offsetY = canvasY;
      
      return event;
    }

    function createRightClickIndicator(x, y) {
      const indicator = document.createElement("div");
      indicator.className = "right-click-indicator";
      indicator.style.left = `${x}px`;
      indicator.style.top = `${y}px`;
      indicator.style.width = "60px";
      indicator.style.height = "60px";
      indicator.style.animation = `countdown ${LONG_PRESS_DURATION}ms linear forwards`;
      
      document.body.appendChild(indicator);
      return indicator;
    }

    function cleanupTouchState() {
      if (touchState.longPressTimeout) {
        clearTimeout(touchState.longPressTimeout);
        touchState.longPressTimeout = null;
      }
      if (touchState.indicator) {
        if (touchState.indicator.parentNode) {
          document.body.removeChild(touchState.indicator);
        }
        touchState.indicator = null;
      }
      touchState.isDragging = false;
      touchState.startPosition = null;
      touchState.startTime = null;
      touchState.longPressHandled = false;
      touchState.longPressReady = false;
      touchState.isMultiSelecting = false;
      touchState.startedOnNode = false;
      touchState.startedOnBackground = false;
      touchState.isNodeMultiDrag = false;
      touchState.isBackgroundMultiSelect = false;
      
      // Also cleanup multi-touch state
      cleanupMultiTouch();
    }

    // Handle touch start
    canvas.canvas.addEventListener("touchstart", (e) => {
      // Handle multi-touch gestures (2 fingers)
      if (e.touches.length === 2) {
        e.preventDefault();
        cleanupTouchState(); // Clean up any single-touch state
        initMultiTouch(e.touches);
        return;
      }
      
      // Handle single touch
      if (e.touches.length !== 1) {
        cleanupTouchState();
        return;
      }
      e.preventDefault();

      const touch = e.touches[0];
      const currentTime = Date.now();
      const touchTarget = getTouchTarget(touch.clientX, touch.clientY);
      
      cleanupTouchState();

      touchState.startPosition = { x: touch.clientX, y: touch.clientY };
      touchState.startTime = currentTime;
      touchState.startedOnNode = touchTarget.isOnNode;
      touchState.startedOnBackground = !touchTarget.isOnNode;
      
      // Always update virtual cursor position on touch start
      updateVirtualCursor(touch.clientX, touch.clientY);
      
      updateDebug(`Touch Start at (${touch.clientX.toFixed(0)}, ${touch.clientY.toFixed(0)}) - ${touchTarget.isOnNode ? 'ON NODE' : 'ON BACKGROUND'}`);
      showTouchPoint(touch.clientX, touch.clientY, touchTarget.isOnNode ? "rgba(255, 165, 0, 0.7)" : "rgba(0, 255, 0, 0.7)");

      // Check for double tap on node for shift+click multi-select
      const timeSinceLastTap = currentTime - touchState.lastTapTime;
      if (timeSinceLastTap < DOUBLE_TAP_DELAY) {
        if (touchTarget.isOnNode && touchState.lastTapNode === touchTarget.node) {
          updateDebug("Double tap on NODE detected -> shift+click multi-select");
          showTouchPoint(touch.clientX, touch.clientY, "rgba(255, 255, 0, 0.9)");
          
          // Trigger shift+click for node multi-select
          const shiftClickEvent = createPointerEvent('mousedown', touch, { buttons: 1, shiftKey: true });
          canvas.canvas.dispatchEvent(shiftClickEvent);
          setTimeout(() => {
            const shiftClickUpEvent = createPointerEvent('mouseup', touch, { shiftKey: true });
            canvas.canvas.dispatchEvent(shiftClickUpEvent);
          }, 10);
          
          touchState.lastTapTime = 0;
          touchState.lastTapNode = null;
          return;
        } else if (!touchTarget.isOnNode) {
          // Double tap on background - open search as before
          updateDebug("Double tap on BACKGROUND detected -> opening search");
          showTouchPoint(touch.clientX, touch.clientY, "rgba(255, 0, 255, 0.9)");
          
          const dblClickEvent = createPointerEvent('dblclick', touch);
          canvas.canvas.dispatchEvent(dblClickEvent);
          touchState.lastTapTime = 0;
          return;
        }
      }

      // Start long press timer
      touchState.indicator = createRightClickIndicator(touch.clientX, touch.clientY);
      
      touchState.longPressTimeout = setTimeout(() => {
        if (!touchState.isDragging) {
          updateDebug(`Long Press Ready -> ${touchState.startedOnNode ? 'Node multi-drag' : 'Background multi-select'} or release for menu`);
          touchState.longPressReady = true;
        }
      }, LONG_PRESS_DURATION);

    }, { passive: false });

    // Handle touch move
    canvas.canvas.addEventListener("touchmove", (e) => {
      // Handle multi-touch move
      if (e.touches.length === 2 && touchState.multiTouch.isActive) {
        e.preventDefault();
        updateMultiTouch(e.touches);
        return;
      }
      
      // Handle single touch move
      if (e.touches.length !== 1 || !touchState.startPosition || touchState.longPressHandled) return;
      e.preventDefault();

      const touch = e.touches[0];
      const deltaX = Math.abs(touch.clientX - touchState.startPosition.x);
      const deltaY = Math.abs(touch.clientY - touchState.startPosition.y);

      // Always update virtual cursor position for hover simulation
      updateVirtualCursor(touch.clientX, touch.clientY);

      const hasMoved = deltaX > MOVE_THRESHOLD || deltaY > MOVE_THRESHOLD;

      // Handle long press + drag scenarios
      if (touchState.longPressReady && hasMoved) {
        if (touchState.startedOnBackground) {
          // Long press on background + drag = ctrl+shift multi-select
          updateDebug(`Background multi-select drag started (ctrl+shift)`);
          touchState.isBackgroundMultiSelect = true;
          touchState.isDragging = true;
          touchState.longPressReady = false;

          if (touchState.indicator && touchState.indicator.parentNode) {
            document.body.removeChild(touchState.indicator);
            touchState.indicator = null;
          }

          const startTouch = { clientX: touchState.startPosition.x, clientY: touchState.startPosition.y };
          const mouseDownEvent = createPointerEvent('mousedown', startTouch, { buttons: 1, ctrlKey: true, shiftKey: true });
          canvas.canvas.dispatchEvent(mouseDownEvent);
          updateDebug(`Dispatched mousedown for background multi-select (ctrl+shift)`);
        } else if (touchState.startedOnNode) {
          // Long press on node + drag = shift multi-drag
          updateDebug(`Node multi-drag started (shift)`);
          touchState.isNodeMultiDrag = true;
          touchState.isDragging = true;
          touchState.longPressReady = false;

          if (touchState.indicator && touchState.indicator.parentNode) {
            document.body.removeChild(touchState.indicator);
            touchState.indicator = null;
          }

          const startTouch = { clientX: touchState.startPosition.x, clientY: touchState.startPosition.y };
          const mouseDownEvent = createPointerEvent('mousedown', startTouch, { buttons: 1, shiftKey: true });
          canvas.canvas.dispatchEvent(mouseDownEvent);
          updateDebug(`Dispatched mousedown for node multi-drag (shift)`);
        }
      }
      // Check for normal drag
      else if (!touchState.isDragging && hasMoved) {
        updateDebug(`Normal drag started (Δx=${deltaX}, Δy=${deltaY})`);
        touchState.isDragging = true;
        
        // Cancel long press
        if (touchState.longPressTimeout) {
          clearTimeout(touchState.longPressTimeout);
          touchState.longPressTimeout = null;
        }
        if (touchState.indicator && touchState.indicator.parentNode) {
          document.body.removeChild(touchState.indicator);
          touchState.indicator = null;
        }

        // Start normal drag
        const startTouch = { clientX: touchState.startPosition.x, clientY: touchState.startPosition.y };
        const mouseDownEvent = createPointerEvent('mousedown', startTouch, { buttons: 1 });
        canvas.canvas.dispatchEvent(mouseDownEvent);
        updateDebug(`Dispatched mousedown for normal drag`);
      }

      if (touchState.isDragging) {
        let mouseMoveOptions = { buttons: 1 };
        
        if (touchState.isBackgroundMultiSelect) {
          mouseMoveOptions.ctrlKey = true;
          mouseMoveOptions.shiftKey = true;
        } else if (touchState.isNodeMultiDrag) {
          mouseMoveOptions.shiftKey = true;
        }
        
        const mouseMoveEvent = createPointerEvent('mousemove', touch, mouseMoveOptions);
        canvas.canvas.dispatchEvent(mouseMoveEvent);
        
        if (DEBUG_MODE) {
          let color = "rgba(0, 0, 255, 0.3)";
          if (touchState.isBackgroundMultiSelect) color = "rgba(255, 0, 255, 0.3)";
          else if (touchState.isNodeMultiDrag) color = "rgba(255, 255, 0, 0.3)";
          showTouchPoint(touch.clientX, touch.clientY, color);
        }
      }
    }, { passive: false });

    // Handle touch end 
    canvas.canvas.addEventListener("touchend", (e) => {
      // Handle multi-touch end
      if (touchState.multiTouch.isActive) {
        e.preventDefault();
        
        // If we still have 2+ touches, continue multi-touch
        if (e.touches.length >= 2) {
          updateMultiTouch(e.touches);
          return;
        }
        
        // Otherwise, end multi-touch mode
        cleanupMultiTouch();
        
        // If there's still one touch remaining, we could transition to single-touch mode
        // but for simplicity, we'll just clean up completely
        if (e.touches.length === 1) {
          updateDebug("Multi-touch ended, single touch remaining");
          // Could initialize single touch here if desired
        }
        return;
      }
      
      // Handle single touch end
      if (!touchState.startPosition || touchState.longPressHandled) {
        cleanupTouchState();
        return;
      }
      e.preventDefault();

      const touch = e.changedTouches[0];
      const currentTime = Date.now();
      const touchTarget = getTouchTarget(touch.clientX, touch.clientY);
      
      // Always update virtual cursor to final position
      updateVirtualCursor(touch.clientX, touch.clientY);
      
      updateDebug(`Touch End at (${touch.clientX.toFixed(0)}, ${touch.clientY.toFixed(0)})`);
      showTouchPoint(touch.clientX, touch.clientY, "rgba(255, 0, 0, 0.7)");

      if (touchState.isBackgroundMultiSelect) {
        updateDebug("Background multi-select drag ended -> mouseup (ctrl+shift)");
        const mouseUpEvent = createPointerEvent('mouseup', touch, { ctrlKey: true, shiftKey: true });
        canvas.canvas.dispatchEvent(mouseUpEvent);
      } else if (touchState.isNodeMultiDrag) {
        updateDebug("Node multi-drag ended -> mouseup (shift)");
        const mouseUpEvent = createPointerEvent('mouseup', touch, { shiftKey: true });
        canvas.canvas.dispatchEvent(mouseUpEvent);
      } else if (touchState.isDragging) {
        updateDebug("Normal drag ended -> mouseup");
        const mouseUpEvent = createPointerEvent('mouseup', touch);
        canvas.canvas.dispatchEvent(mouseUpEvent);
      } else if (touchState.longPressReady) {
        // This was a long press without a drag -> context menu
        updateDebug("Long Press tap -> context menu");
        const rightMouseDown = createPointerEvent('mousedown', touch, { button: 2, buttons: 2 });
        const rightMouseUp = createPointerEvent('mouseup', touch, { button: 2 });
        const contextEvent = createPointerEvent('contextmenu', touch, { button: 2 });
        
        canvas.canvas.dispatchEvent(rightMouseDown);
        setTimeout(() => {
          canvas.canvas.dispatchEvent(rightMouseUp);
          setTimeout(() => canvas.canvas.dispatchEvent(contextEvent), 10);
        }, 10);
        
        touchState.longPressHandled = true;
      } else {
        // Single tap - dispatch proper sequence and keep cursor active
        updateDebug("Single tap -> mousedown + mouseup + click + cursor positioned");
        showTouchPoint(touch.clientX, touch.clientY, "rgba(0, 255, 255, 0.7)");
        
        const mouseDownEvent = createPointerEvent('mousedown', touch);
        const mouseUpEvent = createPointerEvent('mouseup', touch);
        const clickEvent = createPointerEvent('click', touch);
        
        canvas.canvas.dispatchEvent(mouseDownEvent);
        
        setTimeout(() => {
          canvas.canvas.dispatchEvent(mouseUpEvent);
          setTimeout(() => {
            canvas.canvas.dispatchEvent(clickEvent);
            // After click, send a final hover event to maintain cursor position
            setTimeout(() => {
              updateVirtualCursor(touch.clientX, touch.clientY);
            }, 20);
          }, 10);
        }, 10);
        
        // Store tap info for potential double-tap detection
        touchState.lastTapTime = currentTime;
        touchState.lastTapNode = touchTarget.node;
      }
      
      cleanupTouchState();
    }, { passive: false });

    // Handle touch cancel
    canvas.canvas.addEventListener("touchcancel", (e) => {
      updateDebug("Touch Cancelled");
      if (e.changedTouches.length > 0) {
        const touch = e.changedTouches[0];
        showTouchPoint(touch.clientX, touch.clientY, "rgba(0, 0, 0, 1.0)");
      }
      
      // Handle multi-touch cancel
      if (touchState.multiTouch.isActive) {
        cleanupMultiTouch();
      }
      
      if (touchState.isDragging) {
        const touch = e.changedTouches[0];
        let mouseUpOptions = {};

        if (touchState.isBackgroundMultiSelect) {
          mouseUpOptions.ctrlKey = true;
          mouseUpOptions.shiftKey = true;
        } else if (touchState.isNodeMultiDrag) {
          mouseUpOptions.shiftKey = true;
        }
        
        const mouseUpEvent = createPointerEvent('mouseup', touch, mouseUpOptions);
        canvas.canvas.dispatchEvent(mouseUpEvent);
      }
      
      cleanupTouchState();
      e.preventDefault();
    }, { passive: false });

    // Optional: Add pointer event support as fallback
    if (window.PointerEvent) {
      updateDebug("Pointer events supported");
    }

    // Additional debugging
    if (DEBUG_MODE) {
      ['mousedown', 'mouseup', 'mousemove', 'click', 'dblclick', 'contextmenu'].forEach(eventType => {
        canvas.canvas.addEventListener(eventType, (e) => {
          // Only log non-hover mousemove events to reduce spam
          if (e.type === 'mousemove' && e.buttons === 0) {
            // This is a hover event, log it less frequently
            if (Math.random() < 0.05) { // Log only 5% of hover events to reduce spam
              updateDebug(`Hover Event: ${e.type} at (${e.clientX}, ${e.clientY})`);
            }
          } else {
            updateDebug(`Mouse Event: ${e.type} at (${e.clientX}, ${e.clientY}) canvas:(${e.canvasX}, ${e.canvasY}) button:${e.button} buttons:${e.buttons}`);
          }
        });
      });
      
      // Let's also monitor what LiteGraph's canvas object has for context menu handling
      if (canvas.onContextMenu) {
        updateDebug("LiteGraph has onContextMenu method");
      } else {
        updateDebug("LiteGraph missing onContextMenu method");
      }
      
      // Check if there are other context-related methods
      const contextMethods = Object.getOwnPropertyNames(canvas.__proto__).filter(name => 
        name.toLowerCase().includes('context') || name.toLowerCase().includes('menu')
      );
      if (contextMethods.length > 0) {
        updateDebug(`Found context methods: ${contextMethods.join(', ')}`);
      }
      
      updateDebug("Enhanced touch support loaded - Single touch, Multi-touch zoom/pan, Hover simulation enabled");
    }
  </script>
</body>
</html>
