<!DOCTYPE html>
<html>
<head>
  <title>Litegraph Demo</title>
  <script src="https://cdn.jsdelivr.net/gh/jagenjo/litegraph.js/build/litegraph.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jagenjo/litegraph.js/css/litegraph.css" />
  <link rel="icon" type="image/x-icon" href="../../../upper/JG_favicon.ico">


  <style>
    html, body { 
      margin: 0; 
      height: 100%; 
      overflow: hidden; 
      font-family: Arial, sans-serif;
    }
    canvas { 
      width: 100vw; 
      height: 100vh; 
      display: block; 
      background: #1e1e1e; 
      touch-action: none; /* Prevent default touch behaviors */
    }
    
    .right-click-indicator {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1000;
      border: 3px solid rgba(55, 250, 55, 0.7);
      background: radial-gradient(circle, rgba(55, 250, 55, 0.9) 0%, transparent 0%);
      transform: translate(-50%, -50%);
      transition: all 0.1s ease-out;
    }
    
    @keyframes countdown {
      from {
        transform: translate(-50%, -50%) scale(0.1);
        opacity: 0.1;
      }
      to {
        transform: translate(-50%, -50%) scale(1.61);
        opacity: 0.9;
      }
    }

    /* Debug overlay */
    .debug-overlay {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      z-index: 2000;
      max-width: 300px;
    }

    .touch-debug {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 0, 0, 0.5);
      pointer-events: none;
      z-index: 1500;
      transform: translate(-50%, -50%);
    }
  </style>  
</head>
<body>
  <canvas id="graphcanvas" style='border: 1px solid'></canvas>
  <script>
    // Responsive canvas setup
    function setupCanvas() {
      const canvas = document.getElementById('graphcanvas');
      const dpr = window.devicePixelRatio || 1;
      
      // Set canvas size based on viewport
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      
      // Scale the canvas back down using CSS
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      
      // Scale the drawing context so everything draws at the higher resolution
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
    }

    // Initial setup
    setupCanvas();
    
    // Handle window resize
    window.addEventListener('resize', () => {
      setupCanvas();
      if (window.canvas) {
        window.canvas.resize();
      }
    });

    // Create graph and canvas
    const graph = new LGraph();
    const canvas = new LGraphCanvas("#graphcanvas", graph);
    window.canvas = canvas; // Store reference for resize

    // Create a constant node
    const constA = LiteGraph.createNode("basic/const");
    constA.pos = [100, 100];
    constA.setValue(3);
    graph.add(constA);

    const constB = LiteGraph.createNode("basic/const");
    constB.pos = [100, 200];
    constB.setValue(7);
    graph.add(constB);

    // Custom add node
    function AddNode() {
      this.addInput("A", "number");
      this.addInput("B", "number");
      this.addOutput("Sum", "number");
    }
    AddNode.title = "Add";
    AddNode.prototype.onExecute = function() {
      const a = this.getInputData(0) || 0;
      const b = this.getInputData(1) || 0;
      this.setOutputData(0, a + b);
    };
    LiteGraph.registerNodeType("math/add", AddNode);

    const adder = LiteGraph.createNode("math/add");
    adder.pos = [300, 150];
    graph.add(adder);

    // Watch the result
    const watcher = LiteGraph.createNode("basic/watch");
    watcher.pos = [500, 150];
    graph.add(watcher);

    // Connect the nodes
    constA.connect(0, adder, 0);
    constB.connect(0, adder, 1);
    adder.connect(0, watcher, 0);

    // Start the graph
    graph.start();
    window.canvas.resize();
  </script>


  <!-- Enhanced touch support with debugging -->
  <script>
    // Debug mode toggle
    const DEBUG_MODE = true; // Set to false to disable debugging

    // Touch state management
    let touchState = {
      isMoving: false,
      rightClickTimeout: null,
      indicator: null,
      startTime: null,
      startPosition: null,
      isDragging: false,
      lastTouchType: null,
      currentTouch: null
    };

    const LONG_PRESS_DURATION = 800;
    const MOVE_THRESHOLD = 8;

    // Debug functions
    function createDebugOverlay() {
      if (!DEBUG_MODE) return;
      const overlay = document.createElement("div");
      overlay.id = "debug-overlay";
      overlay.className = "debug-overlay";
      overlay.innerHTML = "Touch Debug: Ready<br/>Tap to test, Hold for right-click";
      document.body.appendChild(overlay);
      
      // Add toggle button
      const toggleBtn = document.createElement("button");
      toggleBtn.innerText = "Hide Debug";
      toggleBtn.style.marginTop = "5px";
      toggleBtn.onclick = () => {
        const isVisible = overlay.style.display !== "none";
        overlay.style.display = isVisible ? "none" : "block";
        toggleBtn.innerText = isVisible ? "Show Debug" : "Hide Debug";
      };
      overlay.appendChild(toggleBtn);
    }

    function updateDebug(message) {
      if (!DEBUG_MODE) return;
      const overlay = document.getElementById("debug-overlay");
      if (overlay) {
        const timestamp = new Date().toLocaleTimeString();
        const lines = overlay.innerHTML.split('<br/>');
        if (lines.length > 10) lines.shift(); // Keep more lines (10 instead of 5)
        lines.push(`${timestamp}: ${message}`);
        overlay.innerHTML = lines.join('<br/>');
      }
      console.log(`Touch Debug: ${message}`);
    }

    function showTouchPoint(x, y, color = "rgba(255, 0, 0, 0.5)", label = "") {
      if (!DEBUG_MODE) return;
      const point = document.createElement("div");
      point.className = "touch-debug";
      point.style.left = `${x}px`;
      point.style.top = `${y}px`;
      point.style.background = color;
      if (label) {
        point.style.width = "30px"; // Make points bigger
        point.style.height = "30px";
        point.innerHTML = `<div style="color: white; font-size: 10px; position: absolute; white-space: nowrap; margin-top: 35px;">${label}</div>`;
      }
      document.body.appendChild(point);
      
      setTimeout(() => {
        if (point.parentNode) {
          document.body.removeChild(point);
        }
      }, 2000); // Show longer (2s instead of 1.5s)
    }

    // Initialize debug overlay
    createDebugOverlay();

    // Helper function to get proper canvas coordinates
    function getCanvasCoordinates(clientX, clientY) {
      const rect = canvas.canvas.getBoundingClientRect();
      return {
        x: clientX - rect.left,
        y: clientY - rect.top,
        clientX: clientX,
        clientY: clientY
      };
    }

    // Helper function to create mouse event with proper coordinates
    function createMouseEvent(type, clientX, clientY, button = 0) {
      const buttons = (type === "mousedown" || (type === "mousemove" && touchState.isDragging)) ? 1 : 0;
      return new MouseEvent(type, {
        clientX: clientX,
        clientY: clientY,
        button: button,
        buttons: buttons,
        bubbles: true,
        cancelable: true,
        view: window,
        detail: type === "click" ? 1 : 0
      });
    }

    function createRightClickIndicator(x, y) {
      const indicator = document.createElement("div");
      indicator.className = "right-click-indicator";
      indicator.style.left = `${x}px`;
      indicator.style.top = `${y}px`;
      indicator.style.width = "60px";
      indicator.style.height = "60px";
      indicator.style.animation = `countdown ${LONG_PRESS_DURATION}ms linear forwards`;
      
      document.body.appendChild(indicator);
      return indicator;
    }

    function cleanupRightClickState() {
      if (touchState.rightClickTimeout) {
        clearTimeout(touchState.rightClickTimeout);
        touchState.rightClickTimeout = null;
      }
      if (touchState.indicator) {
        document.body.removeChild(touchState.indicator);
        touchState.indicator = null;
      }
      touchState.isMoving = false;
      touchState.isDragging = false;
      touchState.startTime = null;
      touchState.startPosition = null;
      touchState.currentTouch = null;
    }

    // Handle touch start
    canvas.canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        const touch = e.touches[0];
        touchState.isMoving = false;
        touchState.isDragging = false;
        touchState.startTime = Date.now();
        touchState.startPosition = { x: touch.clientX, y: touch.clientY };
        touchState.currentTouch = { x: touch.clientX, y: touch.clientY };
        touchState.lastTouchType = "start";

        updateDebug(`TOUCH START: (${touch.clientX}, ${touch.clientY})`);
        showTouchPoint(touch.clientX, touch.clientY, "rgba(0, 255, 0, 0.8)", "START");

        // Create and dispatch mousedown event
        const mouseDownEvent = createMouseEvent("mousedown", touch.clientX, touch.clientY, 0);
        canvas.canvas.dispatchEvent(mouseDownEvent);
        updateDebug(`Sent: mousedown at (${touch.clientX}, ${touch.clientY})`);

        // Start right-click countdown
        touchState.indicator = createRightClickIndicator(touch.clientX, touch.clientY);
        
        touchState.rightClickTimeout = setTimeout(() => {
          if (!touchState.isMoving && touchState.indicator && touchState.currentTouch) {
            updateDebug("LONG PRESS DETECTED - Triggering context menu");
            
            // First send mouseup to end any drag state
            const mouseUpEvent = createMouseEvent("mouseup", touchState.currentTouch.x, touchState.currentTouch.y, 0);
            canvas.canvas.dispatchEvent(mouseUpEvent);
            
            // Then send contextmenu event (right-click)
            const contextEvent = new MouseEvent("contextmenu", {
              clientX: touchState.currentTouch.x,
              clientY: touchState.currentTouch.y,
              button: 2, // Right button
              bubbles: true,
              cancelable: true,
              view: window
            });
            canvas.canvas.dispatchEvent(contextEvent);
            showTouchPoint(touchState.currentTouch.x, touchState.currentTouch.y, "rgba(255, 255, 0, 0.9)", "0000000 RCLICK");
            
            cleanupRightClickState();
          }
        }, LONG_PRESS_DURATION);
      }
      e.preventDefault();
    }, { passive: false });

    // Handle touch move
    canvas.canvas.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1) {
        const touch = e.touches[0];
        touchState.currentTouch = { x: touch.clientX, y: touch.clientY };
        touchState.lastTouchType = "move";
        
        // Check if movement exceeds threshold
        if (touchState.startPosition) {
          const deltaX = Math.abs(touch.clientX - touchState.startPosition.x);
          const deltaY = Math.abs(touch.clientY - touchState.startPosition.y);
          
          if (deltaX > MOVE_THRESHOLD || deltaY > MOVE_THRESHOLD) {
            if (!touchState.isMoving) {
              touchState.isMoving = true;
              touchState.isDragging = true;
              updateDebug(`DRAG STARTED: Δx=${deltaX}, Δy=${deltaY}`);
            }
            
            // Cancel right-click when moving
            if (touchState.rightClickTimeout) {
              clearTimeout(touchState.rightClickTimeout);
              touchState.rightClickTimeout = null;
              updateDebug("Right-click cancelled due to movement");
            }
            if (touchState.indicator) {
              document.body.removeChild(touchState.indicator);
              touchState.indicator = null;
            }
          }
        }

        // Always send mousemove for hover effects and dragging
        const mouseMoveEvent = createMouseEvent("mousemove", touch.clientX, touch.clientY, 0);
        canvas.canvas.dispatchEvent(mouseMoveEvent);

        if (DEBUG_MODE && touchState.isDragging) {
          showTouchPoint(touch.clientX, touch.clientY, "rgba(0, 0, 255, 0.5)", "DRAG");
        }
      }
      e.preventDefault();
    }, { passive: false });

    // Handle touch end
    canvas.canvas.addEventListener("touchend", (e) => {
      const endTouch = e.changedTouches[0];
      touchState.lastTouchType = "end";
      
      updateDebug(`TOUCH END - Moving: ${touchState.isMoving}, Dragging: ${touchState.isDragging}`);
      showTouchPoint(endTouch.clientX, endTouch.clientY, "rgba(255, 0, 0, 0.8)", "000000 END");
      
      // Use the actual end position, not the start position
      const endX = endTouch.clientX;
      const endY = endTouch.clientY;
      
      // Always send mouseup first
      const mouseUpEvent = createMouseEvent("mouseup", endX, endY, 0);
      canvas.canvas.dispatchEvent(mouseUpEvent);
      updateDebug(`Sent: mouseup at (${endX}, ${endY})`);

      // If it was a quick tap (not a drag), send a click event
      if (!touchState.isMoving && touchState.startTime) {
        const duration = Date.now() - touchState.startTime;
        if (duration < 500) { // Quick tap (increased from 200ms)
          updateDebug(`QUICK TAP: ${duration}ms - sending click`);
          showTouchPoint(endX, endY, "rgba(0, 255, 255, 0.9)", "000000CLICK");
          
          const clickEvent = createMouseEvent("click", endX, endY, 0);
          canvas.canvas.dispatchEvent(clickEvent);
          updateDebug(`Sent: click at (${endX}, ${endY})`);
        }
      }
      
      // Clean up state
      cleanupRightClickState();
      
      e.preventDefault();
    }, { passive: false });

    // Handle touch cancel
    canvas.canvas.addEventListener("touchcancel", (e) => {
      const cancelTouch = e.changedTouches[0];
      updateDebug("TOUCH CANCELLED");
      showTouchPoint(cancelTouch.clientX, cancelTouch.clientY, "rgba(128, 128, 128, 0.8)", "0000000  CANCEL");
      
      // Send mouseup on cancel
      const mouseUpEvent = createMouseEvent("mouseup", cancelTouch.clientX, cancelTouch.clientY, 0);
      canvas.canvas.dispatchEvent(mouseUpEvent);
      
      cleanupRightClickState();
      e.preventDefault();
    }, { passive: false });

    // Enhanced mouse event logging for debugging
    if (DEBUG_MODE) {
      ['mousedown', 'mouseup', 'mousemove', 'click', 'contextmenu', 'dblclick'].forEach(eventType => {
        canvas.canvas.addEventListener(eventType, (e) => {
          console.log(`🖱️  Mouse Event: ${eventType.toUpperCase()} at (${e.clientX}, ${e.clientY}) button:${e.button} buttons:${e.buttons}`);
          
          // Special logging for Litegraph-specific events
          if (eventType === 'contextmenu') {
            console.log('🔍 Context menu triggered - this should show Litegraph right-click menu');
          }
          if (eventType === 'click') {
            console.log('🔍 Click event - check if this interferes with Litegraph');
          }
        });
      });

      // Log any Litegraph-specific events if available
      if (canvas && canvas.canvas) {
        console.log('🔧 Canvas element ready for touch simulation');
        console.log('🔧 Canvas rect:', canvas.canvas.getBoundingClientRect());
      }
    }
  </script>
</body>
</html>
