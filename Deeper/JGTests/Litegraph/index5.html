<!DOCTYPE html>
<html>
<head>
  <title>Litegraph Demo</title>
  <script src="https://cdn.jsdelivr.net/gh/jagenjo/litegraph.js/build/litegraph.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jagenjo/litegraph.js/css/litegraph.css" />
  <link rel="icon" type="image/x-icon" href="../../../upper/JG_favicon.ico">


  <style>
    html, body { 
      margin: 0; 
      height: 100%; 
      overflow: hidden; 
      font-family: Arial, sans-serif;
    }
    canvas { 
      width: 100vw; 
      height: 100vh; 
      display: block; 
      background: #1e1e1e; 
      touch-action: none; /* Prevent default touch behaviors */
    }
    
    .right-click-indicator {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1000;
      border: 3px solid rgba(55, 250, 55, 0.7);
      background: radial-gradient(circle, rgba(55, 250, 55, 0.9) 0%, transparent 0%);
      transform: translate(-50%, -50%);
      transition: all 0.1s ease-out;
    }
    
    @keyframes countdown {
      from {
        transform: translate(-50%, -50%) scale(0.1);
        opacity: 0.1;
      }
      to {
        transform: translate(-50%, -50%) scale(1.61);
        opacity: 0.9;
      }
    }

    /* Debug overlay */
    .debug-overlay {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      z-index: 2000;
      max-width: 300px;
    }

    .touch-debug {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 0, 0, 0.5);
      pointer-events: none;
      z-index: 1500;
      transform: translate(-50%, -50%);
    }
  </style>  
</head>
<body>
  <canvas id="graphcanvas" style='border: 1px solid'></canvas>
  <script>
    // Responsive canvas setup
    function setupCanvas() {
      const canvas = document.getElementById('graphcanvas');
      const dpr = window.devicePixelRatio || 1;
      
      // Set canvas size based on viewport
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      
      // Scale the canvas back down using CSS
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      
      // Scale the drawing context so everything draws at the higher resolution
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
    }

    // Initial setup
    setupCanvas();
    
    // Handle window resize
    window.addEventListener('resize', () => {
      setupCanvas();
      if (window.canvas) {
        window.canvas.resize();
      }
    });

    // Create graph and canvas
    const graph = new LGraph();
    const canvas = new LGraphCanvas("#graphcanvas", graph);
    window.canvas = canvas; // Store reference for resize

    // Create a constant node
    const constA = LiteGraph.createNode("basic/const");
    constA.pos = [100, 100];
    constA.setValue(3);
    graph.add(constA);

    const constB = LiteGraph.createNode("basic/const");
    constB.pos = [100, 200];
    constB.setValue(7);
    graph.add(constB);

    // Custom add node
    function AddNode() {
      this.addInput("A", "number");
      this.addInput("B", "number");
      this.addOutput("Sum", "number");
    }
    AddNode.title = "Add";
    AddNode.prototype.onExecute = function() {
      const a = this.getInputData(0) || 0;
      const b = this.getInputData(1) || 0;
      this.setOutputData(0, a + b);
    };
    LiteGraph.registerNodeType("math/add", AddNode);

    const adder = LiteGraph.createNode("math/add");
    adder.pos = [300, 150];
    graph.add(adder);

    // Watch the result
    const watcher = LiteGraph.createNode("basic/watch");
    watcher.pos = [500, 150];
    graph.add(watcher);

    // Connect the nodes
    constA.connect(0, adder, 0);
    constB.connect(0, adder, 1);
    adder.connect(0, watcher, 0);

    // Start the graph
    graph.start();
    window.canvas.resize();
  </script>


  <!-- Enhanced touch support with debugging -->
  <script>
    // Debug mode toggle
    const DEBUG_MODE = true;

    // Touch state management
    let touchState = {
      longPressTimeout: null,
      indicator: null,
      startPosition: null,
      startTime: null,
      isDragging: false,
      longPressHandled: false,
      lastTapTime: 0,
      // Hover simulation
      virtualCursor: { x: 0, y: 0 },
      isHovering: false,
      hoverTimeout: null
    };

    const LONG_PRESS_DURATION = 600; // ms
    const MOVE_THRESHOLD = 10; // pixels
    const DOUBLE_TAP_DELAY = 300; // ms
    const HOVER_UPDATE_INTERVAL = 16; // ms (~60fps)

    // Debug functions
    function createDebugOverlay() {
      if (!DEBUG_MODE) return;
      const overlay = document.createElement("div");
      overlay.id = "debug-overlay";
      overlay.className = "debug-overlay";
      overlay.innerHTML = "Touch Debug: Ready";
      document.body.appendChild(overlay);
    }

    function updateDebug(message) {
      if (!DEBUG_MODE) return;
      const overlay = document.getElementById("debug-overlay");
      if (overlay) {
        const timestamp = new Date().toLocaleTimeString();
        overlay.innerHTML = `${timestamp}: ${message}<br>` + overlay.innerHTML.split('<br>').slice(0, 10).join('<br>');
      }
    }

    function showTouchPoint(x, y, color = "rgba(255, 0, 0, 0.5)") {
      if (!DEBUG_MODE) return;
      const point = document.createElement("div");
      point.className = "touch-debug";
      point.style.left = `${x}px`;
      point.style.top = `${y}px`;
      point.style.background = color;
      document.body.appendChild(point);
      
      setTimeout(() => {
        if (point.parentNode) {
          document.body.removeChild(point);
        }
      }, 1000);
    }

    // Initialize debug overlay
    createDebugOverlay();

    // Hover simulation functions
    function updateVirtualCursor(x, y) {
      touchState.virtualCursor.x = x;
      touchState.virtualCursor.y = y;
      touchState.isHovering = true;
      
      // Clear existing hover timeout
      if (touchState.hoverTimeout) {
        clearTimeout(touchState.hoverTimeout);
      }
      
      // Send immediate hover event
      sendHoverEvent(x, y);
      
      // Set timeout to stop hovering after no touch activity
      touchState.hoverTimeout = setTimeout(() => {
        touchState.isHovering = false;
        updateDebug("Hover simulation stopped");
      }, 1000); // Stop hovering after 1 second of inactivity
    }
    
    function sendHoverEvent(x, y) {
      if (!touchState.isHovering) return;
      
      const fakeTouch = { clientX: x, clientY: y };
      const hoverEvent = createPointerEvent('mousemove', fakeTouch, { buttons: 0 });
      canvas.canvas.dispatchEvent(hoverEvent);
      
      if (DEBUG_MODE) {
        // Show a small indicator for virtual cursor (optional)
        const indicator = document.createElement("div");
        indicator.style.position = "absolute";
        indicator.style.left = `${x-2}px`;
        indicator.style.top = `${y-2}px`;
        indicator.style.width = "4px";
        indicator.style.height = "4px";
        indicator.style.background = "rgba(255, 255, 0, 0.5)";
        indicator.style.borderRadius = "50%";
        indicator.style.pointerEvents = "none";
        indicator.style.zIndex = "1600";
        document.body.appendChild(indicator);
        
        setTimeout(() => {
          if (indicator.parentNode) {
            document.body.removeChild(indicator);
          }
        }, 100);
      }
    }

    // Helper function to create pointer event from touch
    function createPointerEvent(type, touch, options = {}) {
      const rect = canvas.canvas.getBoundingClientRect();
      const canvasX = touch.clientX - rect.left;
      const canvasY = touch.clientY - rect.top;
      
      // Create a real DOM event that LiteGraph can understand
      const event = new MouseEvent(type.replace('pointer', 'mouse'), {
        clientX: touch.clientX,
        clientY: touch.clientY,
        button: options.button || 0,
        buttons: options.buttons || 0,
        bubbles: true,
        cancelable: true,
        view: window
      });
      
      // Add canvas-relative coordinates that LiteGraph uses
      event.canvasX = canvasX;
      event.canvasY = canvasY;
      event.layerX = canvasX;
      event.layerY = canvasY;
      event.offsetX = canvasX;
      event.offsetY = canvasY;
      
      return event;
    }

    function createRightClickIndicator(x, y) {
      const indicator = document.createElement("div");
      indicator.className = "right-click-indicator";
      indicator.style.left = `${x}px`;
      indicator.style.top = `${y}px`;
      indicator.style.width = "60px";
      indicator.style.height = "60px";
      indicator.style.animation = `countdown ${LONG_PRESS_DURATION}ms linear forwards`;
      
      document.body.appendChild(indicator);
      return indicator;
    }

    function cleanupTouchState() {
      if (touchState.longPressTimeout) {
        clearTimeout(touchState.longPressTimeout);
        touchState.longPressTimeout = null;
      }
      if (touchState.indicator) {
        if (touchState.indicator.parentNode) {
          document.body.removeChild(touchState.indicator);
        }
        touchState.indicator = null;
      }
      touchState.isDragging = false;
      touchState.startPosition = null;
      touchState.startTime = null;
      touchState.longPressHandled = false;
    }

    // Handle touch start
    canvas.canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1) {
        cleanupTouchState();
        return;
      }
      e.preventDefault();

      const touch = e.touches[0];
      const currentTime = Date.now();
      cleanupTouchState();

      touchState.startPosition = { x: touch.clientX, y: touch.clientY };
      touchState.startTime = currentTime;
      
      // Always update virtual cursor position on touch start
      updateVirtualCursor(touch.clientX, touch.clientY);
      
      updateDebug(`Touch Start at (${touch.clientX.toFixed(0)}, ${touch.clientY.toFixed(0)})`);
      showTouchPoint(touch.clientX, touch.clientY, "rgba(0, 255, 0, 0.7)");

      // Check for double tap
      const timeSinceLastTap = currentTime - touchState.lastTapTime;
      if (timeSinceLastTap < DOUBLE_TAP_DELAY) {
        updateDebug("Double tap detected -> opening search");
        showTouchPoint(touch.clientX, touch.clientY, "rgba(255, 0, 255, 0.9)");
        
        // Trigger double click for search menu
        const dblClickEvent = createPointerEvent('dblclick', touch);
        canvas.canvas.dispatchEvent(dblClickEvent);
        touchState.lastTapTime = 0;
        return;
      }

      // Start long press timer for context menu
      touchState.indicator = createRightClickIndicator(touch.clientX, touch.clientY);
      
      touchState.longPressTimeout = setTimeout(() => {
        if (!touchState.isDragging) {
          updateDebug("Long Press -> trying right-click approaches");
          showTouchPoint(touch.clientX, touch.clientY, "rgba(255, 252, 0, 0.9)");
          
          // Try multiple approaches to trigger context menu
          
          // Approach 1: Right mouse button down + up
          const rightMouseDown = createPointerEvent('mousedown', touch, { button: 2, buttons: 2 });
          const rightMouseUp = createPointerEvent('mouseup', touch, { button: 2, buttons: 0 });
          canvas.canvas.dispatchEvent(rightMouseDown);
          
          setTimeout(() => {
            canvas.canvas.dispatchEvent(rightMouseUp);
            
            // Approach 2: Context menu event (as fallback)
            setTimeout(() => {
              const contextEvent = createPointerEvent('contextmenu', touch, { button: 2 });
              canvas.canvas.dispatchEvent(contextEvent);
              updateDebug("Dispatched: mousedown(right) -> mouseup(right) -> contextmenu");
            }, 10);
          }, 10);
          
          touchState.longPressHandled = true;
          cleanupTouchState();
        }
      }, LONG_PRESS_DURATION);

    }, { passive: false });

    // Handle touch move
    canvas.canvas.addEventListener("touchmove", (e) => {
      if (e.touches.length !== 1 || !touchState.startPosition || touchState.longPressHandled) return;
      e.preventDefault();

      const touch = e.touches[0];
      const deltaX = Math.abs(touch.clientX - touchState.startPosition.x);
      const deltaY = Math.abs(touch.clientY - touchState.startPosition.y);

      // Always update virtual cursor position for hover simulation
      updateVirtualCursor(touch.clientX, touch.clientY);

      if (!touchState.isDragging && (deltaX > MOVE_THRESHOLD || deltaY > MOVE_THRESHOLD)) {
        updateDebug(`Drag started (Δx=${deltaX}, Δy=${deltaY})`);
        touchState.isDragging = true;
        
        // Cancel long press
        if (touchState.longPressTimeout) {
          clearTimeout(touchState.longPressTimeout);
          touchState.longPressTimeout = null;
        }
        if (touchState.indicator && touchState.indicator.parentNode) {
          document.body.removeChild(touchState.indicator);
          touchState.indicator = null;
        }

        // Start drag with mousedown at start position
        const startTouch = { clientX: touchState.startPosition.x, clientY: touchState.startPosition.y };
        const mouseDownEvent = createPointerEvent('mousedown', startTouch, { buttons: 1 });
        canvas.canvas.dispatchEvent(mouseDownEvent);
        updateDebug(`Dispatched mousedown for drag`);
      }

      if (touchState.isDragging) {
        const mouseMoveEvent = createPointerEvent('mousemove', touch, { buttons: 1 });
        canvas.canvas.dispatchEvent(mouseMoveEvent);
        if (DEBUG_MODE) {
          showTouchPoint(touch.clientX, touch.clientY, "rgba(0, 0, 255, 0.3)");
        }
      }
    }, { passive: false });

    // Handle touch end 
    canvas.canvas.addEventListener("touchend", (e) => {
      if (!touchState.startPosition || touchState.longPressHandled) {
        cleanupTouchState();
        return;
      }
      e.preventDefault();

      const touch = e.changedTouches[0];
      const currentTime = Date.now();
      
      // Always update virtual cursor to final position
      updateVirtualCursor(touch.clientX, touch.clientY);
      
      updateDebug(`Touch End at (${touch.clientX.toFixed(0)}, ${touch.clientY.toFixed(0)})`);
      showTouchPoint(touch.clientX, touch.clientY, "rgba(255, 0, 0, 0.7)");

      if (touchState.isDragging) {
        updateDebug("Drag ended -> mouseup");
        const mouseUpEvent = createPointerEvent('mouseup', touch);
        canvas.canvas.dispatchEvent(mouseUpEvent);
      } else {
        // Single tap - dispatch proper sequence and keep cursor active
        updateDebug("Single tap -> mousedown + mouseup + click + cursor positioned");
        showTouchPoint(touch.clientX, touch.clientY, "rgba(0, 255, 255, 0.7)");
        
        const mouseDownEvent = createPointerEvent('mousedown', touch);
        const mouseUpEvent = createPointerEvent('mouseup', touch);
        const clickEvent = createPointerEvent('click', touch);
        
        canvas.canvas.dispatchEvent(mouseDownEvent);
        
        setTimeout(() => {
          canvas.canvas.dispatchEvent(mouseUpEvent);
          setTimeout(() => {
            canvas.canvas.dispatchEvent(clickEvent);
            // After click, send a final hover event to maintain cursor position
            setTimeout(() => {
              updateVirtualCursor(touch.clientX, touch.clientY);
            }, 20);
          }, 10);
        }, 10);
        
        touchState.lastTapTime = currentTime;
      }
      
      cleanupTouchState();
    }, { passive: false });

    // Handle touch cancel
    canvas.canvas.addEventListener("touchcancel", (e) => {
      updateDebug("Touch Cancelled");
      if (e.changedTouches.length > 0) {
        const touch = e.changedTouches[0];
        showTouchPoint(touch.clientX, touch.clientY, "rgba(0, 0, 0, 1.0)");
      }
      
      if (touchState.isDragging) {
        const touch = e.changedTouches[0];
        const mouseUpEvent = createPointerEvent('mouseup', touch);
        canvas.canvas.dispatchEvent(mouseUpEvent);
      }
      
      cleanupTouchState();
      e.preventDefault();
    }, { passive: false });

    // Optional: Add pointer event support as fallback
    if (window.PointerEvent) {
      updateDebug("Pointer events supported");
    }

    // Additional debugging
    if (DEBUG_MODE) {
      ['mousedown', 'mouseup', 'mousemove', 'click', 'dblclick', 'contextmenu'].forEach(eventType => {
        canvas.canvas.addEventListener(eventType, (e) => {
          // Only log non-hover mousemove events to reduce spam
          if (e.type === 'mousemove' && e.buttons === 0) {
            // This is a hover event, log it less frequently
            if (Math.random() < 0.05) { // Log only 5% of hover events to reduce spam
              updateDebug(`Hover Event: ${e.type} at (${e.clientX}, ${e.clientY})`);
            }
          } else {
            updateDebug(`Mouse Event: ${e.type} at (${e.clientX}, ${e.clientY}) canvas:(${e.canvasX}, ${e.canvasY}) button:${e.button} buttons:${e.buttons}`);
          }
        });
      });
      
      // Let's also monitor what LiteGraph's canvas object has for context menu handling
      if (canvas.onContextMenu) {
        updateDebug("LiteGraph has onContextMenu method");
      } else {
        updateDebug("LiteGraph missing onContextMenu method");
      }
      
      // Check if there are other context-related methods
      const contextMethods = Object.getOwnPropertyNames(canvas.__proto__).filter(name => 
        name.toLowerCase().includes('context') || name.toLowerCase().includes('menu')
      );
      if (contextMethods.length > 0) {
        updateDebug(`Found context methods: ${contextMethods.join(', ')}`);
      }
      
      updateDebug("Hover simulation enabled - virtual cursor follows all touch interactions");
    }
  </script>
</body>
</html>
