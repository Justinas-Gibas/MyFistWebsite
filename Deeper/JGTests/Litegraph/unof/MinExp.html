<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <script src="../../../lib/Litegraph/litegraph.css"></script>
  <script src="../../../lib/Litegraph/litegraph.js"></script>
	<style>
		body {
			margin: 0;
			padding: 20px;
			font-family: Arial, sans-serif;
		}
		.graph-container {
			display: inline-block;
			margin: 10px;
			vertical-align: top;
		}
		.graph-title {
			text-align: center;
			margin-bottom: 10px;
			font-weight: bold;
		}
		canvas {
			border: 1px solid #333;
		}
	</style>
</head>
<body>
	<div class="graph-container">
		<div class="graph-title">Graph 1</div>
		<canvas id='canvas' width='512' height='512'></canvas>
	</div>
	
	

<script >


// First Graph
var graph = new LGraph();
var canvas = new LGraphCanvas("canvas", graph);

var node_const = LiteGraph.createNode("basic/const");
node_const.pos = [10,100];
graph.add(node_const);
node_const.setValue(4.5);

var node_watch = LiteGraph.createNode("basic/watch");
node_watch.pos = [350,300];
graph.add(node_watch);

node_const.connect(0, node_watch, 0);
graph.start();


</script>
</body>
</html>
