<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JGAI - Image Labeling Tool</title>
    <meta name="description" content="JGAI - Just Good AI is a platform for exploring and utilizing AI technologies responsibly and effectively.">
    <meta name="keywords" content="AI, Artificial Intelligence, JGAI, Just Good AI, Machine Learning, Deep Learning, Responsible AI">
    <meta name="author" content="Justinas Gibas">
    <meta name="theme-color" content="#262626">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="stylesheet" href="styles.css">
    
    <!-- External Libraries -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.6/clipboard.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <!-- Max-style App Layout -->
    <div class="app-container">
        <!-- Left Sidebar: Narrow Tool Selection Tabs -->
        <aside class="toolbar">
            <div class="toolbar-tabs">
                <button class="toolbar-tab active" data-tool="select" title="Select Tool">
                    <svg viewBox="0 0 24 24"><path d="M7,2L4,5H7V7H2V2H7M22,2V7H17V5H20L17,2H22M2,17H7V19H4L7,22H2V17M22,17V22H17L20,19H17V17H22Z"/></svg>
                </button>
                <button class="toolbar-tab" data-tool="box" title="Rectangle Tool">
                    <svg viewBox="0 0 24 24"><path d="M2,4H4V2H10V4H12V2H18V4H20V10H18V12H20V18H18V20H12V18H10V20H4V18H2V12H4V10H2V4M16,16V8H8V16H16Z"/></svg>
                </button>
                <button class="toolbar-tab" data-tool="polygon" title="Polygon Tool">
                    <svg viewBox="0 0 24 24"><path d="M2,2H6V4H4V6H2V2M22,2V6H20V4H18V2H22M2,18H4V20H6V22H2V18M18,20V22H22V18H20V20H18M8,3L10,7L8,11L12,9L16,11L14,7L16,3L12,5L8,3M11,13H13V15H11V13M11,17H13V23H11V17Z"/></svg>
                </button>
                <button class="toolbar-tab" data-tool="label" title="Label Manager">
                    <svg viewBox="0 0 24 24"><path d="M17.63,5.84C17.27,5.33 16.67,5 16,5H5A2,2 0 0,0 3,7V17A2,2 0 0,0 5,19H16C16.67,19 17.27,18.66 17.63,18.15L22,12L17.63,5.84Z"/></svg>
                </button>
                <button class="toolbar-tab" data-tool="settings" title="Settings">
                    <svg viewBox="0 0 24 24"><path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/></svg>
                </button>
                <button class="toolbar-tab" data-tool="import" title="Import Image">
                    <svg viewBox="0 0 24 24"><path d="M13,9H18.5L13,3.5V9M6,2H14L20,8V20A2,2 0 0,1 18,22H6C4.89,22 4,21.1 4,20V4C4,2.89 4.89,2 6,2M6,20H15L18,20V12L14,16L12,14L6,20M8,9A2,2 0 0,0 6,11A2,2 0 0,0 8,13A2,2 0 0,0 10,11A2,2 0 0,0 8,9Z"/></svg>
                </button>
                <button class="toolbar-tab" data-tool="export" title="Export Annotations">
                    <svg viewBox="0 0 24 24"><path d="M5,20H19V18H5M19,9H15V3H9V9H5L12,16L19,9Z"/></svg>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="app-main">
            <!-- Header with draggable controls and label selection -->
            <div class="app-header" id="appHeader">
                <div class="app-header-drag-handle">
                    <div class="app-title">JGAI Labeling Tool</div>
                </div>
                <div class="header-tools">
                    <div class="status-text" id="status-messages">Ready</div>
                    <div class="annotation-counter" id="annotationCount">0</div>
                </div>
                <div class="label-selector">
                    <div class="selected-label" id="selectedLabel">
                        <span id="activeLabelDisplay">default_label</span>
                        <svg viewBox="0 0 24 24"><path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"/></svg>
                    </div>
                    <div class="label-dropdown" id="labelDropdown">
                        <div class="label-search">
                            <input type="text" id="newLabelInput" placeholder="Search or add new label">
                            <button id="addLabelBtn" class="label-add-btn">Add</button>
                        </div>
                        <ul id="labelList" class="label-list"></ul>
                    </div>
                </div>

                
            </div>

            <!-- Workspace Area -->
            <div class="app-workspace">
                <!-- Import Screen -->
                <div id="imageImportSection" class="import-section">
                    <div class="import-card">
                        <h2>Import Image</h2>
                        <div class="file-input-wrapper">
                            <input type="file" id="imageLoader" accept="image/*" hidden>
                            <button id="importBtn" class="btn">
                                <svg viewBox="0 0 24 24"><path d="M13,9H18.5L13,3.5V9M6,2H14L20,8V20A2,2 0 0,1 18,22H6C4.89,22 4,21.1 4,20V4C4,2.89 4.89,2 6,2M6,20H15L18,20V12L14,16L12,14L6,20M8,9A2,2 0 0,0 6,11A2,2 0 0,0 8,13A2,2 0 0,0 10,11A2,2 0 0,0 8,9Z"/></svg>
                                Choose Image
                            </button>
                        </div>
                        <div id="dropZone" class="drop-zone">
                            <p>Drag and drop an image here</p>
                        </div>
                    </div>
                </div>

                <!-- Canvas Container -->
                <div id="canvasContainer" class="canvas-container" style="display: none;">
                    <canvas id="annotationCanvas" class="annotation-canvas"></canvas>
                    
                    <!-- Floating Canvas Controls -->
                    <div class="canvas-controls">
                        <button id="zoomInBtn" class="canvas-control-btn" title="Zoom In">
                            <svg viewBox="0 0 24 24"><path d="M15.5,14L20.5,19L19,20.5L14,15.5V14.71L13.73,14.43C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.43,13.73L14.71,14H15.5M9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14M12,10H10V12H9V10H7V9H9V7H10V9H12V10Z"/></svg>
                        </button>
                        <button id="zoomOutBtn" class="canvas-control-btn" title="Zoom Out">
                            <svg viewBox="0 0 24 24"><path d="M15.5,14H14.71L14.43,13.73C15.41,12.59 16,11.11 16,9.5A6.5,6.5 0 0,0 9.5,3A6.5,6.5 0 0,0 3,9.5A6.5,6.5 0 0,0 9.5,16C11.11,16 12.59,15.41 13.73,14.43L14,14.71V15.5L19,20.5L20.5,19L15.5,14M9.5,14C7,14 5,12 5,9.5C5,7 7,5 9.5,5C12,5 14,7 14,9.5C14,12 12,14 9.5,14M7,9H12V10H7V9Z"/></svg>
                        </button>
                        <button id="fitBtn" class="canvas-control-btn" title="Fit to View">
                            <svg viewBox="0 0 24 24"><path d="M10,21V19H6.41L10.91,14.5L9.5,13.09L5,17.59V14H3V21H10M14.5,10.91L19,6.41V10H21V3H14V5H17.59L13.09,9.5L14.5,10.91Z"/></svg>
                        </button>
                    </div>

                    <!-- For polygon tool -->
                    <div id="polygonControls" class="polygon-controls" style="display:none">
                        <button id="finishPolygonBtn" class="btn btn-confirm">
                            <svg viewBox="0 0 24 24"><path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"/></svg>
                            Finish Polygon
                        </button>
                        <button id="cancelPolygonBtn" class="btn btn-cancel">
                            <svg viewBox="0 0 24 24"><path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"/></svg>
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Right Sidebar: Selected Tool Panel -->
        <aside id="toolPanel" class="tool-panel">
            <!-- Dynamic content based on selected tool -->
            <div class="tool-panel-header">
                <h3 id="toolPanelTitle">Tool Options</h3>
                <button class="tool-panel-toggle" id="toggleToolPanel">
                    <svg class="icon-collapse" viewBox="0 0 24 24"><path d="M18.41,7.41L17,6L11,12L17,18L18.41,16.59L13.83,12L18.41,7.41M12.41,7.41L11,6L5,12L11,18L12.41,16.59L7.83,12L12.41,7.41Z"/></svg>
                    <svg class="icon-expand" viewBox="0 0 24 24"><path d="M5.59,7.41L7,6L13,12L7,18L5.59,16.59L10.17,12L5.59,7.41M11.59,7.41L13,6L19,12L13,18L11.59,16.59L16.17,12L11.59,7.41Z"/></svg>
                </button>
            </div>

            <!-- Panel Content Area for dynamic tool options -->
            <div class="tool-panel-content">
                <!-- Select Tool Panel -->
                <div class="tool-options tool-select">
                    <div class="panel-section">
                        <h4>Annotations</h4>
                        <ul id="annotationList" class="annotation-list"></ul>
                    </div>
                    <div class="panel-actions">
                        <button id="deleteAnnotationBtn" class="btn btn-danger" disabled>
                            <svg viewBox="0 0 24 24"><path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"/></svg>
                            Delete
                        </button>
                        <button id="clearAllBtn" class="btn btn-warning">
                            <svg viewBox="0 0 24 24"><path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"/></svg>
                            Clear All
                        </button>
                    </div>
                </div>

                <!-- Box Tool Panel -->
                <div class="tool-options tool-box" style="display:none">
                    <div class="panel-section">
                        <h4>Rectangle Options</h4>
                        <div class="option-group">
                            <label for="boxLineWidth">Line Width</label>
                            <input type="range" id="boxLineWidth" min="1" max="10" value="2">
                        </div>
                        <div class="color-picker">
                            <label>Color</label>
                            <div class="color-options">
                                <button class="color-option active" data-color="#ef4444" style="background:#ef4444"></button>
                                <button class="color-option" data-color="#f59e0b" style="background:#f59e0b"></button>
                                <button class="color-option" data-color="#10b981" style="background:#10b981"></button>
                                <button class="color-option" data-color="#3b82f6" style="background:#3b82f6"></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Polygon Tool Panel -->
                <div class="tool-options tool-polygon" style="display:none">
                    <div class="panel-section">
                        <h4>Polygon Options</h4>
                        <div class="option-group">
                            <label for="polygonLineWidth">Line Width</label>
                            <input type="range" id="polygonLineWidth" min="1" max="10" value="2">
                        </div>
                        <div class="option-group">
                            <label for="polygonFill">Fill Opacity</label>
                            <input type="range" id="polygonFill" min="0" max="100" value="20">
                        </div>
                        <div class="color-picker">
                            <label>Color</label>
                            <div class="color-options">
                                <button class="color-option" data-color="#ef4444" style="background:#ef4444"></button>
                                <button class="color-option" data-color="#f59e0b" style="background:#f59e0b"></button>
                                <button class="color-option active" data-color="#10b981" style="background:#10b981"></button>
                                <button class="color-option" data-color="#3b82f6" style="background:#3b82f6"></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Label Tool Panel -->
                <div class="tool-options tool-label" style="display:none">
                    <div class="panel-section">
                        <h4>Label Management</h4>
                        <div class="label-input-group">
                            <input type="text" id="createLabelInput" placeholder="New label name">
                            <button id="createLabelBtn" class="btn">Create</button>
                        </div>
                        <ul class="managed-label-list" id="managedLabelList"></ul>
                    </div>
                    <div class="panel-actions">
                        <button id="deleteLabelBtn" class="btn btn-danger" disabled>
                            <svg viewBox="0 0 24 24"><path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"/></svg>
                            Delete Label
                        </button>
                    </div>
                </div>

                <!-- Settings Tool Panel -->
                <div class="tool-options tool-settings" style="display:none">
                    <div class="panel-section">
                        <h4>Application Settings</h4>
                        <div class="option-group">
                            <label for="themeSelect">Interface Theme</label>
                            <select id="themeSelect">
                                <option value="dark">Dark Mode</option>
                                <option value="light">Light Mode</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label for="snapGrid">Enable Snap Grid</label>
                            <input type="checkbox" id="snapGrid">
                        </div>
                        <div class="option-group">
                            <label for="autoSave">Auto-Save</label>
                            <input type="checkbox" id="autoSave" checked>
                        </div>
                    </div>
                </div>

                <!-- Import Tool Panel -->
                <div class="tool-options tool-import" style="display:none">
                    <div class="panel-section">
                        <h4>Import Options</h4>
                        <div class="option-group">
                            <label for="importFormat">Format</label>
                            <select id="importFormat">
                                <option value="image">Single Image</option>
                                <option value="batch">Batch Import</option>
                                <option value="annotations">Import Annotations</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <button id="importFilesBtn" class="btn btn-block">
                                <svg viewBox="0 0 24 24"><path d="M13,9H18.5L13,3.5V9M6,2H14L20,8V20A2,2 0 0,1 18,22H6C4.89,22 4,21.1 4,20V4C4,2.89 4.89,2 6,2M11,15V12H9V15H6L10,19L14,15H11Z"/></svg>
                                Browse Files
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Export Tool Panel -->
                <div class="tool-options tool-export" style="display:none">
                    <div class="panel-section">
                        <h4>Export Options</h4>
                        <div class="option-group">
                            <label for="exportFormat">Format</label>
                            <select id="exportFormat">
                                <option value="json">JSON</option>
                                <option value="coco">COCO</option>
                                <option value="yolo">YOLO</option>
                                <option value="csv">CSV</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label for="includeImage">Include Images</label>
                            <input type="checkbox" id="includeImage">
                        </div>
                        <div class="option-group">
                            <button id="exportBtn" class="btn btn-primary btn-block">
                                <svg viewBox="0 0 24 24"><path d="M5,20H19V18H5M19,9H15V3H9V9H5L12,16L19,9Z"/></svg>
                                Export Annotations
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
