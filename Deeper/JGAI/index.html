  <script>
    // Global variables that need to be shared between modules
    window.boxes = [];
    window.dataset = [];
    window.model = null;
    window.isInferenceRunning = false;

    window.cubes = [];

  <script type="module">
    import * as THREE from 'three';

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.14.0/dist/tf.min.js"></script>
  <script>
    // Wait for the page to load before initializing TensorFlow
    window.addEventListener('load', function() {
      console.log("Setting up TensorFlow backend...");
      tf.enableDebugMode();
      tf.setBackend('webgpu')
        .then(() => {
          console.log("✅ WebGPU backend enabled");
          document.getElementById('tfBackend').textContent = "WebGPU";
        })
        .catch((err) => {
          console.warn("WebGPU not available, falling back to WebGL:", err);
          tf.setBackend('webgl')
            .then(() => {
              console.log("✅ WebGL fallback activated");
              // Log WebGL details
              const gl = document.createElement('canvas').getContext('webgl');
              console.log("WebGL Info:", {
                vendor: gl.getParameter(gl.VENDOR),
                renderer: gl.getParameter(gl.RENDERER),
                version: gl.getParameter(gl.VERSION)
              });
              document.getElementById('tfBackend').textContent = "WebGL";
            });
        });

      // Log available backends
      console.log("Available TF backends:", tf.findBackendFactory());
      
      // Memory monitoring
      setInterval(() => {
        const memoryInfo = tf.memory();
        document.getElementById('memoryUsage').textContent = 
          `${(memoryInfo.numBytes / (1024 * 1024)).toFixed(2)} MB`;
        
        // Alert if memory usage is too high
        if (memoryInfo.numBytes > 500 * 1024 * 1024) {
          console.warn("High memory usage:", memoryInfo);
        }
      }, 5000);
    });
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    
    // Global variables
    let scene, camera, controls;
    let isDrawing = false, startX, startY; 
    let drawingMode = false;
    let lastTime = 0, frameCount = 0;
    let fpsInterval = setInterval(updateFPS, 1000);
    
    // Initialize 3D scene
    function init() {
      logDebug("Initializing 3D scene");
      
      // Scene setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x222222);
      
      // Camera setup
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;
      
      // Renderer setup
      window.renderer = new THREE.WebGLRenderer({ antialias: true });
      window.renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(window.renderer.domElement);
      logDebug("Renderer created with size: " + window.innerWidth + "x" + window.innerHeight);
      
      // Add orbit controls
      controls = new OrbitControls(camera, window.renderer.domElement);
      controls.enableDamping = true;
      
      // Add lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);
      
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(1, 1, 1);
      scene.add(directionalLight);
      
      // Add some objects to the scene
      createDemoObjects();
      
      // Setup overlay for annotations
      setupOverlay();
      
      // Setup UI tabs
      setupTabs();
      
      // Handle window resize
      window.addEventListener('resize', onWindowResize, false);
      
      // Start animation loop
      animate();
      
      logDebug("Scene initialization complete");
    }
    
    // Create demo 3D objects
    function createDemoObjects() {
      // Create multiple cubes with different colors and positions
      const colors = [0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff];
      const positions = [
        [-2, 0, 0],
        [2, 0, 0],
        [0, 2, 0],
        [0, -2, 0],
        [0, 0, -2]
      ];
      
      logDebug("Creating demo objects: " + colors.length + " cubes");
      
      // Create multiple objects
      for (let i = 0; i < 5; i++) {
        // Create geometry
        const geometry = new THREE.BoxGeometry();
        const material = new THREE.MeshStandardMaterial({ 
          color: colors[i],
          roughness: 0.4,
          metalness: 0.2
        });
        
        // Create cube and add to scene
        const cube = new THREE.Mesh(geometry, material);
        cube.position.set(...positions[i]);
        cube.rotation.set(Math.random(), Math.random(), Math.random());
        scene.add(cube);
        window.cubes.push(cube);
      }
      
      // Add a floor plane
      const planeGeometry = new THREE.PlaneGeometry(10, 10);
      const planeMaterial = new THREE.MeshStandardMaterial({ 
        color: 0x999999,
        side: THREE.DoubleSide,
        roughness: 0.8
      });
      
      const plane = new THREE.Mesh(planeGeometry, planeMaterial);
      plane.rotation.x = Math.PI / 2;
      plane.position.y = -3;
      scene.add(plane);
    }
    
    // Setup UI tabs
    function setupTabs() {
      const tabs = document.querySelectorAll('.tab');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          logDebug("Tab changed to: " + tab.dataset.tab);
          // Remove active class from all tabs
          tabs.forEach(t => t.classList.remove('active'));
          // Add active class to clicked tab
          tab.classList.add('active');
          
          // Hide all tab content
          document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.remove('active');
          });
          
          // Show selected tab content
          document.getElementById(tab.dataset.tab + 'Tab').classList.add('active');
        });
      });
    }
    
    // Setup canvas overlay for annotations
    function setupOverlay() {
      const overlay = document.getElementById('overlay');
      overlay.width = window.innerWidth;
      overlay.height = window.innerHeight;
      
      // Canvas context for drawing
      const ctx = overlay.getContext('2d');
      
      // Toggle drawing mode button
      document.getElementById('toggleDrawing').addEventListener('click', function() {
        drawingMode = !drawingMode;
        logDebug("Drawing mode toggled: " + (drawingMode ? "active" : "inactive"));
        
        if (drawingMode) {
          this.textContent = 'Exit Drawing Mode';
          document.body.classList.add('drawing-active');
          controls.enabled = false;
        } else {
          this.textContent = 'Enter Drawing Mode';
          document.body.classList.remove('drawing-active');
          controls.enabled = true;
        }
      });
      
      // Drawing events
      overlay.addEventListener('mousedown', e => {
        if (!drawingMode) return;
        logDebug("Started drawing at: " + e.offsetX + "," + e.offsetY);
        isDrawing = true;
        startX = e.offsetX;
        startY = e.offsetY;
      });
      
      overlay.addEventListener('mousemove', e => {
        if (!isDrawing || !drawingMode) return;
        const ctx = overlay.getContext('2d');
        ctx.clearRect(0, 0, overlay.width, overlay.height);
        drawBoxes();
        
        // Draw current box
        ctx.strokeStyle = 'yellow';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        
        const width = e.offsetX - startX;
        const height = e.offsetY - startY;
        ctx.strokeRect(startX, startY, width, height);
        ctx.setLineDash([]);
      });
      
      overlay.addEventListener('mouseup', e => {
        if (!isDrawing || !drawingMode) return;
        isDrawing = false;
        
        const x = Math.min(startX, e.offsetX);
        const y = Math.min(startY, e.offsetY);
        const w = Math.abs(e.offsetX - startX);
        const h = Math.abs(e.offsetY - startY);
        
        logDebug("Finished drawing box: " + x + "," + y + " " + w + "x" + h);
        
        const label = document.getElementById('labelInput').value.trim();
        if (label && w > 10 && h > 10) {
          window.boxes.push({ x, y, w, h, label });
          drawBoxes();
          updateStatus(`Box added for "${label}"`);
        } else if (!label) {
          updateStatus("Please enter a label first");
        } else {
          updateStatus("Box too small, try again");
        }
      });
    }
    
    // Draw annotation boxes on overlay
    function drawBoxes() {
      const overlay = document.getElementById('overlay');
      const ctx = overlay.getContext('2d');
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      
      window.boxes.forEach((box, index) => {
        // Generate a color based on the label to maintain consistency
        const color = getColorForLabel(box.label);
        
        // Draw box
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.strokeRect(box.x, box.y, box.w, box.h);
        
        // Draw label background
        ctx.fillStyle = color;
        ctx.font = '14px Arial';
        const textWidth = ctx.measureText(box.label).width + 10;
        ctx.fillRect(box.x, box.y - 20, textWidth, 20);
        
        // Draw label text
        ctx.fillStyle = 'white';
        ctx.fillText(box.label, box.x + 5, box.y - 5);
      });
    }
    
    // Update status display
    function updateStatus(message) {
      document.getElementById('status').innerText = message;
      logDebug("Status: " + message);
    }
    
    // Handle window resize
    function onWindowResize() {
      logDebug("Window resized to: " + window.innerWidth + "x" + window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      window.renderer.setSize(window.innerWidth, window.innerHeight);
      
      // Update overlay
      const overlay = document.getElementById('overlay');
      overlay.width = window.innerWidth;
      overlay.height = window.innerHeight;
      drawBoxes();
    }
    
    // Update FPS counter
    function updateFPS() {
      document.getElementById('fpsCounter').textContent = frameCount;
      frameCount = 0;
    }
    
    // Main animation loop
    function animate(time) {
      requestAnimationFrame(animate);
      
      // Calculate FPS
      frameCount++;
      
      // Rotate cubes if enabled
      if (window.rotationEnabled) {
        window.cubes.forEach((cube, i) => {
          cube.rotation.x += 0.005;
          cube.rotation.y += 0.007;
        });
      }
      
      // Update controls
      controls.update();
      
      // Render scene
      window.renderer.render(scene, camera);
    }
    
    // Initialize everything when page loads
    document.addEventListener('DOMContentLoaded', init);
    
    // Make functions available globally
    window.drawBoxes = drawBoxes;
    window.updateStatus = updateStatus;
    window.onWindowResize = onWindowResize;
    
    // Toggle cube rotation
    window.toggleRotation = function() {
      window.rotationEnabled = !window.rotationEnabled;
      const rotateBtn = document.getElementById('rotateBtn');
      rotateBtn.textContent = window.rotationEnabled ? 'Pause Rotation' : 'Resume Rotation';
      logDebug("Rotation toggled: " + (window.rotationEnabled ? "active" : "paused"));
    };
    
    // Reset camera view
    window.resetView = function() {
      camera.position.set(0, 0, 5);
      camera.lookAt(0, 0, 0);
      controls.reset();
      logDebug("Camera view reset");
    };
    
    // Clear all annotation boxes
    window.clearBoxes = function() {
      logDebug("Cleared " + window.boxes.length + " annotation boxes");
      window.boxes = [];
      drawBoxes();
      updateStatus("Annotation boxes cleared");
    };
  </script>

  <script>
    // Generate a consistent color for a label
    function getColorForLabel(label) {
      // Simple hash function to generate a color
      let hash = 0;
      for (let i = 0; i < label.length; i++) {
        hash = label.charCodeAt(i) + ((hash << 5) - hash);
      }
      
      // Convert to RGB
      const r = (hash & 0xFF0000) >> 16;
      const g = (hash & 0x00FF00) >> 8;
      const b = hash & 0x0000FF;
      
      return `rgb(${r}, ${g}, ${b})`;
    }
    
    // Add debug message to log panel
    function logDebug(message) {
      const now = new Date();
      const timestamp = now.toLocaleTimeString() + '.' + now.getMilliseconds().toString().padStart(3, '0');
      
      const logEntry = document.createElement('div');
      logEntry.textContent = `[${timestamp}] ${message}`;
      
      const debugLog = document.getElementById('debugLog');
      debugLog.appendChild(logEntry);
      debugLog.scrollTop = debugLog.scrollHeight;
      
      // Keep log size reasonable
      if (debugLog.children.length > 100) {
        debugLog.removeChild(debugLog.children[0]);
      }
      
      console.log(`[DEBUG] ${message}`);
    }
    
    // Clear debug log
    function clearDebugLog() {
      document.getElementById('debugLog').innerHTML = '';
      logDebug("Debug log cleared");
    }
    
    let inferenceResult = document.getElementById('inference-result');
    
    // Capture annotated frames for dataset
    function capture() {
      logDebug("Capture function called");
      const label = document.getElementById('labelInput').value.trim();
      if (!label) {
        updateStatus("Please enter a label first");
        return;
      }
      
      if (window.boxes.length === 0) {
        updateStatus("Draw boxes before capturing");
        return;
      }
      
      logDebug(`Capturing ${window.boxes.length} annotations with label: ${label}`);
      
      // For each box, capture the region and add to dataset
      window.boxes.forEach(box => {
        const canvas = document.createElement('canvas');
        canvas.width = box.w;
        canvas.height = box.h;
        const ctx = canvas.getContext('2d');
        
        try {
          // Draw the portion of the renderer to the canvas
          ctx.drawImage(window.renderer.domElement, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);
          
          // Preview the capture
          const previewCanvas = document.getElementById('previewCanvas');
          previewCanvas.width = Math.min(250, box.w);
          previewCanvas.height = Math.min(250, box.h) * (box.h / box.w);
          const previewCtx = previewCanvas.getContext('2d');
          previewCtx.drawImage(canvas, 0, 0, previewCanvas.width, previewCanvas.height);
          
          document.getElementById('previewTitle').textContent = `Captured: ${label}`;
          document.getElementById('capturePreview').style.display = 'block';
          
          // Add to dataset
          window.dataset.push({
            img: canvas,
            label: label,
            timestamp: new Date().toISOString()
          });
          
          // Update dataset size in UI
          document.getElementById('datasetSize').textContent = window.dataset.length;
          updateClassCount();
          
          // Add to UI
          updateDatasetList();
          
        } catch (error) {
          console.error("Capture error:", error);
          logDebug(`ERROR capturing image: ${error.message}`);
          updateStatus(`Capture failed: ${error.message}`);
        }
      });
      
      updateStatus(`Captured ${window.boxes.length} annotations`);
    }
    
    // Close preview window
    function closePreview() {
      document.getElementById('capturePreview').style.display = 'none';
    }
    
    // Update the count of unique classes in the dataset
    function updateClassCount() {
      const uniqueClasses = new Set(window.dataset.map(item => item.label));
      document.getElementById('classCount').textContent = uniqueClasses.size;
      logDebug(`Dataset has ${uniqueClasses.size} unique classes: ${[...uniqueClasses].join(', ')}`);
      return uniqueClasses.size;
    }
    
    // Remove an entry from the dataset
    function removeDatasetEntry(index) {
      window.dataset.splice(index, 1);
      updateDatasetList();
      document.getElementById('datasetSize').textContent = window.dataset.length;
      updateClassCount();
      updateStatus("Dataset entry removed");
      logDebug(`Removed dataset entry at index ${index}, new size: ${window.dataset.length}`);
    }
    
    // Update the dataset list in the UI
    function updateDatasetList() {
      const datasetList = document.getElementById('datasetList');
      datasetList.innerHTML = '';
      
      window.dataset.forEach((entry, index) => {
        const item = document.createElement('div');
        item.className = 'dataset-entry';
        item.innerHTML = `
          <span>${entry.label} (${entry.img.width}x${entry.img.height})</span>
          <button class="toggle-button" onclick="removeDatasetEntry(${index})">Remove</button>
        `;
        datasetList.appendChild(item);
      });
    }
    
    // Train the machine learning model
    async function train() {
      logDebug("Training requested");
      
      try {
        // Check dataset size
        if (window.dataset.length < 5) {
          updateStatus("Need at least 5 samples to train");
          return;
        }
        
        // Check class count
        const numClasses = updateClassCount();
        if (numClasses < 2) {
          updateStatus("Need at least 2 different classes to train");
          logDebug("Training aborted: Only 1 class in dataset");
          return;
        }
        
        updateStatus("Preparing dataset...");
        
        // Get unique labels
        const labels = [...new Set(window.dataset.map(d => d.label))];
        const labelMap = Object.fromEntries(labels.map((l, i) => [l, i]));
        
        logDebug(`Training with ${window.dataset.length} samples across ${labels.length} classes`);
        logDebug(`Labels: ${labels.join(', ')}`);
        logDebug(`Label map: ${JSON.stringify(labelMap)}`);
        
        updateStatus("Converting images to tensors...");
        
        // Log the dataset details before conversion
        window.dataset.forEach((d, i) => {
          if (i < 5) { // Log just a few for brevity
            logDebug(`Sample ${i}: ${d.label}, ${d.img.width}x${d.img.height}`);
          }
        });
        
        // Convert images to tensors with error checking
        const imageTensors = [];
        for (let i = 0; i < window.dataset.length; i++) {
          try {
            const d = window.dataset[i];
            const tensor = tf.browser.fromPixels(d.img)
              .resizeNearestNeighbor([64, 64]) // Standard size
              .toFloat()
              .div(255);
            imageTensors.push(tensor);
          } catch (err) {
            logDebug(`Error converting image ${i}: ${err.message}`);
            throw new Error(`Failed to convert image ${i}: ${err.message}`);
          }
        }
        
        // Stack tensors
        const xs = tf.stack(imageTensors);
        logDebug(`Image tensor shape: ${xs.shape}`);
        
        // Convert labels to one-hot encoding
        const ys = tf.tensor1d(window.dataset.map(d => labelMap[d.label]), 'int32');
        logDebug(`Label tensor shape: ${ys.shape}`);
        
        // Log the first few label indices for debugging
        ys.array().then(arr => {
          logDebug(`Label indices: ${arr.slice(0, 5).join(', ')}...`);
        });
        
        const ysOneHot = tf.oneHot(ys, labels.length);
        logDebug(`One-hot tensor shape: ${ysOneHot.shape}`);
        
        updateStatus("Building model...");
        logDebug("Creating model architecture");
        
        // Create model architecture
        window.model = tf.sequential();
        
        // Input layer with feature extraction
        window.model.add(tf.layers.conv2d({
          inputShape: [64, 64, 3],
          filters: 16,
          kernelSize: 3,
          activation: 'relu',
          kernelInitializer: 'glorotUniform'
        }));
        window.model.add(tf.layers.maxPooling2d({ poolSize: 2 }));
        
        // Second convolutional layer
        window.model.add(tf.layers.conv2d({
          filters: 32,
          kernelSize: 3,
          activation: 'relu'
        }));
        window.model.add(tf.layers.maxPooling2d({ poolSize: 2 }));
        
        // Third convolutional layer
        window.model.add(tf.layers.conv2d({
          filters: 32,
          kernelSize: 3,
          activation: 'relu'
        }));
        window.model.add(tf.layers.maxPooling2d({ poolSize: 2 }));
        
        // Flatten and dense layers
        window.model.add(tf.layers.flatten());
        window.model.add(tf.layers.dense({ units: 64, activation: 'relu' }));
        window.model.add(tf.layers.dropout({ rate: 0.25 }));
        window.model.add(tf.layers.dense({ units: labels.length, activation: 'softmax' }));
        
        // Print model summary
        window.model.summary();
        
        // Compile model
        window.model.compile({
          loss: 'categoricalCrossentropy',
          optimizer: tf.train.adam(0.001),
          metrics: ['accuracy']
        });
        
        updateStatus("Training started...");
        
        // Train model
        await window.model.fit(xs, ysOneHot, {
          epochs: 10,
          batchSize: Math.min(32, window.dataset.length),
          validationSplit: 0.1,
          callbacks: {
            onEpochBegin: (epoch) => {
              logDebug(`Starting epoch ${epoch + 1}/10`);
            },
            onEpochEnd: (epoch, logs) => {
              const message = `Epoch ${epoch + 1}/10: loss=${logs.loss.toFixed(4)}, acc=${logs.acc.toFixed(4)}`;
              updateStatus(message);
              logDebug(message);
            },
            onBatchEnd: (batch, logs) => {
              if (batch % 5 === 0) {
                logDebug(`Batch ${batch}: loss=${logs.loss.toFixed(4)}`);
              }
            }
          }
        });
        
        // Store labels in the model
        window.model.labels = labels;
        logDebug(`Model trained successfully with labels: ${labels.join(', ')}`);
        
        // Enable inference button
        document.getElementById('inferBtn').disabled = false;
        
        // Clean up tensors
        tf.dispose([xs, ys, ysOneHot]);
        
        updateStatus("Training complete!");
      } catch (error) {
        console.error("Training error:", error);
        logDebug(`ERROR in training: ${error.message}`);
        updateStatus(`Training failed: ${error.message}`);
      }
    }
    
    // Toggle real-time inference
    function toggleInference() {
      logDebug(`Inference toggle requested. Current state: ${window.isInferenceRunning ? 'active' : 'inactive'}`);
      
      if (!window.model) {
        updateStatus("Train model before inference");
        return;
      }
      
      window.isInferenceRunning = !window.isInferenceRunning;
      const inferBtn = document.getElementById('inferBtn');
      
      if (window.isInferenceRunning) {
        inferBtn.textContent = "Stop Inference";
        inferBtn.style.background = "#aa4444";
        inferenceResult.style.display = 'block';
        updateStatus("Real-time inference started");
        
        // Start inference loop
        inferenceLoop();
      } else {
        inferBtn.textContent = "Start Inference";
        inferBtn.style.background = "";
        inferenceResult.style.display = 'none';
        updateStatus("Inference stopped");
        
        // Clear detection boxes
        document.getElementById('detectionBoxes').innerHTML = '';
      }
    }
    
    // Run continuous inference in a loop
    function inferenceLoop() {
      if (!window.isInferenceRunning) return;
      
      runInference()
        .then(() => {
          // Schedule next inference with a small delay
          setTimeout(inferenceLoop, 500);
        })
        .catch(err => {
          logDebug(`ERROR in inference loop: ${err.message}`);
          window.isInferenceRunning = false;
          document.getElementById('inferBtn').textContent = "Start Inference";
          document.getElementById('inferBtn').style.background = "";
          updateStatus(`Inference error: ${err.message}`);
        });
    }
    
    // Run inference on current frame
    async function runInference() {
      if (!window.model || !window.isInferenceRunning) return;
      
      try {
        logDebug("Running inference...");
        
        // Clear previous detection boxes
        document.getElementById('detectionBoxes').innerHTML = '';
        
        // Create a snapshot of the entire scene
        const canvas = document.createElement('canvas');
        canvas.width = 512;  // Lower resolution for faster inference
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(window.renderer.domElement, 0, 0, canvas.width, canvas.height);
        
        // Region proposal - for simplicity, we'll use a grid approach
        // This is a simplified version of real object detection
        const regions = generateRegions(canvas.width, canvas.height);
        logDebug(`Generated ${regions.length} regions for detection`);
        
        // Run inference on each region
        for (let i = 0; i < regions.length; i++) {
          const region = regions[i];
          
          // Skip if region is too small
          if (region.w < 64 || region.h < 64) continue;
          
          // Extract the region
          const regionCanvas = document.createElement('canvas');
          regionCanvas.width = region.w;
          regionCanvas.height = region.h;
          const regionCtx = regionCanvas.getContext('2d');
          regionCtx.drawImage(canvas, region.x, region.y, region.w, region.h, 0, 0, region.w, region.h);
          
          // Convert to tensor
          const tensor = tf.browser.fromPixels(regionCanvas)
            .resizeNearestNeighbor([64, 64])
            .toFloat()
            .div(255)
            .expandDims(0);
          
          // Run prediction
          const prediction = window.model.predict(tensor);
          const results = await prediction.data();
          
          // Get top prediction
          let maxIndex = 0;
          for (let j = 1; j < results.length; j++) {
            if (results[j] > results[maxIndex]) {
              maxIndex = j;
            }
          }
          
          const predictedClass = window.model.labels[maxIndex];
          const confidence = results[maxIndex] * 100;
          
          // Only display high confidence predictions
          if (confidence > 70) {
            // Adjust coordinates from 512x512 to actual screen size
            const scaleX = window.innerWidth / canvas.width;
            const scaleY = window.innerHeight / canvas.height;
            
            const screenX = region.x * scaleX;
            const screenY = region.y * scaleY;
            const screenW = region.w * scaleX;
            const screenH = region.h * scaleY;
            
            // Add detection box
            addDetectionBox(screenX, screenY, screenW, screenH, predictedClass, confidence);
            
            logDebug(`Detection: ${predictedClass} (${confidence.toFixed(2)}%) at ${screenX},${screenY} ${screenW}x${screenH}`);
          }
          
          // Clean up tensor
          tf.dispose(tensor);
          tf.dispose(prediction);
        }
        
        // Display overall result
        inferenceResult.innerHTML = `
          <strong>Inference active</strong><br>
          <span>Analyzing ${regions.length} regions</span>
        `;
        
      } catch (error) {
        console.error("Inference error:", error);
        logDebug(`ERROR in inference: ${error.message}`);
      }
    }
    
    // Generate regions for object detection
    function generateRegions(width, height) {
      const regions = [];
      const sizes = [
        {w: 128, h: 128},
        {w: 192, h: 192},
        {w: 256, h: 256}
      ];
      
      // Create sliding windows of different sizes
      sizes.forEach(size => {
        const stepX = size.w / 2;
        const stepY = size.h / 2;
        
        for (let x = 0; x <= width - size.w; x += stepX) {
          for (let y = 0; y <= height - size.h; y += stepY) {
            regions.push({
              x: Math.floor(x),
              y: Math.floor(y),
              w: size.w,
              h: size.h
            });
          }
        }
      });
      
      return regions;
    }
    
    // Add a detection box to the UI
    function addDetectionBox(x, y, w, h, label, confidence) {
      const container = document.getElementById('detectionBoxes');
      
      // Create box
      const box = document.createElement('div');
      box.className = 'detection-box';
      box.style.left = `${x}px`;
      box.style.top = `${y}px`;
      box.style.width = `${w}px`;
      box.style.height = `${h}px`;
      box.style.borderColor = getColorForLabel(label);
      
      // Create label
      const labelElement = document.createElement('div');
      labelElement.className = 'detection-label';
      labelElement.style.left = `${x}px`;
      labelElement.style.top = `${y - 20}px`;
      labelElement.style.backgroundColor = getColorForLabel(label);
      labelElement.textContent = `${label} (${confidence.toFixed(0)}%)`;
      
      container.appendChild(box);
      container.appendChild(labelElement);
    }
    
    // Save trained model to browser storage
    async function saveModel() {
      if (!window.model) {
        updateStatus("No trained model to save");
        return;
      }
      
      try {
        logDebug("Saving model to local storage");
        await window.model.save('localstorage://my-annotation-model');
        
        // Also save labels
        localStorage.setItem('model-labels', JSON.stringify(window.model.labels));
        logDebug(`Saved model with labels: ${window.model.labels.join(', ')}`);
        
        updateStatus("Model saved to browser storage");
      } catch (error) {
        console.error("Save model error:", error);
        logDebug(`ERROR saving model: ${error.message}`);
        updateStatus(`Save failed: ${error.message}`);
      }
    }
    
    // Load saved model from browser storage
    async function loadModel() {
      try {
        updateStatus("Loading model...");
        logDebug("Loading model from local storage");
        
        window.model = await tf.loadLayersModel('localstorage://my-annotation-model');
        logDebug("Model loaded successfully");
        
        // Load labels
        const labelsString = localStorage.getItem('model-labels');
        if (labelsString) {
          window.model.labels = JSON.parse(labelsString);
          logDebug(`Loaded model with labels: ${window.model.labels.join(', ')}`);
        } else {
          throw new Error("No labels found for the model");
        }
        
        updateStatus("Model loaded successfully");
        
        // Enable inference button
        document.getElementById('inferBtn').disabled = false;
      } catch (error) {
        console.error("Load model error:", error);
        logDebug(`ERROR loading model: ${error.message}`);
        updateStatus(`Load failed: ${error.message}`);
      }
    }
    
    // Make functions available globally
    window.getColorForLabel = getColorForLabel;
    window.logDebug = logDebug;
    window.clearDebugLog = clearDebugLog;
    window.capture = capture;
    window.closePreview = closePreview;
    window.updateClassCount = updateClassCount;
    window.removeDatasetEntry = removeDatasetEntry;
    window.updateDatasetList = updateDatasetList;
    window.train = train;
    window.toggleInference = toggleInference;
    window.inferenceLoop = inferenceLoop;
    window.runInference = runInference;
    window.generateRegions = generateRegions;
    window.addDetectionBox = addDetectionBox;
    window.saveModel = saveModel;
    window.loadModel = loadModel;
  </script>
</body>
</html>
