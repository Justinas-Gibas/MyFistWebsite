<!DOCTYPE html>
<html lang="en">
<head>
    <title>Three.js AR/XR - Enhanced Virtual Art Gallery</title>
    <meta charset="UTF-8">
    <meta name="author" content="Justinas Gibas" />
    <meta name="description" content="Three.js AR/XR - Enhanced Virtual Art Gallery">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">

    <style>
        body, html { margin: 0; height: 100%; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

<script async src="./Deeper/lib/utils/es-module-shims.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "./Deeper/lib/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { FontLoader } from './Deeper/lib/loaders/FontLoader.js';
import { TextGeometry } from './Deeper/lib/utils/TextGeometry.js';
import { GLTFLoader } from './Deeper/lib/loaders/GLTFLoader.js';
import { RGBELoader } from './Deeper/lib/loaders/RGBELoader.js';
import { OrbitControls } from './Deeper/lib/controls/OrbitControls.js';
import { Sky } from './Deeper/lib/utils/Sky.js';
import Stats from './Deeper/lib/libs/stats.module.js';

let camera, scene, renderer, controls, carouselGroup;
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const targetPosition = new THREE.Vector3();
let moveCamera = false;

const stats = new Stats();
document.body.appendChild(stats.dom);

const projects = [
    { name: "L2Web", description: "Responsive website project", link: "./Deeper/L2Web/L2Web.html" },
    { name: "GLTFLoader", description: "GLTFLoader project", link: "./Deeper/GLTFLoader/GLTFLoader.html" },
    { name: "Chunks World", description: "GLTF chunk project", link: "./Deeper/ChunkWorld/ChunkWorld.html" },
    { name: "Chunks World++", description: "Enhanced GLTF chunk project", link: "./Deeper/ChunkWorld++/ChunkWorld++.html" },
    { name: "Volume Editor", description: "Volume Editor project", link: "./Deeper/VolumeEditor/VolumeEditor.html" },
    { name: "VRSpace", description: "VRSpace for art", link: "./Deeper/VRSpace/VRSpace.html" }
];

function initGallery() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 1.6, 20);

    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.6, 0);
    controls.maxDistance = 30;
    controls.minDistance = 5;
    controls.update();

    setupLighting();
    setupSky();
    setupGroundPlane();
    loadProjectPosters();

    window.addEventListener('resize', onWindowResize);
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('dblclick', onDoubleClick);

    animate();
}

function setupLighting() {
    const ambientLight = new THREE.HemisphereLight(0xffffff, 0xffffff, 1);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(5, 10, 7.5);
    directionalLight.castShadow = true;
    scene.add(directionalLight);
}

function setupSky() {
    const sky = new Sky();
    sky.scale.setScalar(4500);
    scene.add(sky);

    const sun = new THREE.Vector3();
    const effectController = {
        turbidity: 0.0,
        rayleigh: 0.0,
        mieCoefficient: 0.0,
        mieDirectionalG: 1.0,
        elevation: 90,
        azimuth: 90,
        exposure: renderer.toneMappingExposure
    };

    function updateSun() {
        const phi = THREE.MathUtils.degToRad(90 - effectController.elevation);
        const theta = THREE.MathUtils.degToRad(effectController.azimuth);
        sun.setFromSphericalCoords(1, phi, theta);
        sky.material.uniforms['sunPosition'].value.copy(sun);
        renderer.toneMappingExposure = effectController.exposure;
    }

    updateSun();
}

function setupGroundPlane() {
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        roughness: 1.0,
        metalness: 0.0,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    ground.name = 'groundPlane';
    scene.add(ground);
}

function loadProjectPosters() {
    const loader = new FontLoader();
    loader.load('./Deeper/lib/styles/helvetiker_regular.typeface.json', function (font) {
        const planeGeometry = new THREE.PlaneGeometry(3, 2);

        carouselGroup = new THREE.Group();
        scene.add(carouselGroup);

        projects.forEach((project, index) => {
            const material = new THREE.MeshStandardMaterial({ color: 0x888888 });
            const poster = new THREE.Mesh(planeGeometry, material);
            const angle = (index / projects.length) * Math.PI * 2;
            const radius = 18;
            poster.position.set(Math.cos(angle) * radius, 2, Math.sin(angle) * radius);
            poster.lookAt(camera.position);
            poster.userData = { clickable: true, link: project.link };
            poster.name = 'projectPoster';
            carouselGroup.add(poster);

            const textGeometry = new TextGeometry(project.name, {
                font: font,
                size: 0.2,
                depth: 0.01,
                curveSegments: 4,
                bevelEnabled: false,
            });

            const textMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const textMesh = new THREE.Mesh(textGeometry, textMaterial);
            textMesh.position.set(poster.position.x, poster.position.y - 1.5, poster.position.z);
            textMesh.lookAt(camera.position);
            carouselGroup.add(textMesh);
        });
    });
}

function onMouseMove(event) {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(carouselGroup.children, true);

    carouselGroup.children.forEach((child) => {
        if (child.name === 'projectPoster' && child.material) {
            child.material.color.set(0x888888);
        }
    });

    if (intersects.length > 0) {
        const obj = intersects[0].object;
        if (obj.name === 'projectPoster' && obj.material) {
            obj.material.color.set(0xaaaaaa);
        }
    }
}

function onDoubleClick(event) {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(carouselGroup.children, true);

    if (intersects.length > 0) {
        const obj = intersects[0].object;
        if (obj.userData.clickable) {
            window.open(obj.userData.link, '_blank');
        }
    }
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    if (moveCamera) {
        const delta = 0.05;
        camera.position.lerp(targetPosition, delta);
        controls.target.lerp(targetPosition, delta);
        if (camera.position.distanceTo(targetPosition) < 0.1) {
            moveCamera = false;
        }
    }

    renderer.setAnimationLoop(() => {
        stats.begin();
        renderer.render(scene, camera);
        stats.end();
    });
}

initGallery();
</script>

</body>
</html>
